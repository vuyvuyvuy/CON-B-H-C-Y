<title>Phòng Trực Y4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bố cục: một "monitor phòng trực" — thanh tab dính trên cùng, nội dung 1 cột rộng tối đa 960px,
   mọi số liệu (ngày còn lại, HP, sinh hiệu) dùng font mono như màn hình theo dõi bệnh nhân.
   Thiết kế chủ ý chỉ một giao diện tối, như đèn phòng trực ban đêm. */
:root {
  --bg: #0c1517;          /* xanh đen phòng hồi sức */
  --panel: #121f22;
  --panel-2: #182a2e;
  --line: #24393e;
  --fg: #e4ece9;
  --muted: #8ea39f;
  --dim: #5d716d;
  --ecg: #3ddc97;         /* xanh nhịp tim trên monitor */
  --alarm: #ff5a4f;       /* đỏ báo động */
  --warn: #f2b134;        /* vàng cảnh báo / nhang */
  --spo2: #5cc8ff;
  --ink-on-light: #0c1517;
  --font-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 15px/1.55 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--spo2); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 21px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- thanh trên ---------- */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.logo { font: 700 13px var(--font-mono); color: var(--alarm); white-space: nowrap; letter-spacing: .06em; }
.logo i { font-style: normal; display: inline-block; animation: beat 1.2s infinite; }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.3); } 30% { transform: scale(.95); } }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
nav::-webkit-scrollbar { display: none; }
nav button { background: none; border: 0; padding: 7px 11px; border-radius: 8px; color: var(--muted); white-space: nowrap; font-weight: 500; }
nav button:hover { color: var(--fg); background: var(--panel); }
nav button[aria-current="true"] { color: var(--fg); background: var(--panel-2); }
nav .badge { margin-left: 5px; font: 700 11px var(--font-mono); background: var(--warn); color: var(--ink-on-light); padding: 1px 6px; border-radius: 99px; }

main { padding-block: 22px 60px; display: grid; gap: 18px; }

/* ---------- khối dùng chung ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 9px 14px; border-radius: 8px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.red { background: var(--alarm); border-color: var(--alarm); color: #fff; }
.btn.green { background: var(--ecg); border-color: var(--ecg); color: var(--ink-on-light); }
.btn.amber { background: var(--warn); border-color: var(--warn); color: var(--ink-on-light); }
.btn.ghost { background: none; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.big { padding: 13px 18px; font-size: 16px; }
.chip { display: inline-flex; gap: 4px; align-items: center; font: 600 12px var(--font-mono); padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.chip.red { background: color-mix(in srgb, var(--alarm) 22%, transparent); color: #ffb0aa; }
.chip.amber { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.chip.green { background: color-mix(in srgb, var(--ecg) 18%, transparent); color: var(--ecg); }
.chip.blue { background: color-mix(in srgb, var(--spo2) 18%, transparent); color: var(--spo2); }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type=text], input[type=number], input[type=datetime-local], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; color: var(--fg); }
textarea { min-height: 220px; resize: vertical; font: 13px/1.5 var(--font-mono); }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 26px 18px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.note { font-size: 13px; color: var(--muted); }
.toast { width: max-content; position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--ink-on-light); padding: 9px 16px; border-radius: 99px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }

/* ---------- đếm ngược ---------- */
.hero { border-color: color-mix(in srgb, var(--alarm) 45%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--alarm) 14%, var(--panel)) 0%, var(--panel) 55%); display: grid; gap: 12px; }
.clock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.clock div { background: rgba(0,0,0,.35); border: 1px solid color-mix(in srgb, var(--alarm) 30%, transparent); border-radius: 8px; text-align: center; padding: 10px 2px 6px; }
.clock b { display: block; font: 700 clamp(26px, 7vw, 46px)/1 var(--font-mono); color: var(--alarm); }
.clock span { font: 600 10px var(--font-mono); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
.verdict { font-weight: 600; }
.exams { display: grid; }
.exam { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 2px; border-top: 1px solid var(--line); align-items: center; cursor: pointer; }
.exam:first-child { border-top: 0; }
.exam:hover h3 { color: var(--spo2); }
.exam .days { font: 700 24px var(--font-mono); text-align: right; }
.exam .days small { font: 500 11px var(--font-body); color: var(--dim); margin-left: 3px; }
.exam .bar { grid-column: 1 / -1; height: 3px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.exam .bar i { display: block; height: 100%; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 10px; }
.stat b { display: block; font: 700 22px var(--font-mono); }
.stat span { font-size: 12px; color: var(--muted); }
.rank b { font-family: var(--font-display); font-size: 22px; font-weight: 800; display: block; margin-top: 4px; }

/* ---------- môn & bài ---------- */
.lessons { display: grid; }
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.lesson:first-child { border-top: 0; }
.lesson .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 560px) { .lesson { grid-template-columns: minmax(0, 1fr); } .lesson .acts { justify-content: flex-start; } }
.qlist { grid-column: 1 / -1; display: grid; gap: 8px; padding: 6px 0 4px; }
.qitem { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; min-width: 0; }
.qitem p { overflow-wrap: anywhere; }
.qitem ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; }
.qitem li.ok { color: var(--ecg); font-weight: 600; }

/* ---------- câu hỏi / ca ---------- */
.monitor { background: #050b0c; border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.monitor.dead { border-color: var(--alarm); background: color-mix(in srgb, var(--alarm) 10%, #050b0c); }
.hp { height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.hp i { display: block; height: 100%; transition: width .6s ease, background .6s; }
.vitals { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.vitals div { background: var(--panel); border-radius: 6px; padding: 6px 2px; text-align: center; min-width: 0; }
.vitals dt { font: 600 10px var(--font-mono); color: var(--dim); }
.vitals dd { margin: 0; font: 700 17px var(--font-mono); white-space: nowrap; }
.vitals dd.small { font-size: 12px; line-height: 25px; }
.blink { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.qcard { display: grid; gap: 14px; }
.stem { font-size: 17px; font-weight: 600; white-space: pre-line; overflow-wrap: anywhere; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt .k { font: 700 14px var(--font-mono); color: var(--dim); }
.opt.right { border-color: var(--ecg); background: color-mix(in srgb, var(--ecg) 13%, var(--panel)); }
.opt.wrong { border-color: var(--alarm); background: color-mix(in srgb, var(--alarm) 15%, var(--panel)); }
.opt.faded { opacity: .45; }
.opt:disabled { cursor: default; }
.opt small { display: block; color: var(--muted); margin-top: 4px; font-size: 13px; }
.feedback { border-radius: 9px; padding: 12px 14px; display: grid; gap: 8px; }
.feedback.bad { background: color-mix(in srgb, var(--alarm) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--alarm) 50%, transparent); }
.feedback.good { background: color-mix(in srgb, var(--ecg) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ecg) 40%, transparent); }
.feedback .roast { font-weight: 700; }
.feedback.bad .roast { color: #ffb0aa; }
.feedback.good .roast { color: var(--ecg); }
.explain { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; white-space: pre-line; border-left: 3px solid var(--spo2); }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.kbd { font: 600 11px var(--font-mono); color: var(--dim); }
.vignette { white-space: pre-line; font-size: 15.5px; line-height: 1.7; max-width: 72ch; }

/* ---------- nghĩa trang ---------- */
.graves { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grave { border: 1px solid var(--line); background: var(--panel); border-radius: 60px 60px 10px 10px; padding: 18px 14px 14px; text-align: center; display: grid; gap: 4px; }
.grave.saved { opacity: .5; }
.grave .stone { font-size: 30px; }
.grave .incense { letter-spacing: 2px; font-size: 15px; }
.grave .incense .off { opacity: .2; }

/* ---------- nạp đề ---------- */
.preview { display: grid; gap: 10px; }
.pitem { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.pitem.off { opacity: .45; }
.pitem .meta { display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 560px) { .pitem .meta { grid-template-columns: minmax(0, 1fr); } }
.progress { height: 6px; background: var(--panel-2); border-radius: 6px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--alarm); transition: width .4s; }

/* ---------- thẻ Anki (HTML đã làm sạch) ---------- */
.rich { overflow-wrap: anywhere; }
.rich mark { background: none; color: #ff8f80; font-weight: 700; }
.rich b { color: var(--fg); }
.rich small { color: var(--muted); font-size: 13px; }
.rich blockquote { margin: 8px 0 0; padding: 6px 10px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 9%, transparent); color: #f1dfb6; font-size: 13.5px; border-radius: 0 6px 6px 0; }
.rich img { display: block; max-width: 100%; height: auto; margin-top: 8px; border-radius: 8px; background: #fff; }
.rich ul, .rich ol { margin: 4px 0; padding-left: 20px; }
.rich table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
.rich td, .rich th { border: 1px solid var(--line); padding: 3px 6px; }
.stem.rich { font-weight: 600; }
.back { border-top: 1px dashed var(--line); padding-top: 12px; font-size: 16px; }
.stars { font: 700 11px var(--font-mono); color: var(--warn); letter-spacing: 1px; }
.lecture { background: var(--bg); border-left: 3px solid var(--ecg); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 14px; white-space: pre-line; display: grid; gap: 6px; }
.lecture .eyebrow { color: var(--ecg); }
.reader { white-space: pre-line; font-size: 15px; line-height: 1.65; background: var(--bg); border-radius: 8px; padding: 14px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.reader mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; }

/* ---------- trong một môn ---------- */
.subbar { display: grid; gap: 10px; margin-bottom: 18px; }
.subbar > button { justify-self: start; }
.subbar h1 { margin: 0; }
.subtabs { border-bottom: 1px solid var(--line); padding-bottom: 6px; flex-wrap: wrap; }
@media (max-width: 460px) { .logo { font-size: 0; } .logo i { font-size: 18px; } }
.subtabs button[aria-current="true"] { color: var(--fg); background: var(--panel-2); box-shadow: inset 0 -2px 0 var(--alarm); }

/* ---------- câu bựa ---------- */
.fun { margin: 0; font-size: 16.5px; line-height: 1.6; }
.fun mark { background: none; color: #ff8f80; font-weight: 700; }
details.orig { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--muted); }
details.orig > summary { cursor: pointer; }

/* ---------- tình huống ---------- */
.cases { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.casecard { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 6px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.casecard:hover, .casecard:focus-visible { border-color: var(--alarm); }
.casecard:focus-visible { outline: 2px solid var(--alarm); outline-offset: 2px; }
.casecard b { font-weight: 600; line-height: 1.35; }
details.setting > summary, details.covers > summary { cursor: pointer; list-style-position: inside; }
details.setting .vignette { margin: 8px 0 0; }
details.covers { display: grid; gap: 8px; }
details.covers .qlist { margin: 8px 0; }

@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

<header>
  <div class="wrap">
    <span class="logo"><i>✚</i> PHÒNG TRỰC</span>
    <nav id="nav" aria-label="Khu vực"></nav>
  </div>
</header>
<main class="wrap" id="app">
  <div class="empty"><p class="eyebrow">Đang bật monitor…</p></div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* =====================================================================
   PHÒNG TRỰC Y4 — ngân hàng đề cũ + flashcard SRS + ca cấp cứu, giọng mỏ hỗn.
   Lưu trữ: capability `db` (chỉ chủ artifact đọc/ghi). Gọi Claude: `sample`.
     subjects/<code>                       môn: tên, lịch thi, danh sách bài
     subjects/<code>/questions/<id>        câu đề cũ (đủ nội dung) hoặc trạng thái ôn của thẻ Anki
     packs/*.json, notes/*.json, media/*   (file tĩnh đi kèm trang) thẻ Anki, bài soạn, hình
     graves/<id>                           bệnh nhân đã "đăng xuất"
     cases/<code>.json                     (file tĩnh) ca tình huống soạn sẵn theo từng bài; trạng thái ôn
                                           của từng câu lưu như thẻ Anki: subjects/<code>/questions/c_…
     cases/<code>__<lesson>                ca cấp cứu AI gen gần nhất của 1 bài
     meta/stats                            tổng câu, câu sai, streak…
   ===================================================================== */

const TZ = "Asia/Ho_Chi_Minh";
const MIN = 60e3, DAY = 864e5;

const S = {
  db: null, sample: null, canImages: false,
  subjects: {},            // code -> subject
  questions: {},           // code -> { id -> question } (gộp gói thẻ tĩnh + dữ liệu trong kho)
  docs: {},                // code -> { id -> document trong kho }
  pack: {},                // code -> { cards: {id -> thẻ}, notes: {lessonId -> file bài soạn} }
  cases: {},               // code -> { lessonId -> [ca tình huống soạn sẵn] }
  caseById: {},            // id ca -> ca (kèm code, lesson)
  notesCache: {},          // file -> [trang]
  reader: null,            // trình đọc bài soạn
  graves: {},
  stats: { total: 0, wrong: 0, killed: 0, saved: 0, streak: 0, best: 0, lastDay: null },
  loaded: { subjects: false },
  tab: "home",
  subject: null,           // môn đang xem
  openLesson: null,
  practice: null,          // phiên luyện đề
  review: null,            // phiên thắp nhang
  imp: null,               // phiên nạp đề
  er: null,                // ca cấp cứu
  cs: null,                // tab Tình huống: { code }
};

/* ------------------------------------------------------------------ */
/* Tiện ích                                                            */
/* ------------------------------------------------------------------ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = (p = "") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/[^a-z0-9]+/g, " ").trim();
const ymd = (d) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(d);
const daysUntil = (iso, now = new Date()) => Math.round((Date.parse(ymd(new Date(iso))) - Date.parse(ymd(now))) / DAY);
const fmtDate = (iso) => new Intl.DateTimeFormat("vi-VN", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
const fmtShort = (ms) => new Intl.DateTimeFormat("vi-VN", { timeZone: TZ, hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" }).format(new Date(ms));

/* Làm sạch HTML thẻ Anki trước khi hiển thị: chỉ giữ thẻ định dạng, hình chỉ lấy từ media/ đi kèm trang. */
const RICH_OK = new Set(["B", "I", "U", "BR", "MARK", "BLOCKQUOTE", "UL", "OL", "LI", "SUB", "SUP", "IMG", "DIV", "P", "SMALL", "TABLE", "TBODY", "THEAD", "TR", "TD", "TH"]);
const richCache = new Map();
function rich(html) {
  if (richCache.has(html)) return richCache.get(html);
  const doc = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
  const clean = (el) => {
    for (const c of [...el.childNodes]) {
      if (c.nodeType === 3) continue;
      if (c.nodeType !== 1 || !RICH_OK.has(c.tagName)) { c.replaceWith(document.createTextNode(c.textContent || "")); continue; }
      const src = c.tagName === "IMG" ? c.getAttribute("src") : null;
      for (const a of [...c.attributes]) c.removeAttribute(a.name);
      if (c.tagName === "IMG") { if (src && /^media\/[\w.\-]+$/.test(src)) { c.setAttribute("src", src); c.setAttribute("alt", ""); c.setAttribute("loading", "lazy"); } else { c.remove(); continue; } }
      clean(c);
    }
  };
  const root = doc.body.firstChild; clean(root);
  const out = root.innerHTML; richCache.set(html, out); return out;
}

/* Bài soạn: chữ từng trang PDF, tải khi cần. Tìm đoạn liên quan bằng độ trùng cụm 2 chữ. */
async function loadNotes(code, lesson) {
  const file = S.pack[code]?.notes?.[lesson]; if (!file) return null;
  if (!S.notesCache[file]) S.notesCache[file] = fetch(file).then((r) => r.ok ? r.json() : null).then((j) => j?.pages || null).catch(() => null);
  return S.notesCache[file];
}
const grams = (t) => { const w = norm(t).split(" ").filter((x) => x.length > 1); const g = new Set(); for (let i = 0; i < w.length; i++) { g.add(w[i]); if (i + 1 < w.length) g.add(w[i] + " " + w[i + 1]); } return g; };
function passages(pages, q, k = 2) {
  const want = grams(q.stem + " " + (q.options?.find((o) => o.k === q.answer)?.t || q.answer));
  const out = [];
  pages.forEach((txt, pi) => {
    const slideHit = q.slide && new RegExp(`\\bSlide\\s*${q.slide}\\b`, "i").test(txt);
    for (const para of txt.split(/\n\s*\n/)) {
      const t = para.trim(); if (t.length < 40) continue;
      const g = grams(t); let hit = 0;
      for (const x of want) if (g.has(x)) hit += x.includes(" ") ? 2 : 1;
      out.push({ page: pi + 1, text: t, score: hit / Math.sqrt(g.size + 20) + (slideHit ? 0.6 : 0) });
    }
  });
  return out.sort((a, b) => b.score - a.score).slice(0, k).filter((x) => x.score > 0.4);
}
async function lectureHTML(code, q, k = 2) {
  const pages = await loadNotes(code, q.lesson);

  const ps = passages(pages, q, k);
  if (!ps.length) return `<div class="lecture"><span class="eyebrow">📖 Bài soạn</span><span class="note">Không tìm thấy đoạn khớp. <button class="btn small" data-act="open-reader" data-code="${code}" data-lesson="${q.lesson}">Mở bài soạn</button></span></div>`;

}

/* Ghi tuần tự theo từng document: không bao giờ có 2 lệnh ghi chồng lên 1 doc. */
const writeChains = {};
function write(path, fn) {
  const prev = writeChains[path] || Promise.resolve();
  const next = prev.catch(() => {}).then(fn).catch((e) => {
    console.error("db write", path, e);
    toast(e?.code === "quota_exceeded" ? "Hết dung lượng lưu trữ. Xoá bớt câu cũ." : "Không lưu được. Kiểm tra mạng rồi thử lại.");
    throw e;
  });
  writeChains[path] = next;
  return next;
}
const qPath = (code, id) => `subjects/${code}/questions/${id}`;
/* Mỗi câu có b = hash(id) % 8: kho chỉ trả tối đa 1000 câu/truy vấn, môn nhiều câu thì chia nhóm theo b. */
const bucket = (id) => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h) % 8; };
const STATE_FIELDS = ["seen", "wrong", "card", "lastWrongAt", "explanation", "aiExplained", "aiNote", "deleted"];
function rebuild(code) {
  const pack = S.pack[code]?.cards || {}, docs = S.docs[code] || {}, m = {};
  for (const id in pack) { const d = docs[id]; if (d?.deleted) continue; m[id] = { ...pack[id], ...(d || {}), id }; }
  for (const id in docs) if (!pack[id] && !docs[id].deleted) m[id] = { ...docs[id], id };
  S.questions[code] = m;
}
function saveQuestion(code, q) {
  const packCard = S.pack[code]?.cards?.[q.id];
  let body;
  if (packCard) {            // thẻ Anki: nội dung nằm trong gói, kho chỉ giữ trạng thái ôn
    body = {};
    for (const k of STATE_FIELDS) if (q[k] !== undefined) body[k] = q[k];
    if (q.lesson !== packCard.lesson) body.lesson = q.lesson;
  } else { body = { ...q }; delete body.id; }
  body.b = bucket(q.id);
  (S.docs[code] ||= {})[q.id] = body;          // cập nhật lạc quan
  rebuild(code);
  if (!S.db) return Promise.resolve();
  return write(qPath(code, q.id), () => S.db.doc(qPath(code, q.id)).set(body));
}
function deleteQuestion(code, id) {
  if (S.pack[code]?.cards?.[id]) return saveQuestion(code, { ...S.questions[code][id], deleted: true });
  delete (S.docs[code] || {})[id];
  rebuild(code);
  if (S.db) return write(qPath(code, id), () => S.db.doc(qPath(code, id)).delete());
}
function saveSubject(s) {
  S.subjects[s.code] = s;
  if (!S.db) return Promise.resolve();
  const body = { ...s }; delete body.code;
  return write("subjects/" + s.code, () => S.db.doc("subjects/" + s.code).set(body));
}

  if (!S.db) return Promise.resolve();

}

/* SRS — SM-2 kiểu Anki                                                */
/* ------------------------------------------------------------------ */
const SRS = { learn: [1, 10], relearn: [10], grad: 1, easyIvl: 4, ease: 2.5, minEase: 1.3, easyBonus: 1.3, hard: 1.2, lapse: 0.2, maxIvl: 365 };
const newCard = (now = Date.now()) => ({ state: "new", due: now, ivl: 0, ease: SRS.ease, reps: 0, lapses: 0, step: 0, last: null });
function ratingFrom(correct, ms) { return !correct ? "again" : ms < 8000 ? "easy" : ms > 45000 ? "hard" : "good"; }

function schedule(prev, rating, now = Date.now(), examAt = null) {
  const c = { ...prev, reps: prev.reps + 1, last: now };
  const clamp = (t) => { if (!examAt) return t; const lim = examAt - DAY; return lim > now ? Math.min(t, lim) : t; };
  const learning = prev.state === "new" || prev.state === "learning" || prev.state === "relearning";
  if (learning) {
    const steps = prev.state === "relearning" ? SRS.relearn : SRS.learn;
    if (rating === "again") { c.state = prev.state === "relearning" ? "relearning" : "learning"; c.step = 0; c.due = clamp(now + steps[0] * MIN); return c; }
    if (rating === "easy") { c.state = "review"; c.step = 0; c.ivl = prev.state === "relearning" ? Math.max(1, prev.ivl) : SRS.easyIvl; c.due = clamp(now + c.ivl * DAY); return c; }
    const nx = prev.step + (rating === "good" ? 1 : 0);
    if (nx < steps.length) { c.state = prev.state === "new" ? "learning" : prev.state; c.step = nx; c.due = clamp(now + steps[nx] * MIN); return c; }
    c.state = "review"; c.step = 0; c.ivl = prev.state === "relearning" ? Math.max(1, prev.ivl) : SRS.grad; c.due = clamp(now + c.ivl * DAY); return c;
  }
  if (rating === "again") { c.state = "relearning"; c.lapses = prev.lapses + 1; c.ease = Math.max(SRS.minEase, prev.ease - 0.2); c.ivl = Math.max(1, prev.ivl * SRS.lapse); c.step = 0; c.due = clamp(now + SRS.relearn[0] * MIN); return c; }
  const over = Math.max(0, (now - prev.due) / DAY);
  let ivl;
  if (rating === "hard") { c.ease = Math.max(SRS.minEase, prev.ease - 0.15); ivl = prev.ivl * SRS.hard; }
  else if (rating === "good") ivl = (prev.ivl + over / 2) * prev.ease;
  else { c.ease = prev.ease + 0.15; ivl = (prev.ivl + over) * prev.ease * SRS.easyBonus; }
  c.ivl = Math.min(SRS.maxIvl, Math.max(prev.ivl + 1, Math.round(ivl)));
  c.due = clamp(now + c.ivl * DAY);
  return c;
}

function nextExamAt(code) {
  const s = S.subjects[code]; if (!s) return null;
  const t = (s.exams || []).filter((e) => !e.done && Date.parse(e.at) > Date.now()).map((e) => Date.parse(e.at)).sort((a, b) => a - b)[0];
  return t || null;
}

  if (tab === "er" && !S.er?.case) loadSavedCase(S.er?.code || subjectList().find((x) => qs(x.code).length >= 3)?.code);
  try { localStorage.setItem("pt.tab", tab); } catch {}
  render();
  window.scrollTo({ top: 0 });
}
function render() {
  renderNav();
  const app = $("#app");
  const view = { home: viewHome, cases: viewCases, subject: viewSubject, practice: viewPractice, review: viewReview, er: viewER, import: viewImport, graves: viewGraves, reader: viewReader }[S.tab] || viewHome;
  app.innerHTML = (inSubject() ? subjectBar() : "") + view();
  afterRender();
}
/* Dữ liệu đổi từ máy khác: chỉ vẽ lại các màn hình "đọc", không phá phiên đang làm hay ô đang gõ. */
let pendingRender = false;
function onData() {
  if (pendingRender) return;
  pendingRender = true;
  requestAnimationFrame(() => {
    pendingRender = false;
    renderNav();

    if (!busy) render();
  });
}

function verdict(d) {
  if (d < 0) return ["Đã thi. Kết quả thế nào lòng bạn tự biết.", "var(--dim)"];
  if (d === 0) return ["HÔM NAY. Cầu nguyện đi, học không kịp nữa đâu.", "#e879f9"];
  if (d <= 3) return ["Vùng tử thần. Ngủ là xa xỉ phẩm.", "var(--alarm)"];
  if (d <= 7) return ["Một tuần. Đủ để học… nếu bỏ điện thoại xuống.", "#ff9a4f"];
  if (d <= 14) return ["Còn kịp. Năm nào cũng có người nói câu này, rồi rớt.", "var(--warn)"];
  return ["Còn xa. Đó chính xác là điều người rớt môn từng nghĩ.", "var(--ecg)"];
}
function subjectCounts(code) {
  const list = qs(code);
  const anki = list.filter(isAnki).length;
  return { n: list.length, anki, exam: list.length - anki, wrong: list.filter((q) => q.wrong > 0).length, due: list.filter((q) => isDue(q)).length };
}
function viewHome() {
  if (!S.loaded.subjects) return `<div class="empty"><p class="eyebrow">Đang tải dữ liệu…</p></div>`;
  if (!subjectList().length) return `<div class="empty"><h2>Chưa có môn nào</h2><p class="muted">Kho dữ liệu đang trống. Nhắn Claude trong khung chat: “nạp lịch thi và danh sách môn” là xong.</p><button class="btn" data-act="add-subject">+ Thêm môn</button></div>`;
  const now = new Date();
  const exams = allExams();
  const upcoming = exams.filter((e) => !e.done && Date.parse(e.at) > now.getTime());
  const past = exams.filter((e) => e.done || Date.parse(e.at) <= now.getTime());
  const next = upcoming[0];
  const r = rank();
  const st = S.stats;
  const due = dueList().length;

  let hero = "";
  if (next) {
    const d = daysUntil(next.at, now);
    const [vt, vc] = verdict(d);
    const c = subjectCounts(next.code);
    hero = `<section class="panel hero">
      <p class="eyebrow" style="color:var(--alarm)">Án tử gần nhất</p>
      <div class="row between"><h1>${esc(next.title)}</h1><span class="chip">${esc(next.code)}</span></div>
      <p class="muted">${fmtDate(next.at)}</p>
      <div class="clock" data-countdown="${esc(next.at)}">${clockCells(next.at)}</div>
      <p class="verdict" style="color:${vc}">${vt}</p>
      <p class="note">${c.n ? `Kho môn này: <b>${c.exam}</b> câu đề cũ · <b>${c.anki}</b> thẻ Anki · ${c.wrong} câu từng sai · ${c.due} thẻ đến hạn.` : `Chưa có câu nào của môn này. Nạp đề đi, còn ${d} ngày.`}</p>
      <div class="row"><button class="btn red" data-act="practice-subject" data-code="${next.code}">Luyện đề ${esc(next.title)}</button><button class="btn" data-act="open-subject" data-code="${next.code}">Xem các bài</button></div>
    </section>`;
  }

  const list = upcoming.slice(next ? 1 : 0).map((e) => {
    const d = daysUntil(e.at, now);
    const c = subjectCounts(e.code);
    const pressure = Math.min(100, Math.max(4, ((30 - d) / 30) * 100));
    const col = d <= 7 ? "var(--alarm)" : d <= 14 ? "var(--warn)" : "var(--ecg)";
    return `<div class="exam" data-act="open-subject" data-code="${e.code}" role="button" tabindex="0">
      <div style="min-width:0"><h3>${esc(e.title)}</h3><p class="note">${fmtDate(e.at)} · ${c.n} câu${c.due ? ` · <span style="color:var(--warn)">${c.due} đến hạn</span>` : ""}</p></div>
      <div class="days" style="color:${col}">${d}<small>ngày</small></div>
      <div class="bar"><i style="width:${pressure}%;background:${col}"></i></div>
    </div>`;

  const noExam = subjectList().filter((s) => !(s.exams || []).some((e) => !e.done && Date.parse(e.at) > now.getTime()));

  return `<div class="row between"><div><h1>Bảng tử thần</h1><p class="muted">Y Việt – Đức · 2026–2027</p></div></div>
  <div class="grid2">
    <div class="stack">
      ${hero}
      ${list ? `<section class="panel"><p class="eyebrow">Hàng chờ hành quyết</p><div class="exams">${list}</div></section>` : ""}
      ${noExam.length ? `<section class="panel stack"><p class="eyebrow">Môn chưa có lịch thi</p><div class="row">${noExam.map((s) => `<button class="btn small ghost" data-act="open-subject" data-code="${s.code}">${esc(s.name)} <span class="dim">· ${qs(s.code).length}</span></button>`).join("")}</div></section>` : ""}
      ${past.length ? `<p class="note">Đã qua: ${past.map((e) => esc(e.title)).join(", ")}. Không ai nhắc lại điểm của bạn đâu. Trừ trang này.</p>` : ""}
    </div>
    <aside class="stack">
      <section class="panel rank"><p class="eyebrow">Danh hiệu hiện tại</p><b style="color:${r.color}">${r.title}</b><p class="note">${r.sub}</p>
        <p class="eyebrow" style="margin-top:8px">Tỷ lệ sai ${st.total ? Math.round(st.wrong / st.total * 100) : 0}% · ${st.wrong}/${st.total} câu</p></section>
      <div class="stats">
        <div class="stat"><b>${liveStreak()}🔥</b><span>Streak · kỷ lục ${st.best || 0}</span></div>
        <div class="stat"><b style="color:${due ? "var(--warn)" : "inherit"}">${due}</b><span>Thẻ đến hạn</span></div>
        <div class="stat"><b style="color:${st.killed ? "var(--alarm)" : "inherit"}">${st.killed}🪦</b><span>Đã tiễn</span></div>
        <div class="stat"><b>${st.saved}</b><span>Xuất viện</span></div>
      </div>
      ${due ? `<button class="btn amber big" data-act="tab" data-id="review">🕯️ Thắp nhang · ${due} thẻ</button>` : ""}
      ${next ? `<button class="btn red big" data-act="open-subject" data-code="${next.code}">Vào ca trực: ${esc(next.title)}</button>` : ""}
    </aside>
  </div>`;
}
function clockCells(at) {
  const ms = Math.max(0, Date.parse(at) - Date.now());
  const p = [[Math.floor(ms / DAY), "ngày"], [Math.floor(ms % DAY / 36e5), "giờ"], [Math.floor(ms % 36e5 / MIN), "phút"], [Math.floor(ms % MIN / 1000), "giây"]];
  return p.map(([v, l]) => `<div><b>${String(v).padStart(2, "0")}</b><span>${l}</span></div>`).join("");
}
setInterval(() => { const el = $("[data-countdown]"); if (el) el.innerHTML = clockCells(el.dataset.countdown); }, 1000);

function viewSubject() {
  const s = S.subjects[S.subject];
  if (!s) { S.tab = "home"; return viewHome(); }
  const list = qs(s.code);
  const byLesson = {};
  for (const q of list) (byLesson[q.lesson || "_none"] ||= []).push(q);
  const lessons = [...(s.lessons || []), ...(byLesson._none ? [{ id: "_none", name: "Chưa xếp bài" }] : [])];
  const exam = (s.exams || []).find((e) => !e.done && Date.parse(e.at) > Date.now());

  const rows = lessons.map((l, li) => {
    const items = (byLesson[l.id] || []).sort((a, b) => (isAnki(a) - isAnki(b)) || ((a.n || 0) - (b.n || 0)) || ((a.createdAt || 0) - (b.createdAt || 0)));
    const nAnki = items.filter(isAnki).length, nExam = items.length - nAnki;
    const wrong = items.filter((q) => q.wrong > 0).length;
    const due = items.filter((q) => isDue(q)).length;
    const hot = items.filter((q) => q.prio === 3).length;
    const open = S.openLesson === l.id;
    const limit = S.openLimit || 40;
    const hasNotes = !!S.pack[s.code]?.notes?.[l.id];
    return `<div class="lesson">
      <div style="min-width:0"><h3>${l.id === "_none" ? "" : `<span class="mono dim">${li + 1}.</span> `}${esc(l.name)}</h3>
        <div class="row" style="gap:6px;margin-top:4px">${nExam ? `<span class="chip blue">${nExam} câu đề</span>` : ""}${nAnki ? `<span class="chip">${nAnki} thẻ Anki</span>` : ""}${!items.length ? `<span class="chip">trống</span>` : ""}${hot ? `<span class="chip amber">★★★ ${hot}</span>` : ""}${wrong ? `<span class="chip red">${wrong} từng sai</span>` : ""}${due ? `<span class="chip amber">${due} đến hạn</span>` : ""}</div></div>
      <div class="acts">
        ${items.length ? `<button class="btn small" data-act="toggle-lesson" data-id="${l.id}">${open ? "Đóng" : "Xem"}</button><button class="btn small red" data-act="practice-lesson" data-code="${s.code}" data-id="${l.id}">Luyện</button>` : ""}
        ${S.cases[s.code]?.[l.id]?.length ? `<button class="btn small" data-act="open-cases" data-code="${s.code}" data-lesson="${l.id}">🚑 ${S.cases[s.code][l.id].length} ca</button>` : ""}
        ${hasNotes ? `<button class="btn small ghost" data-act="open-reader" data-code="${s.code}" data-lesson="${l.id}" title="Đọc bài soạn">📖</button>` : ""}
        ${l.id !== "_none" ? `<button class="btn small ghost" data-act="rename-lesson" data-id="${l.id}" title="Đổi tên bài">✎</button>` : ""}
      </div>
      ${open ? `<div class="qlist">${items.slice(0, limit).map((q) => qItem(s, q)).join("")}${items.length > limit ? `<button class="btn small" data-act="more-q">Hiện thêm (còn ${items.length - limit})</button>` : ""}</div>` : ""}
    </div>`;
  }).join("");

  return `<section class="panel">
    <div class="row between"><p class="eyebrow">${(s.lessons || []).length} bài · ${list.filter((q) => !isAnki(q)).length} câu đề cũ · ${list.filter(isAnki).length} thẻ Anki</p></div>
    ${lessons.length ? `<div class="lessons">${rows}</div>` : `<div class="empty"><p>Môn này chưa có danh sách bài.</p><p class="note">Thêm bài bên dưới, hoặc cứ nạp đề — Claude sẽ đề xuất bài.</p></div>`}
    <form class="row" data-form="add-lesson" style="margin-top:12px"><input type="text" id="new-lesson" placeholder="Tên bài mới, ví dụ: Viêm tai giữa mạn" style="flex:1;min-width:180px" required><button class="btn">+ Thêm bài</button></form>
  </section>
  <section class="panel stack">
    <p class="eyebrow">Lịch thi môn này</p>
    ${(s.exams || []).map((e, i) => `<div class="row between"><span>${esc(e.title)} · <span class="mono">${fmtDate(e.at)}</span></span><label class="row note"><input type="checkbox" data-act="exam-done" data-code="${s.code}" data-idx="${i}" ${e.done ? "checked" : ""}> đã thi</label></div>`).join("") || `<p class="note">Chưa có.</p>`}
    <form class="row" data-form="add-exam" data-code="${s.code}"><input type="text" id="exam-title" placeholder="Tên kỳ thi" value="${esc(s.name)}" style="flex:1;min-width:140px" required><input type="datetime-local" id="exam-at" required style="width:auto"><button class="btn small">+ Thêm lịch thi</button></form>
  </section>`;
}
function qItem(s, q) {
  const lessonOpts = (s.lessons || []).map((l) => `<option value="${l.id}" ${l.id === q.lesson ? "selected" : ""}>${esc(l.name)}</option>`).join("");
  return `<div class="qitem">
    <div class="row between" style="gap:6px"><span class="row" style="gap:8px">${stars(q)}<span class="eyebrow">${isAnki(q) ? "Thẻ Anki" + (q.slide ? " · slide " + esc(q.slide) : "") : esc(q.source || "Đề cũ")}${q.aiAnswer ? " · đáp án do AI giải" : ""}</span></span>
      <div class="row" style="gap:6px">${q.wrong ? `<span class="chip red">sai ${q.wrong}/${q.seen}</span>` : q.seen ? `<span class="chip green">đúng ${q.seen}</span>` : `<span class="chip">chưa làm</span>`}${q.card ? `<span class="chip amber">thẻ ${q.card.state === "review" ? "ôn " + Math.round(q.card.ivl) + "d" : "đang học"}</span>` : ""}</div></div>
    ${isAnki(q) ? `<div class="rich"><b>${rich(q.front)}</b></div><div class="rich note">${qBack(q)}</div>` : `<p>${esc(q.stem)}</p>
    ${q.options?.length ? `<ol>${q.options.map((o) => `<li class="${o.k === q.answer ? "ok" : ""}">${esc(o.k)}. ${esc(o.t)}</li>`).join("")}</ol>` : `<p class="note">Đáp án: ${esc(q.answer)}</p>`}`}
    ${q.explanation ? `<p class="note">💡 ${esc(q.explanation)}</p>` : ""}
    <div class="row" style="gap:6px"><select data-act="move-q" data-code="${s.code}" data-id="${q.id}" style="width:auto;flex:1;min-width:150px;padding:5px 8px;font-size:13px">${lessonOpts}<option value="" ${!q.lesson ? "selected" : ""}>Chưa xếp bài</option></select>
      <button class="btn small ghost" data-act="del-q" data-code="${s.code}" data-id="${q.id}">Xoá</button></div>
  </div>`;
}

function viewReader() {
  const R = S.reader; const s = R && S.subjects[R.code];
  if (!s) { S.tab = "home"; return viewHome(); }
  const lessons = (s.lessons || []).filter((l) => S.pack[R.code]?.notes?.[l.id]);
  const key = S.pack[R.code]?.notes?.[R.lesson];
  const pages = key && S.notesCache[key];
  if (!pages || typeof pages.then === "function") {
    loadNotes(R.code, R.lesson).then((pg) => { S.notesCache[key] = pg || []; if (S.tab === "reader") render(); });
    return `<div class="empty"><p class="eyebrow">Đang mở bài soạn…</p></div>`;
  }
  const qn = norm(R.q || "");
  const hits = qn ? pages.map((t, i) => [i + 1, norm(t).includes(qn)]).filter(([, h]) => h).map(([i]) => i) : [];
  const page = Math.min(Math.max(1, R.page), pages.length || 1);
  let text = esc(pages[page - 1] || "");
  if (R.q) text = text.replace(new RegExp(R.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`);
  return `<div class="row between"><button class="btn small ghost" data-act="open-subject" data-code="${R.code}">← ${esc(s.name)}</button></div>
  <div class="row between"><h1>Bài soạn</h1>
    <select data-act="reader-lesson" style="width:auto;max-width:100%">${lessons.map((l) => `<option value="${l.id}" ${l.id === R.lesson ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select></div>
  <form class="row" data-form="reader-search"><input type="text" id="r-q" placeholder="Tìm trong bài, ví dụ: Rosenmüller" value="${esc(R.q || "")}" style="flex:1;min-width:160px"><button class="btn small">Tìm</button></form>
  ${R.q ? `<p class="note">${hits.length ? `Có ở trang: ${hits.map((h) => `<button class="btn small ghost" data-act="reader-page" data-page="${h}">${h}</button>`).join(" ")}` : "Không thấy trong bài này."}</p>` : ""}
  <div class="row between"><button class="btn small" data-act="reader-page" data-page="${page - 1}" ${page <= 1 ? "disabled" : ""}>← Trang trước</button><span class="mono">Trang ${page}/${pages.length}</span><button class="btn small" data-act="reader-page" data-page="${page + 1}" ${page >= pages.length ? "disabled" : ""}>Trang sau →</button></div>
  <article class="reader">${text}</article>`;
}

function viewPractice() {
  const P = S.practice;
  if (!P?.items) return practiceSetup();
  if (P.done) return practiceSummary();
  const it = P.items[P.i];
  const q = S.questions[it.code]?.[it.id] || it;
  const ans = P.answered;
  const pct = Math.max(0, P.hp);
  const hpCol = pct <= 25 ? "var(--alarm)" : pct <= 60 ? "#ff9a4f" : "var(--ecg)";
  const isMcq = q.options?.length > 0;

  let body;
  if (isMcq) {
    body = `<div class="opts">${q.options.map((o) => {
      let cls = "";
      if (ans) cls = o.k === q.answer ? "right" : o.k === ans.choice ? "wrong" : "faded";
      return `<button class="opt ${cls}" data-act="answer" data-k="${esc(o.k)}" ${ans ? "disabled" : ""}><span class="k">${esc(o.k)}</span><span>${esc(o.t)}</span></button>`;
    }).join("")}</div>`;
  } else if (ans || P.revealed) {
    body = `<div class="back rich">${qBack(q)}</div>${ans ? "" : `<div class="row">
      <button class="btn red" data-act="self-grade" data-r="again">Quên <span class="kbd">1</span></button>
      <button class="btn" data-act="self-grade" data-r="hard">Lờ mờ <span class="kbd">2</span></button>
      <button class="btn green" data-act="self-grade" data-r="good">Nhớ <span class="kbd">3</span></button></div>`}`;
  } else {
    body = `<p class="note">Tự trả lời trong đầu (hoặc nói to lên cho cả phòng nghe) rồi lật.</p><button class="btn amber big" data-act="reveal">Lật thẻ <span class="kbd">Space</span></button>`;
  }

  const cs = it.caseId && S.caseById[it.caseId];
  return `<div class="row between"><div><p class="eyebrow">${esc(P.title)}</p><h2>${cs ? esc(cs.title) + " · " : ""}Câu ${P.i + 1}/${P.items.length}</h2></div><button class="btn small ghost" data-act="end-practice">${cs ? "Rời ca" : "Kết thúc phiên"}</button></div>
  ${cs ? `<details class="panel setting" open><summary class="eyebrow">Bệnh cảnh</summary><p class="vignette">${esc(cs.setting)}</p></details>` : ""}
  <section class="monitor ${P.hp <= 0 ? "dead" : ""}" id="mon">
    <div class="row between"><span><b>${esc(P.patient)}</b> <span class="dim">· bệnh nhân #${P.patientNo}</span></span><span class="mono" style="color:${hpCol}">HP ${Math.max(0, P.hp)}/100</span></div>
    <div class="hp"><i style="width:${pct}%;background:${hpCol}" class="${pct <= 25 ? "blink" : ""}"></i></div>
    <p class="note mono">✓ ${P.right} · ✗ ${P.wrongCount} · 🪦 ${P.killed}</p>
  </section>
  <section class="panel qcard" id="qcard">
    <div class="row between"><span class="eyebrow">${esc(S.subjects[it.code]?.name || "")} · ${esc(lessonName(it.code, q.lesson))}</span><span class="row" style="gap:8px">${stars(q)}<span class="eyebrow">${isAnki(q) ? "Thẻ Anki" + (q.slide ? " · slide " + esc(q.slide) : "") : isCase(q) ? "Tình huống" : esc(q.source || "")}</span></span></div>
    <div class="stem ${isAnki(q) ? "rich" : ""}">${qFront(q)}</div>
    ${body}
    ${ans ? feedbackBlock(q, ans, it.code) : isMcq ? `<p class="kbd">Phím tắt: A–${q.options[q.options.length - 1].k} để chọn</p>` : ""}
  </section>`;
}
function feedbackBlock(q, ans, code) {
  const P = S.practice;
  const last = P.i + 1 >= P.items.length;
  const bad = !ans.correct;
  return `<div class="feedback ${bad ? "bad" : "good"}">
    <p class="roast">${bad ? `−${ans.penalty} HP · ` : ""}${esc(ans.roast)}</p>
    ${bad || ans.rating === "hard" ? `<p class="note mono">Đã thêm vào Thắp nhang: gặp lại sau ${ans.card ? Math.max(1, Math.round((ans.card.due - Date.now()) / MIN)) : 1} phút.</p>` : ""}
    ${bad && S.pack[code]?.notes?.[q.lesson] ? `<div id="lecture" class="stack" style="gap:8px"><div class="lecture"><span class="eyebrow">📖 Bài soạn</span>Đang tìm đoạn liên quan…</div></div>` : ""}
    ${isCase(q) ? `<div class="explain">${esc(q.why)}</div>` : bad || q.explanation ? `<div class="explain" id="explain">${q.explanation ? esc(q.explanation) : ans.explaining ? "Đang gọi Claude nêu lại kiến thức…" : S.sample ? `<button class="btn small" data-act="explain">Nhờ Claude giảng lại câu này</button>` : "Chưa có giải thích cho câu này."}</div>` : ""}
    ${isCase(q) ? caseExtras(q, code, bad) : ""}
    ${q.aiAnswer ? `<p class="note">⚠ Đáp án câu này do AI giải, đề gốc không có đáp án. Thấy sai thì sửa trong trang môn.</p>` : ""}
    <div class="row"><button class="btn ${bad ? "red" : "green"}" data-act="next-q" id="next">${last ? "Xem tổng kết" : "Câu tiếp →"}</button><span class="kbd">Enter</span></div>
  </div>`;
}
/* Câu tình huống: thẻ Anki mà câu này phủ + nhờ Claude giảng sâu hơn (lưu riêng, không đè lời giải soạn sẵn). */
function caseExtras(q, code, bad) {
  const cards = (q.covers || []).map((id) => S.questions[code]?.[id]).filter(Boolean);
  const queued = cards.filter((c) => c.card && c.card.due <= Date.now() + DAY).length;
  return `${cards.length ? `<details class="covers" ${bad ? "open" : ""}><summary class="eyebrow">🗂 ${cards.length} thẻ Anki của bài liên quan câu này</summary>
      <div class="qlist">${cards.map((c) => `<div class="qitem"><div class="row between">${stars(c)}${c.slide ? `<span class="eyebrow">slide ${esc(c.slide)}</span>` : ""}</div><div class="rich"><b>${rich(c.front)}</b></div><div class="rich note">${qBack(c)}</div></div>`).join("")}</div>
      ${queued >= cards.length ? `<p class="note mono">Mấy thẻ này đã nằm trong hàng Thắp nhang.</p>` : `<button class="btn small amber" data-act="cover-review" data-code="${code}" data-id="${q.id}">Đẩy ${cards.length} thẻ này vào Thắp nhang</button>`}</details>` : ""}
    <div class="explain" id="ainote" ${q.aiNote ? "" : 'style="border-left-color:var(--dim)"'}>${q.aiNote ? esc(q.aiNote) : S.sample ? `<button class="btn small" data-act="explain-deep">Vẫn chưa thông? Nhờ Claude giảng sâu hơn</button>` : ""}</div>`;
}
function queueCovers(code, id) {
  const q = S.questions[code]?.[id]; if (!q) return;
  const now = Date.now(); let n = 0;
  for (const cid of q.covers || []) {
    const c = S.questions[code][cid]; if (!c) continue;
    if (c.card && c.card.due <= now + DAY) continue;
    saveQuestion(code, { ...c, card: c.card ? { ...c.card, due: now } : newCard(now) }); n++;
  }
  toast(n ? `${n} thẻ đã vào hàng Thắp nhang. Tối nay khỏi ngủ.` : "Mấy thẻ này đã nằm sẵn trong hàng rồi.");
  render();
}
/* Hai mục riêng của môn: "Đề cũ" (câu thi các năm, kèm nạp đề) và "Thẻ Anki". P.kind khóa loại câu. */
function practiceSetup() {
  const P = S.practice || {};
  const code = S.subject && S.subjects[S.subject] ? S.subject : P.code;
  const s = S.subjects[code];
  if (!s) return `<div class="empty"><p class="muted">Chọn một môn trước.</p></div>`;
  const exam = P.kind === "exam";
  const list = qs(code).filter((q) => (exam ? !isAnki(q) : isAnki(q)));
  const head = exam
    ? `<div class="row between"><h2>Đề cũ</h2><button class="btn small" data-act="sub" data-id="import">+ Nạp đề năm khác</button></div><p class="muted">Câu thi các năm trước, đã xếp vào từng bài. Làm lại nguyên một đề theo đúng thứ tự, hoặc trộn câu theo bài. Sai câu nào thì câu đó vào Thắp nhang.</p>`
    : `<h2>Thẻ Anki</h2><p class="muted">Thẻ của bạn, mặt sau có câu cà khịa. Mỗi phiên là một bệnh nhân 100 HP; sai một thẻ mất 20 HP và thẻ đó vào Thắp nhang.</p>`;
  if (!list.length) return head + (exam
    ? `<div class="empty"><h2>Chưa có đề cũ nào</h2><p class="muted">Dán đề các năm trước vào, Claude tách câu và xếp vào đúng bài.</p><button class="btn red" data-act="sub" data-id="import">Nạp đề cũ</button></div>`
    : `<div class="empty"><h2>Môn này chưa có thẻ Anki</h2><p class="muted">Gửi file .apkg cho Claude trong khung chat.</p></div>`);
  const lessonsWithQ = (s.lessons || []).filter((l) => list.some((q) => q.lesson === l.id));
  const sources = exam ? Object.entries(list.reduce((m, q) => { const k = q.source || "Không rõ nguồn"; (m[k] ||= []).push(q); return m; }, {})) : [];
  return head + `
  ${sources.length ? `<section class="panel stack"><p class="eyebrow">Làm lại nguyên đề</p><div class="cases">${sources.map(([src, qq]) => {
    const wrong = qq.filter((q) => q.wrong).length, done = qq.filter((q) => q.seen).length;
    return `<button class="casecard" data-act="redo-source" data-code="${code}" data-src="${esc(src)}"><b>${esc(src)}</b><span class="note">${qq.length} câu${done ? ` · đã làm ${done}` : ""}${wrong ? ` · <span style="color:var(--alarm)">sai ${wrong}</span>` : ""}</span></button>`;
  }).join("")}</div></section>` : ""}
  <form class="panel stack" data-form="start-practice">
    <p class="eyebrow">${exam ? "Hoặc trộn câu theo bài" : "Luyện thẻ"}</p>
    <input type="hidden" id="p-code" value="${code}"><input type="hidden" id="p-kind" value="${exam ? "exam" : "anki"}">
    <div class="row" style="align-items:end">
      <label class="field" style="flex:1;min-width:180px">Bài<select id="p-lesson"><option value="">Cả môn (${list.length})</option>${lessonsWithQ.map((l) => `<option value="${l.id}" ${P.lesson === l.id ? "selected" : ""}>${esc(l.name)} (${list.filter((q) => q.lesson === l.id).length})</option>`).join("")}</select></label>
      ${exam ? `<input type="hidden" id="p-prio" value="0">` : `<label class="field" style="flex:1;min-width:150px">Mức<select id="p-prio">
        <option value="0">Mọi mức</option><option value="3">Chỉ ★★★ hay thi</option><option value="2">Bỏ câu ít ra thi</option></select></label>`}
      <label class="field" style="flex:1;min-width:150px">Lọc<select id="p-mode">
        <option value="all">Trộn tất cả</option><option value="wrong">Chỉ câu từng sai</option><option value="new">Chỉ câu chưa làm</option></select></label>
    </div>
    <div class="row" style="align-items:end">
      <label class="field" style="width:120px">Số câu<input type="number" id="p-n" min="1" max="300" value="20"></label>
      <button class="btn red big" style="flex:1;min-width:160px">Nhận bệnh nhân</button>
    </div>
  </form>`;
}
/* Làm lại nguyên một đề cũ, giữ thứ tự câu như trong đề. */
function redoSource(code, src) {
  const items = qs(code).filter((q) => !isAnki(q) && (q.source || "Không rõ nguồn") === src)
    .sort((a, b) => ((a.n || 0) - (b.n || 0)) || ((a.createdAt || 0) - (b.createdAt || 0))).map((q) => ({ id: q.id, code }));
  if (!items.length) return;
  S.subject = code;
  S.practice = { code, lesson: "", mode: "all", kind: "exam", prio: 0, items, i: 0, hp: 100, patient: pick(PATIENTS), patientNo: 1, right: 0, wrongCount: 0, answeredCount: 0, killed: 0, sessionWrong: [], startedAt: Date.now(), qStart: Date.now(), title: `${S.subjects[code].name} · ${src}` };
  S.tab = "practice";
  render();
  window.scrollTo({ top: 0 });
}
function practiceSummary() {
  const P = S.practice;
  if (P.caseRef) return caseSummary(P);
  const pct = P.items.length ? Math.round(P.right / P.answeredCount * 100) : 0;
  const alive = P.hp > 0;
  return `<h1>${alive ? "🏥 Xuất viện" : "🪦 Hết ca"}</h1>
  <section class="panel stack">
    <p class="mono" style="font-size:22px">${P.right}/${P.answeredCount} đúng · ${pct}%</p>
    <p>${pct === 100 ? "Không sai câu nào. Đáng ngờ. Có lén mở đáp án không đó?" : pct >= 80 ? `${esc(P.patient)} sống, có di chứng nhẹ. Tạm chấp nhận.` : pct >= 50 ? "Trên trung bình một chút. Đủ để không bị đuổi học, chưa đủ để được gọi là bác sĩ." : "Phiên này là một thảm hoạ y khoa có hệ thống."}</p>
    <p class="note">Bệnh nhân đã tiễn trong phiên: ${P.killed}. ${P.wrongCount} câu sai đã vào hàng Thắp nhang.</p>
    <div class="row"><button class="btn red" data-act="restart-practice">Phiên mới</button>${P.wrongCount ? `<button class="btn amber" data-act="tab" data-id="review">Thắp nhang ngay</button>` : ""}<button class="btn ghost" data-act="tab" data-id="home">Về bảng tử thần</button></div>
  </section>`;
}
function startPractice(code, lesson, mode, n, kind = "all", prio = 0) {
  let pool = qs(code).filter((q) => !lesson || q.lesson === lesson);
  if (kind === "exam") pool = pool.filter((q) => !isAnki(q));
  if (kind === "anki") pool = pool.filter(isAnki);
  if (prio) pool = pool.filter((q) => !q.prio || q.prio >= prio);
  if (mode === "wrong") pool = pool.filter((q) => q.wrong > 0);
  if (mode === "new") pool = pool.filter((q) => !q.seen);
  if (!pool.length) { toast(mode === "wrong" ? "Không có câu nào từng sai ở đây. Hiếm có." : "Không còn câu nào khớp bộ lọc."); return; }
  const items = shuffle(pool).slice(0, n).map((q) => ({ id: q.id, code }));
  const title = `${S.subjects[code].name}${lesson ? " · " + lessonName(code, lesson) : ""}`;
  S.subject = code;
  S.practice = { code, lesson, mode, kind, prio, items, i: 0, hp: 100, patient: pick(PATIENTS), patientNo: 1, right: 0, wrongCount: 0, answeredCount: 0, killed: 0, sessionWrong: [], startedAt: Date.now(), qStart: Date.now(), title };
  S.tab = "practice";
  render();
}
/* choice: đáp án trắc nghiệm; self: "again" | "hard" | "good" khi tự chấm thẻ lật. */
async function answerPractice(choice, self) {
  const P = S.practice; if (!P || P.answered) return;
  const it = P.items[P.i];
  const q = { ...S.questions[it.code][it.id] };
  const correct = self ? self !== "again" : choice === q.answer;
  const ms = Date.now() - P.qStart;
  const now = Date.now();
  q.seen = (q.seen || 0) + 1;
  P.answeredCount++;
  S.stats.total++;
  bumpStreak();
  let card = q.card;
  let text, penalty = 0;
  const rating = self || ratingFrom(correct, ms);
  if (correct) {
    P.right++;
    if (card || rating === "hard") card = schedule(card || newCard(now), rating, now, nextExamAt(it.code));
    text = rating === "hard" ? "Lờ mờ thì cũng như không. Cho qua lần này, nhưng thẻ này sẽ quay lại tìm bạn." : fill(pick(PRAISE), { patient: P.patient });
  } else {
    penalty = 20;
    P.wrongCount++;
    S.stats.wrong++;
    q.wrong = (q.wrong || 0) + 1;
    q.lastWrongAt = now;
    card = schedule(card || newCard(now), "again", now, nextExamAt(it.code));
    card = { ...card, due: Math.max(card.due, now + 10 * MIN) };   // sai: 10 phút sau gặp lại
    P.hp -= penalty;
    P.sessionWrong.push(it.id);
    const sev = severity(P.hp, 100);
    text = q.wrong >= 3 && sev !== "dead"
      ? roast("repeat", { times: q.wrong })
      : roast(isCase(q) && (sev === "scratch" || sev === "bleeding") ? "ward" : sev, { patient: P.patient, hp: Math.max(0, P.hp), penalty, source: isAnki(q) ? "thẻ Anki của chính bạn" : q.source || "cũ" });
  }
  q.card = card || null;
  P.answered = { choice, correct, roast: text, penalty, card, rating };
  if (!correct && P.hp <= 0) {
    P.killed++;
    S.stats.killed++;
    const grave = { patient: P.patient, code: it.code, subject: S.subjects[it.code].name, diedAt: now, qids: [...new Set(P.sessionWrong)], epitaph: `Ra đi lúc ${fmtShort(now)}. Hung thủ: chính bạn.` };
    if (S.db) S.db.collection("graves").add(grave).catch(() => toast("Không dựng được bia mộ (lỗi lưu)."));
  }
  saveQuestion(it.code, q);
  saveStats();
  render();
  if (!correct) {
    $("#mon")?.classList.add("shake"); navigator.vibrate?.(P.hp <= 0 ? [250, 80, 500] : 100);
    fillLecture(it.code, q);
    // đề thi cũ: tự gọi Claude giảng lại; thẻ Anki đã có bài soạn hiện sẵn, muốn sâu hơn thì bấm nút
    if (!isAnki(q) && !isCase(q) && !q.explanation && S.sample) explainQuestion(it.code, it.id, choice);
  }
}
function nextQuestion() {
  const P = S.practice; if (!P?.answered) return;
  if (P.hp <= 0 && P.caseRef) {   // ca soạn sẵn: cùng một bệnh nhân, làm tiếp cho hết ca
    P.hp = 100; P.patientNo++; P.sessionWrong = [];
    toast(`Khoa vừa hồi sinh ${P.patient} để bạn làm nốt ca. Đừng quen.`);
  } else if (P.hp <= 0) {    // bệnh nhân mới nhập viện
    P.hp = 100; P.patient = pick(PATIENTS.filter((x) => x !== P.patient)); P.patientNo++; P.sessionWrong = [];
    toast(`Bệnh nhân mới nhập viện: ${P.patient}. Lần này cố đừng giết.`);
  }
  P.answered = null; P.revealed = false;
  if (P.i + 1 >= P.items.length) {
    P.done = true;
    if (P.hp > 0) { S.stats.saved++; saveStats(); }
  } else { P.i++; P.qStart = Date.now(); }
  render();
}

/* Gọi Claude nêu lại kiến thức cho câu sai; lưu vào câu hỏi để lần sau khỏi gọi lại. */
async function explainQuestion(code, id, choice, field = "explanation") {
  const q = S.questions[code]?.[id]; if (!q || !S.sample) return;
  const P = S.practice;
  const deep = field === "aiNote";
  if (P?.answered && !deep) P.answered.explaining = true;
  const box = () => $(deep ? "#ainote" : "#explain");
  if (box()) box().textContent = "Đang gọi Claude nêu lại kiến thức…";
  const s = S.subjects[code];
  const pages = await loadNotes(code, q.lesson);
  const ctx = pages ? passages(pages, q, 4).map((p) => `[trang ${p.page}] ${p.text}`).join("\n\n").slice(0, 7000) : "";
  const prompt = `Bạn là giảng viên lâm sàng ở trường Y Việt Nam, giảng cho sinh viên Y4 đang ôn thi môn ${s.name} (bài: ${lessonName(code, q.lesson)}).
Sinh viên vừa làm ${deep ? "" : "SAI "}${isAnki(q) ? "thẻ ôn tập (tự làm từ bài giảng)" : isCase(q) ? "câu hỏi tình huống lâm sàng" : "câu đề thi cũ"} dưới đây.
${isCase(q) && S.caseById[q.caseId] ? `\nBỆNH CẢNH: ${S.caseById[q.caseId].setting}\n` : ""}${deep ? `\nSinh viên đã đọc lời giải ngắn dưới đây mà vẫn chưa thông. Đừng lặp lại nguyên văn; giảng từ gốc (cơ chế, sinh lý bệnh, vì sao từng lựa chọn sai):\n"""${q.why}"""\n` : ""}
${ctx ? `\nTRÍCH BÀI SOẠN CỦA SINH VIÊN (dùng làm nguồn chính, giữ đúng cách trình bày và mẹo của bài soạn):\n"""\n${ctx}\n"""\n` : ""}

CÂU HỎI: ${q.stem}
${q.options?.length ? q.options.map((o) => `${o.k}. ${o.t}`).join("\n") : ""}
ĐÁP ÁN ĐÚNG: ${q.answer}${q.options?.length ? " — " + (q.options.find((o) => o.k === q.answer)?.t || "") : ""}
${choice ? `SINH VIÊN CHỌN: ${choice} — ${q.options?.find((o) => o.k === choice)?.t || ""}` : ""}

Viết phần "nêu lại kiến thức" bằng tiếng Việt, tối đa ${deep ? 220 : 130} từ, văn bản thuần (không markdown, không tiêu đề):
- Câu 1: kiến thức cốt lõi mà câu hỏi kiểm tra.
- Vì sao đáp án đúng là đúng${choice ? ", và vì sao lựa chọn của sinh viên sai" : ""}.
- Kết bằng một dòng bắt đầu "Mẹo nhớ:"${ctx ? " (ưu tiên mẹo có sẵn trong bài soạn)" : ""}.
Giọng chuyên môn, chính xác, không đùa. Nếu đáp án được cho có vẻ sai về mặt y khoa, nói rõ ở dòng đầu: "Lưu ý: đáp án đề có thể chưa đúng vì…".`;
  try {
    const { text } = await S.sample(prompt, { onText: ({ text }) => { if (box()) box().textContent = text; }, cache: { gcTime: 864e5 } });
    const cur = S.questions[code][id];
    const updated = deep ? { ...cur, aiNote: text.trim() } : { ...cur, explanation: text.trim(), aiExplained: true };
    saveQuestion(code, updated);
    if (P?.answered && !deep) P.answered.explaining = false;
  } catch (e) {
    if (P?.answered && !deep) P.answered.explaining = false;
    if (box()) box().textContent = sampleErr(e, "giảng lại");
  }
}
function sampleErr(e, what) {
  if (e?.code === "not_granted" || e?.code === "sampling_disabled") { return `Chưa cho phép trang này dùng Claude nên không ${what} được.`; }
  if (e?.code === "rate_limited") return "Claude đang quá tải hoặc bạn hết lượt dùng. Lát nữa thử lại.";
  if (e?.code === "invalid_json") return "Claude trả về sai định dạng. Bấm thử lại.";
  return `Không ${what} được (lỗi ${e?.code || "mạng"}). Thử lại sau.`;
}

/* VIEW: Tình huống — ca soạn sẵn theo từng bài, tách riêng khỏi đề cũ  */
/* ------------------------------------------------------------------ */
function caseStats(code, list) {
  const qq = list.flatMap((c) => c.qs).map((x) => S.questions[code]?.[x.id]).filter(Boolean);
  return { n: qq.length, done: qq.filter((q) => q.seen).length, wrong: qq.filter((q) => q.wrong).length, due: qq.filter((q) => isDue(q)).length };
}
function viewCases() {
  const P = S.practice;

  if (!codes.length && !S.packsLoaded) return head + `<div class="empty"><p class="eyebrow">Đang tải ca tình huống…</p></div>`;

  if (!codes.length) return head + `<div class="empty"><h2>Chưa có ca nào</h2><p class="muted">Gửi bài soạn và Anki của một môn cho Claude trong khung chat, Claude sẽ soạn ca cho từng bài.</p></div>`;

  const s = S.subjects[code], byL = S.cases[code];
  const lessons = (s.lessons || []).filter((l) => byL[l.id]?.length);

  const rows = lessons.map((l, li) => {

    return `<section class="panel stack" id="cl-${l.id}">

      <div class="row" style="gap:6px"><span class="chip blue">${byL[l.id].length} ca · ${st.n} câu</span>${st.done ? `<span class="chip ${st.done === st.n ? "green" : ""}">đã làm ${st.done}/${st.n}</span>` : `<span class="chip">chưa đụng tới</span>`}${st.wrong ? `<span class="chip red">${st.wrong} từng sai</span>` : ""}${st.due ? `<span class="chip amber">${st.due} đến hạn</span>` : ""}</div>

function startReview(code) {
  const queue = dueList().filter((q) => !code || q.code === code).map((q) => ({ id: q.id, code: q.code }));

  render();
}
function rateCard(r) {
  const R = S.review; const it = R?.queue[0]; if (!it) return;
  const q = { ...S.questions[it.code][it.id] };
  const now = Date.now();
  q.card = schedule(q.card || newCard(now), r, now, nextExamAt(it.code));
  bumpStreak();
  saveQuestion(it.code, q);
  saveStats();
  R.queue.shift();
  if (r === "again") { R.queue.push(it); R.msg = roast("incense", { patient: pick(PATIENTS) }); }
  else { R.done++; R.msg = null; }
  R.flipped = false;
  render();
  if (R.msg) toast(R.msg);
}

function graveLit(g) {
  return g.qids.map((id) => {
    const q = S.questions[g.code]?.[id];
    return !q || (q.card && q.card.state === "review" && (q.card.last || 0) > g.diedAt);
  });
}
function viewGraves() {

  <div class="graves">${list.map((g) => {

    return `<div class="grave ${saved ? "saved" : ""}"><div class="stone">${saved ? "🕊️" : "🪦"}</div><b>${esc(g.patient)}</b><span class="note">${esc(g.subject)}</span>

  }).join("")}</div>`;
}

/* Cắt đề dài tại đầu câu ("Câu 12.", "12)", "12.") để không câu nào bị chẻ đôi. */
function chunkExam(text, max = 9000) {
  const lines = text.split(/\r?\n/);
  const chunks = []; let cur = "";
  for (const line of lines) {
    const startsQ = /^\s*(câu|cau|question|q)?\s*\d{1,3}\s*[\.\):\-]/i.test(line);
    if (startsQ && cur.length > max) { chunks.push(cur); cur = ""; }
    cur += line + "\n";
  }
  if (cur.trim()) chunks.push(cur);
  return chunks;
}

async function runImport(form) {
  const I = S.imp;
  I.code = $("#i-code").value; I.source = $("#i-source").value.trim(); I.text = $("#i-text").value;
  const files = S.canImages ? [...($("#i-img")?.files || [])] : [];
  if (!I.text.trim() && !files.length) { I.error = "Dán nội dung đề hoặc chọn ảnh trước đã."; render(); return; }
  I.error = null; I.running = true; I.progress = 0.02; I.ctl = new AbortController();
  const jobs = [];
  if (I.text.trim()) {
    const chunks = chunkExam(I.text);
    const tail = chunks.length > 1 ? I.text.slice(-1500) : "";
    chunks.forEach((c, i) => jobs.push({ label: `Phần ${i + 1}/${chunks.length}`, prompt: (names) => classifyPrompt(I, c, tail, false, names) }));
  }
  const maxImg = S.imgMax || 5;
  for (let i = 0; i < files.length; i += maxImg) jobs.push({ label: `Ảnh ${i + 1}–${Math.min(files.length, i + maxImg)}`, prompt: (names) => classifyPrompt(I, "", "", true, names), images: files.slice(i, i + maxImg) });
  render();
  const out = [];
  try {
    for (let j = 0; j < jobs.length; j++) {
      I.log = `${jobs[j].label} · Claude đang đọc… (đề dài có thể mất 1–2 phút mỗi phần)`; render();
      const names = [...new Set(out.map((x) => x?.new_lesson).filter(Boolean).map(String))];
      const res = await S.sample.json(jobs[j].prompt(names), { signal: I.ctl.signal, ...(jobs[j].images ? { images: jobs[j].images } : {}), cache: false });
      if (Array.isArray(res)) out.push(...res);
      I.progress = (j + 1) / jobs.length;
    }
  } catch (e) {
    I.running = false;
    if (e?.code !== "cancelled") I.error = sampleErr(e, "phân loại đề");
    if (!out.length) { render(); return; }
  }
  I.running = false;
  const known = {};
  for (const s of subjectList()) known[s.code] = new Set(qs(s.code).map((q) => norm(q.stem)));
  const seenNow = new Set();
  I.items = out.filter((x) => x && typeof x.stem === "string" && x.stem.trim()).map((x) => {
    const code = S.subjects[x.subject] ? x.subject : (I.code || subjectList()[0].code);
    const lessons = S.subjects[code].lessons || [];
    const lesson = lessons.some((l) => l.id === x.lesson) ? x.lesson : x.new_lesson ? "new:" + String(x.new_lesson).trim() : "";
    const options = Array.isArray(x.options) ? x.options.filter((o) => o && o.k && o.t).map((o) => ({ k: String(o.k).trim().toUpperCase().slice(0, 1), t: String(o.t).trim() })) : [];
    let answer = String(x.answer ?? "").trim();
    if (options.length) answer = answer.toUpperCase().slice(0, 1);
    const key = norm(x.stem);
    const dup = known[code]?.has(key) || seenNow.has(key);
    seenNow.add(key);
    return { stem: x.stem.trim(), options, answer, aiAnswer: x.answer_source !== "key", explanation: String(x.explanation || "").trim(), code, lesson, newLesson: x.new_lesson ? String(x.new_lesson).trim() : null, confidence: Number(x.confidence ?? 1), dup, keep: !dup && !!answer };
  });
  if (!I.items.length) { I.items = null; I.error = I.error || "Không tách được câu nào. Kiểm tra lại nội dung đề."; }
  render();
}
async function saveImport() {
  const I = S.imp; if (!I?.items) return;
  const keep = I.items.filter((x) => x.keep);
  // tạo bài mới trước (mỗi môn ghi 1 lần)
  const newBy = {};
  for (const x of keep) if (x.lesson.startsWith("new:")) (newBy[x.code] ||= new Set()).add(x.lesson.slice(4));
  const map = {};
  for (const [code, names] of Object.entries(newBy)) {
    const s = { ...S.subjects[code], lessons: [...(S.subjects[code].lessons || [])] };
    for (const name of names) {
      const existing = s.lessons.find((l) => norm(l.name) === norm(name));
      const id = existing ? existing.id : uid("l");
      if (!existing) s.lessons.push({ id, name });
      map[code + "|" + name] = id;
    }
    await saveSubject(s);
  }
  let n = 0;
  const btn = $("[data-act=save-import]"); if (btn) btn.disabled = true;
  for (const x of keep) {
    const lesson = x.lesson.startsWith("new:") ? map[x.code + "|" + x.lesson.slice(4)] : x.lesson;
    const q = { id: uid("q"), stem: x.stem, options: x.options, answer: x.answer, aiAnswer: x.aiAnswer, explanation: x.explanation, lesson: lesson || "", source: I.source || "Đề cũ", createdAt: Date.now(), seen: 0, wrong: 0, card: null };
    try { await saveQuestion(x.code, q); n++; } catch { break; }
    if (btn) btn.textContent = `Đang lưu ${n}/${keep.length}…`;
  }
  toast(`Đã nạp ${n} câu vào kho. Bệnh nhân đã sẵn sàng.`);
  const code = keep[0]?.code;
  S.imp = { code: I.code, source: "", text: "", items: null, running: false };
  if (code) { S.subject = code; S.tab = "subject"; }
  render();
}

async function buildCase(code, lesson) {
  const E = S.er;
  let pool = qs(code).filter((q) => !lesson || q.lesson === lesson);
  pool = [...shuffle(pool.filter((q) => q.wrong > 0)), ...shuffle(pool.filter((q) => !q.wrong && (q.prio || 3) >= 3)), ...shuffle(pool.filter((q) => !q.wrong && (q.prio || 3) < 3))].slice(0, 24);
  E.loading = true; E.error = null; E.code = code; render();
  // Trích bài soạn liên quan tới các câu được chọn, để ca bám đúng nội dung bộ môn dạy
  let ctx = "";
  const lessonIds = [...new Set(pool.map((q) => q.lesson).filter(Boolean))].slice(0, 3);
  for (const lid of lessonIds) {
    const pages = await loadNotes(code, lid); if (!pages) continue;
    const probe = { stem: pool.filter((q) => q.lesson === lid).map((q) => q.stem).join(" "), answer: pool.filter((q) => q.lesson === lid).map((q) => q.answer).join(" ") };
    ctx += passages(pages, probe, 5).map((p) => `[${lessonName(code, lid)} · trang ${p.page}] ${p.text}`).join("\n\n") + "\n\n";
  }
  ctx = ctx.slice(0, 9000);
  const prompt = `Bạn là giảng viên lâm sàng ra đề thi tình huống cho sinh viên Y4 Việt Nam, môn ${S.subjects[code].name}${lesson ? `, bài ${lessonName(code, lesson)}` : ""}.
Hãy viết MỘT ca lâm sàng nhập vai theo đúng kiểu ĐỀ THI TÌNH HUỐNG của trường Y: dài, đủ dữ kiện, đọc như một đoạn văn bệnh án — không phải câu hỏi một dòng.

KIẾN THỨC CẦN KIỂM TRA (id, câu, đáp án đúng) — mỗi bước của ca phải dựa trên các câu này:
${pool.map((q) => `[${q.id}] ${q.stem.replace(/\s+/g, " ")}${q.options?.length ? " | Đáp án: " + q.answer + ". " + (q.options.find((o) => o.k === q.answer)?.t || "") : " | Đáp án: " + q.answer.replace(/\s+/g, " ")}`).join("\n")}
${ctx ? `\nTRÍCH BÀI SOẠN CỦA SINH VIÊN (nguồn chuẩn cho số liệu, phân loại, phác đồ — khi bài soạn ghi "đáp án sách/bộ môn" thì theo đáp án đó):\n"""\n${ctx}\n"""\n` : ""}
CẤU TRÚC VÀ ĐỘ DÀI:
- "opening" (120–200 từ): hành chính (tên, tuổi, giới, nghề/hoàn cảnh nếu liên quan), lý do vào viện, bệnh sử kể theo thời gian (ngày thứ mấy, diễn tiến, đã tự điều trị gì), tiền căn bản thân/gia đình/thói quen, khám lúc nhập viện (tổng trạng, sinh hiệu, khám chuyên khoa mô tả cụ thể). Có 1–2 chi tiết gây nhiễu hợp lý như đề thật.
- 4–6 bước. Mỗi bước: "narrative" (50–120 từ) đưa dữ kiện MỚI — kết quả cận lâm sàng có số liệu, diễn tiến sau điều trị, biến chứng, câu hỏi của người nhà…; "question" hỏi đúng giọng đề thi ("Chẩn đoán phù hợp nhất là gì?", "Xử trí tiếp theo thích hợp nhất?", "Cận lâm sàng nào cần làm ngay để…?").
- 4 lựa chọn, mỗi lựa chọn là một câu đầy đủ; các lựa chọn dài tương đương nhau (đáp án đúng KHÔNG được dài nhất hay chi tiết nhất); đúng 1 đáp án đúng, xáo vị trí; lựa chọn sai là sai lầm sinh viên hay mắc.
- "why": 1–2 câu chuyên môn cho mỗi lựa chọn.
- Toàn ca KHÔNG quá khoảng 900 từ. Dài vì đủ dữ kiện, không dài vì văn hoa.

LUẬT:
- Mỗi bước ghi id 1–3 câu kiến thức nó kiểm tra vào "qids"; đáp án đúng của bước phải nhất quán với đáp án đã cho và với bài soạn.
- Số liệu bệnh nhân (tuổi, sinh hiệu, xét nghiệm) do bạn đặt nhưng phải nhất quán với bệnh cảnh. Liều thuốc, ngưỡng chẩn đoán, phân loại: chỉ dùng khi có trong câu kiến thức hoặc bài soạn.
- "penalty": 15–35, càng nguy hiểm thật khi chọn sai thì càng cao. Bệnh nhân tên Việt. Tiêu đề ngắn, gây tò mò, hơi đen tối.
