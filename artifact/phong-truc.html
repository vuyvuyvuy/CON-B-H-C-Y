function erAnswer(k) {
  const E = S.er; if (!E?.case || E.answered) return;
  const st = E.case.steps[E.step];
  const ok = st.options.find((o) => o.k === k)?.ok === true;
  const now = Date.now();
  const ms = now - E.start;
  for (const id of st.qids || []) {
    const q = S.questions[E.case.code]?.[id]; if (!q) continue;
    const u = { ...q, seen: (q.seen || 0) + 1 };
    if (ok) { if (u.card) u.card = schedule(u.card, ratingFrom(true, ms), now, nextExamAt(E.case.code)); }
    else { u.wrong = (u.wrong || 0) + 1; u.lastWrongAt = now; const c = schedule(u.card || newCard(now), "again", now, nextExamAt(E.case.code)); u.card = { ...c, due: Math.max(c.due, now + 10 * MIN) }; E.wrongQ.add(id); }
    saveQuestion(E.case.code, u);
  }
  S.stats.total++; if (!ok) S.stats.wrong++;
  bumpStreak();
  let text;
  if (ok) text = fill(pick(PRAISE), { patient: E.case.patient?.name || "Bệnh nhân" });
  else {
    E.hp -= st.penalty || 20;
    text = roast(severity(E.hp, 100), { patient: E.case.patient?.name || "Bệnh nhân", hp: Math.max(0, E.hp), penalty: st.penalty || 20, source: "cũ" });
  }
  E.answered = { k, ok, roast: text };
  if (E.hp <= 0) {
    S.stats.killed++;
    if (S.db) S.db.collection("graves").add({ patient: `${E.case.patient?.name}, ${E.case.patient?.age}t`, code: E.case.code, subject: S.subjects[E.case.code]?.name || "", diedAt: now, qids: [...E.wrongQ], epitaph: `${E.case.title}. Ra đi lúc ${fmtShort(now)}.` }).catch(() => {});
  }
  saveStats();
  render();
  if (!ok) { $("#mon")?.classList.add("shake"); navigator.vibrate?.(E.hp <= 0 ? [250, 80, 500] : 100); }
}
function erNext() {
  const E = S.er; if (!E?.answered) return;
  if (E.step + 1 >= E.case.steps.length) { E.finished = true; if (E.hp > 0) { S.stats.saved++; saveStats(); } }
  else { E.step++; E.start = Date.now(); }
  E.answered = null;
  render();
}

/* ------------------------------------------------------------------ */
/* Sự kiện                                                             */
/* ------------------------------------------------------------------ */
document.addEventListener("click", async (ev) => {
  const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.type === "checkbox") return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case "tab": go(d.id); break;
    case "open-subject": S.subject = d.code; S.openLesson = null; go("subject"); break;
    case "toggle-lesson": S.openLesson = S.openLesson === d.id ? null : d.id; S.openLimit = 40; render(); break;
    case "practice-subject": S.subject = d.code; go("anki"); break;
    case "sub": go(d.id); break;
    case "practice-lesson": startPractice(d.code, d.id === "_none" ? "" : d.id, "all", 20); break;
    case "import-subject": S.subject = d.code; S.imp = { code: d.code, source: "", text: "", items: null }; go("import"); break;
    case "rename-lesson": {
      const s = S.subjects[S.subject]; const l = s.lessons.find((x) => x.id === d.id);
      const row = el.closest(".lesson");
      row.querySelector("h3").outerHTML = `<form class="row" data-form="rename" data-id="${d.id}"><input type="text" id="rn-${d.id}" value="${esc(l.name)}" style="flex:1"><button class="btn small">Lưu</button><button type="button" class="btn small ghost" data-act="del-lesson" data-id="${d.id}">Xoá bài</button></form>`;
      $(`#rn-${d.id}`)?.focus();
      break;
    }
    case "del-lesson": {
      const s = { ...S.subjects[S.subject] };
      const n = qs(s.code).filter((q) => q.lesson === d.id).length;
      if (n && !el.dataset.confirm) { el.dataset.confirm = "1"; el.textContent = `Xoá? ${n} câu sẽ thành “chưa xếp bài”`; return; }
      s.lessons = s.lessons.filter((l) => l.id !== d.id);
      await saveSubject(s);
      for (const q of qs(s.code).filter((q) => q.lesson === d.id)) saveQuestion(s.code, { ...q, lesson: "" });
      render(); break;
    }
    case "del-q": {
      if (!el.dataset.confirm) { el.dataset.confirm = "1"; el.textContent = "Chắc chưa? Bấm lần nữa"; return; }
      deleteQuestion(d.code, d.id);
      render(); break;
    }
    case "answer": answerPractice(d.k); break;
    case "reveal": S.practice.revealed = true; render(); break;
    case "self-grade": answerPractice(null, d.r); break;
    case "open-reader": S.reader = { code: d.code, lesson: d.lesson, page: +d.page || 1, q: "" }; go("reader"); break;
    case "reader-page": S.reader.page = +d.page; render(); break;
    case "more-q": S.openLimit = (S.openLimit || 40) + 80; render(); break;
    case "next-q": nextQuestion(); break;
    case "explain": { const it = S.practice.items[S.practice.i]; explainQuestion(it.code, it.id, S.practice.answered?.choice); break; }
    case "explain-deep": { const it = S.practice.items[S.practice.i]; explainQuestion(it.code, it.id, S.practice.answered?.choice, "aiNote"); break; }
    case "cover-review": queueCovers(d.code, d.id); break;
    case "play-case": playCase(d.id); break;
    case "case-wrong": playWrong(d.code, d.lesson); break;
    case "case-subject": S.cs = { code: d.code }; render(); break;
    case "case-list": S.practice = { code: S.practice?.code }; render(); break;
    case "open-cases": {
      S.subject = d.code; S.cs = { code: d.code }; if (S.practice?.caseRef) S.practice = { code: d.code };
      go("cases");
      requestAnimationFrame(() => $("#cl-" + d.lesson)?.scrollIntoView({ block: "start" }));
      break;
    }
    case "explain-review": { const it = S.review.queue[0]; explainQuestion(it.code, it.id, null); break; }
    case "end-practice": if (S.practice.answeredCount) { S.practice.done = true; render(); } else { S.practice = { code: S.practice.code, kind: S.practice.kind === "exam" ? "exam" : "anki" }; render(); } window.scrollTo({ top: 0 }); break;
    case "restart-practice": S.practice = { code: S.practice.code, lesson: S.practice.lesson, kind: S.practice.kind === "exam" ? "exam" : "anki" }; render(); break;
    case "redo-source": redoSource(d.code, d.src); break;
    case "start-review": startReview(d.code); break;
    case "flip": S.review.flipped = true; render(); break;
    case "show-lecture": { const it = S.review.queue[0]; fillLecture(it.code, S.questions[it.code][it.id]); break; }
    case "rate": rateCard(d.r); break;
    case "end-review": S.review = null; render(); break;
    case "pray": {
      const g = S.graves[d.id];
      const queue = g.qids.filter((id) => S.questions[g.code]?.[id]).map((id) => ({ id, code: g.code }));
      S.review = { queue, flipped: false, done: 0, msg: null }; go("review"); break;
    }
    case "save-import": saveImport(); break;
    case "discard-import": S.imp.items = null; render(); break;
    case "cancel-import": S.imp.ctl?.abort(); break;
    case "er-answer": erAnswer(d.k); break;
    case "er-next": erNext(); break;
    case "er-again": startCase(S.er.case); break;
    case "er-new": { const c = S.er.case; S.er = { code: c.code }; buildCase(c.code, c.lesson); break; }
    case "er-quit": S.er = { code: S.er.case?.code }; render(); break;
    case "er-replay": startCase(S.er.saved); break;
    case "add-subject": toast("Nhắn Claude trong khung chat để thêm môn."); break;
  }
});
document.addEventListener("change", async (ev) => {
  const el = ev.target; const d = el.dataset;
  if (d.act === "move-q") { const q = S.questions[d.code][d.id]; saveQuestion(d.code, { ...q, lesson: el.value }); render(); }
  if (d.act === "exam-done") { const s = { ...S.subjects[d.code], exams: S.subjects[d.code].exams.map((e, i) => (i === +d.idx ? { ...e, done: el.checked } : e)) }; await saveSubject(s); render(); }
  if (d.act === "p-code") { S.practice = { code: el.value }; render(); }
  if (d.act === "reader-lesson") { S.reader = { ...S.reader, lesson: el.value, page: 1 }; render(); }
  if (d.act === "e-code") { S.er = { code: el.value }; loadSavedCase(el.value); render(); }
  if (d.act === "imp-keep") { S.imp.items[+d.i].keep = el.checked; render(); }
  if (d.act === "imp-code") { const x = S.imp.items[+d.i]; x.code = el.value; x.lesson = ""; render(); }
  if (d.act === "imp-lesson") { S.imp.items[+d.i].lesson = el.value; }
});
document.addEventListener("submit", async (ev) => {
  const f = ev.target.closest("[data-form]"); if (!f) return;
  ev.preventDefault();
  const k = f.dataset.form;
  if (k === "start-practice") startPractice($("#p-code").value, $("#p-lesson").value, $("#p-mode").value, Math.max(1, Math.min(300, +$("#p-n").value || 20)), $("#p-kind").value, +$("#p-prio").value);
  if (k === "reader-search") { S.reader.q = $("#r-q").value.trim(); render(); }
  if (k === "import") runImport(f);
  if (k === "er") buildCase($("#e-code").value, $("#e-lesson").value);
  if (k === "add-lesson") {
    const name = $("#new-lesson").value.trim(); if (!name) return;
    const s = { ...S.subjects[S.subject], lessons: [...(S.subjects[S.subject].lessons || []), { id: uid("l"), name }] };
    await saveSubject(s); render();
  }
  if (k === "rename") {
    const name = $(`#rn-${f.dataset.id}`).value.trim(); if (!name) return;
    const s = { ...S.subjects[S.subject], lessons: S.subjects[S.subject].lessons.map((l) => (l.id === f.dataset.id ? { ...l, name } : l)) };
    await saveSubject(s); render();
  }
  if (k === "add-exam") {
    const code = f.dataset.code; const at = $("#exam-at").value;
    if (!at) return;
    const iso = new Date(at + ":00+07:00").toISOString();
    const s = { ...S.subjects[code], exams: [...(S.subjects[code].exams || []), { title: $("#exam-title").value.trim() || S.subjects[code].name, at: iso, done: false }] };
    await saveSubject(s); render();
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.matches("[role=button][data-act]")) { ev.preventDefault(); ev.target.click(); return; }
  if (ev.target.matches("input, textarea, select") || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const key = ev.key;
  if ((S.tab === "practice" || S.tab === "cases") && S.practice?.items && !S.practice.done) {
    const P = S.practice;
    if (!P.answered) {
      const q = S.questions[P.items[P.i].code]?.[P.items[P.i].id];
      if (q?.options?.length) { if (q.options.some((o) => o.k === key.toUpperCase())) { ev.preventDefault(); answerPractice(key.toUpperCase()); } }
      else if (!P.revealed && (key === " " || key === "Enter")) { ev.preventDefault(); P.revealed = true; render(); }
      else if (P.revealed && "123".includes(key) && key.length === 1) { ev.preventDefault(); answerPractice(null, ["again", "hard", "good"][+key - 1]); }
    } else if (key === "Enter") { ev.preventDefault(); nextQuestion(); }
  }
  if (S.tab === "review" && S.review?.queue.length) {
    if (!S.review.flipped && (key === " " || key === "Enter")) { ev.preventDefault(); S.review.flipped = true; render(); }
    else if (S.review.flipped && "1234".includes(key) && key.length === 1) { ev.preventDefault(); rateCard(["again", "hard", "good", "easy"][+key - 1]); }
  }
  if (S.tab === "er" && S.er?.case) {
    if (!S.er.answered && /^[a-dA-D]$/.test(key)) { ev.preventDefault(); erAnswer(key.toUpperCase()); }
    else if (S.er.answered && key === "Enter") { ev.preventDefault(); erNext(); }
  }
});
function afterRender() { $("#next")?.focus({ preventScroll: true }); }
async function loadSavedCase(code) {
  if (!S.db || !code) return;
  S.er = S.er?.code === code ? S.er : { code };
  try { const snap = await S.db.doc(`cases/${code}__all`).get(); if (snap.exists && S.er && !S.er.case && S.er.code === code) { S.er.saved = snap.data(); render(); } } catch {}
}

/* ------------------------------------------------------------------ */
/* Khởi động: nối db + sample                                          */
/* ------------------------------------------------------------------ */
/* Câu hỏi của 1 môn: chia theo b (0–7) thành nb nhóm, mỗi nhóm 1 truy vấn ≤1000 câu.
   Nhóm nào đầy 1000 thì tự chia đôi. */
const qSubs = {};
function watchQuestions(code, nb = 1) {
  if (qSubs[code]?.nb >= nb) return;
  qSubs[code]?.unsubs.forEach((u) => u());
  const groups = Array.from({ length: nb }, (_, g) => Array.from({ length: 8 / nb }, (_, i) => g * (8 / nb) + i));
  const parts = groups.map(() => ({}));
  const unsubs = groups.map((vals, g) => S.db.collection(`subjects/${code}/questions`).where("b", "in", vals).limit(1000).onSnapshot((snap) => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data(); parts[g] = m;
    S.docs[code] = Object.assign({}, ...parts);
    rebuild(code);
    onData();
    if (snap.size >= 1000 && nb < 8) setTimeout(() => watchQuestions(code, nb * 2), 0);
  }, (e) => console.warn("questions", code, e)));
  qSubs[code] = { nb, unsubs };
}
/* File tĩnh: fetch thường (app iPad trả 403 nếu đổi chế độ cache). Danh mục đọc từ packs/catalog.json — tên mới
   để không dính bản index.json cũ trong bộ nhớ đệm; không có thì quay về index.json. Thiếu trường cases thì đoán theo quy ước. */
const getJSON = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(url + " " + r.status); return r.json(); });
async function loadPacks() {
  try {
    const idx = await getJSON("packs/catalog.json").catch(() => getJSON("packs/index.json"));
    for (const p of idx?.packs || []) {
      const pack = p.file ? await getJSON(p.file) : { cards: [] };
      const cards = {}; for (const c of pack.cards) cards[c.id] = c;
      const explicitCases = !!p.cases;
      if (!p.cases) p.cases = `cases/${p.code}.json`;
      try {       // ca tình huống: mỗi câu là một "thẻ" kind "case" để dùng chung SRS
        const cz = await getJSON(p.cases);
        const byL = {};
        for (const L of cz.lessons) {
          byL[L.lesson] = L.cases;
          for (const c of L.cases) {
            S.caseById[c.id] = { ...c, code: p.code, lesson: L.lesson };
            for (const x of c.qs) cards[x.id] = { id: x.id, kind: "case", lesson: L.lesson, caseId: c.id, stem: x.stem, options: x.options, answer: x.answer, why: x.why, covers: x.covers };
          }
        }
        S.cases[p.code] = byL;
      } catch (e) { console.warn("cases", e); if (explicitCases) S.casesErr = String(e.message || e); }
      S.pack[p.code] = { cards, notes: p.notes || {} };
      rebuild(p.code);
    }
  } catch (e) { console.warn("packs", e); S.casesErr = String(e.message || e); }
  S.packsLoaded = true;
  onData();
}
async function boot() {
  try { const t = localStorage.getItem("pt.tab"); if (t && TABS.some(([id]) => id === t)) S.tab = t; } catch {}
  render();
  const [db, sample] = await Promise.all([window.claude?.use("db") ?? null, window.claude?.use("sample") ?? null]);
  S.sample = sample;
  if (sample) {
    try { const lim = await sample.limits(); S.canImages = !!lim.images; S.imgMax = lim.images?.maxCount; } catch {}
  }
  if (!db) {
    S.loaded.subjects = true;
    $("#app").innerHTML = `<div class="empty"><h2>Không kết nối được kho dữ liệu</h2><p class="muted">Mở trang này từ claude.ai bằng tài khoản của bạn. Bản tải về máy hoặc mở ngoài Claude sẽ không có dữ liệu.</p></div>`;
    return;
  }
  S.db = db;
  loadPacks();
  db.collection("subjects").onSnapshot((snap) => {
    const m = {};
    for (const d of snap.docs) { m[d.id] = { code: d.id, ...d.data() }; watchQuestions(d.id); }
    S.subjects = m;
    S.loaded.subjects = true;
    onData();
  }, () => { S.loaded.subjects = true; onData(); });
  db.doc("meta/stats").onSnapshot((snap) => { if (snap.exists) { S.stats = { ...S.stats, ...snap.data() }; onData(); } });
  db.collection("graves").limit(500).onSnapshot((snap) => {
    const m = {}; for (const d of snap.docs) m[d.id] = d.data(); S.graves = m; onData();
  });
}
boot();
</script>
