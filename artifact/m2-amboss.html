<style>
/* Bố cục: một cột đọc ~68 ký tự như trang sách, thanh tab dưới đáy trên điện thoại, trên cùng ở màn rộng.
   Chữ bài đọc là serif Literata (làm cho đọc màn hình lâu), giao diện là Lexend (dễ đọc cho người đọc chậm). */

  --line: #dfe2da;
  --fg: #1d2320;
  --muted: #5f6a64;

  --ok: #2f7d4f;
  --hard: rgba(235, 87, 110, .28);    /* đánh dấu "khó" */
  --again: rgba(240, 180, 40, .36);   /* đánh dấu "đọc lại" */
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: 19px;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141716; --panel: #1c201e; --line: #2c322f; --fg: #e2e6e1; --muted: #9aa59f;
  --accent: #93a6ff; --accent-soft: #252c48; --ok: #6cc893;
  --hard: rgba(255, 110, 130, .30); --again: rgba(255, 200, 70, .28); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141716; --panel: #1c201e; --line: #2c322f; --fg: #e2e6e1; --muted: #9aa59f;
  --accent: #93a6ff; --accent-soft: #252c48; --ok: #6cc893;
  --hard: rgba(255, 110, 130, .30); --again: rgba(255, 200, 70, .28); color-scheme: dark; }

  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }

/* Nhập nội dung */
#paste { min-height: 160px; border: 2px dashed var(--line); border-radius: var(--r); padding: 16px; background: var(--panel); outline: none; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); font-size: 14px; }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .burst path { animation: none; stroke-dashoffset: 0; } .pop { animation: none; } .bar i, .rprog i { transition: none; } }
</style>

<script id="m2-plan" type="application/json">null</script>
<script>
"use strict";
/* ------------------------------------------------------------------ */
/* Dữ liệu: lộ trình nhúng sẵn (chỉ đọc); trạng thái nằm trong kho db   */
/*   cfg/plan          {start, rest, perDay, target?, kqTotal}          */
/*   kap/<id>          {st 0|1|2, pct, pos, ms, words, nb, doneAt}       */
/*   txt/<id>-<k>      {ch, k, blocks:[html]}  nội dung chương, cắt ≤200KB */
/*   mk/<id>           {list:[{id,b,s,e,c,note,txt}]}  đánh dấu          */
/*   easy/<id>         {blocks, src:"amboss"|"ai", at}  bài dễ hiểu Claude soạn */
/*   days/<YYYYMMDD>   {min, ch:[id], kq, kmin, r0}  r0 = khối lượng còn lúc mở app sáng nay (phút) */
/* Kho này tách hẳn khỏi Phòng Trực (Artifact khác, kho khác).          */
/* ------------------------------------------------------------------ */
const PLAN = JSON.parse(document.getElementById("m2-plan").textContent) || [];
const CH = PLAN.flatMap((d) => d.ch.map((c) => ({ ...c, tag: d.tag, fach: d.fach, sub: d.sub })));
const BY = Object.fromEntries(CH.map((c, i) => [c.id, { ...c, i }]));
const DAY = 864e5, MIN = 6e4;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let DB = null, online = false;
const S = { kap: {}, days: {}, cfg: null, off: false };

/* ---------- ngày ---------- */
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const key = (d) => iso(d).replaceAll("-", "");
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
const fmtD = (d) => `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
function cfg() {
  const c = S.cfg || {};
  return {
    start: c.start ? parseISO(c.start) : today0(),
    rest: Number.isInteger(c.rest) ? c.rest : 0,
    perDay: c.perDay || 60,                       // phút học mỗi ngày: con số duy nhất quyết định nhịp
    target: c.target ? parseISO(c.target) : null, // hạn muốn xong (tuỳ chọn), chỉ để so sánh
    kqTotal: c.kqTotal ?? 50 * PLAN.length,       // giả định ~50 câu/Lerntage AMBOSS, sửa trong Cài đặt
    cpc: c.cpc ?? 20,                             // thẻ Anki mỗi chương (10–20 kiến thức + vài thẻ từ vựng)
    set: !!S.cfg,
  };
}
function studyDays(from, to, rest) { let n = 0; for (let d = new Date(from); d <= to; d = addDays(d, 1)) if (d.getDay() !== rest) n++; return n; }
/* ngày học thứ n (1 = ngày học đầu tiên từ `from`, tính cả `from`), bỏ ngày nghỉ */
function nthStudyDay(from, n, rest) { let d = new Date(from); for (;;) { if (d.getDay() !== rest && --n <= 0) return d; d = addDays(d, 1); } }

/* ---------- ghi db: mỗi doc một lượt ghi, gộp các lần đổi liên tiếp ---------- */
const W = {};
function save(path, data) {
  if (!DB) return;
  const w = W[path] || (W[path] = { busy: false, next: null });
  w.next = data; if (!w.busy) pump(path);
}
async function pump(path) {
  const w = W[path]; w.busy = true;
  while (w.next) { const d = w.next; w.next = null; try { await DB.doc(path).set(d); } catch (e) { toast("Chưa lưu được: " + (e.message || e.code || e)); } }
  w.busy = false;
}
const kap = (id) => S.kap[id] || { st: 0, pct: 0, pos: 0, ms: 0, words: 0, nb: 0 };
function putKap(id, patch) { S.kap[id] = { ...kap(id), ...patch }; save("kap/" + id, S.kap[id]); }
function putDay(patch, d = today0()) { const k = key(d); S.days[k] = { min: 0, ch: [], ...S.days[k], ...patch }; save("days/" + k, S.days[k]); }

/* ---------- ước lượng thời gian đọc ---------- */
/* shortcut: mặc định 110 từ/phút (đọc tiếng Đức chậm); sau ≥2 chương đọc thật thì dùng tốc độ của Vy */
function rate() {
  let ms = 0, w = 0, n = 0;
  for (const k of Object.values(S.kap)) if (k.st === 2 && k.words > 300 && k.ms > 5 * MIN) { ms += k.ms; w += k.words; n++; }
  return n >= 2 ? ms / MIN / w : 1 / 110;     // phút / từ
}
function avgChapterMin() {
  const done = Object.values(S.kap).filter((k) => k.st === 2 && k.ms > 5 * MIN);
  return done.length >= 2 ? done.reduce((a, k) => a + k.ms, 0) / done.length / MIN : 30;
}
const estMin = (id) => { const k = kap(id); const m = k.words ? k.words * rate() : avgChapterMin(); return Math.min(120, Math.max(10, m)); };

/* ---------- cán cân: còn bao nhiêu việc, học M phút/ngày thì bao giờ xong ---------- */
function workload() {
  const c = cfg(), t0 = today0(), today = S.days[key(t0)] || {};
  const left = CH.filter((x) => kap(x.id).st !== 2);
  const readMin = left.reduce((a, x) => a + estMin(x.id) * (1 - (kap(x.id).pct || 0)), 0);
  const D = Object.values(S.days);
  const kqDone = D.reduce((a, d) => a + (d.kq || 0), 0), kMin = D.reduce((a, d) => a + (d.kmin || 0), 0);
  const perQ = kqDone >= 50 && kMin > 0 ? kMin / kqDone : 2;      // shortcut: 2 phút/câu cho tới khi có ≥50 câu đã ghi giờ
  const kqLeft = Math.max(0, c.kqTotal - kqDone), kzMin = kqLeft * perQ;
  // shortcut: mỗi thẻ tốn ~1 phút ôn cộng dồn suốt đời thẻ (học lần đầu + ~6 lần ôn); GĐ2 sẽ đo thời gian ôn thật
  const ankiCards = left.length * c.cpc, ankiMin = ankiCards * 1;
  const total = readMin + kzMin + ankiMin;
  // chia phút mỗi ngày theo tỉ lệ việc còn lại → đọc, kreuzen, Anki xong cùng lúc
  const share = total ? readMin / total : 1, shareA = total ? ankiMin / total : 0;
  // từ hôm nay; phần hôm nay đã làm không tính lại
  const doneToday = (today.min || 0) + (today.kmin || 0);
  const finishAt = (rem) => nthStudyDay(t0, Math.max(1, Math.ceil((rem + doneToday) / c.perDay)), c.rest);
  const finish = finishAt(total), finish0 = today.r0 != null ? finishAt(today.r0 - doneToday) : null;
  const needForTarget = c.target && c.target >= t0 ? (total + doneToday) / Math.max(1, studyDays(t0, c.target, c.rest)) : null;

const hm = (m) => { m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)} giờ${m % 60 ? " " + (m % 60) + "′" : ""}` : `${m}′`; };
const monthsTxt = (a, b) => { const d = Math.round((b - a) / DAY); return d < 60 ? `${d} ngày` : `${d} ngày (~${(d / 30.4).toFixed(1)} tháng)`; };

/* ---------- kế hoạch hôm nay ---------- */
function todayPlan(due = 0) {
  const w = workload(), c = w.c, t0 = today0(), td = w.today;
  const restDay = t0.getDay() === c.rest;
  let rem = Math.max(0, Math.round(c.perDay - (td.min || 0) - (td.kmin || 0))); const items = [];
  if (due) { const m = Math.min(rem, Math.ceil(due * 0.2)); items.push({ kind: "Ôn thẻ", m, label: `${due} thẻ đến hạn` }); rem -= m; }
  if (restDay) {
    if (rem > 0) items.push({ kind: "Kreuzen", m: rem, label: "Làm lại câu sai", sub: "AMBOSS: Session mit falsch beantworteten Fragen" });
    return { items, restDay, w };
  }
  // chưa có thẻ (trước GĐ2) thì phần giờ ôn thẻ dồn sang đọc
  let read = Math.min(rem, Math.max(0, Math.round(c.perDay * (w.share + (due ? 0 : w.shareA)) - (td.min || 0))));
  rem -= read;
  const left = CH.filter((x) => kap(x.id).st !== 2);
  for (const x of [...left.filter((y) => kap(y.id).st === 1), ...left.filter((y) => kap(y.id).st === 0)]) {
    if (read < 5) break;
    const need = Math.max(5, Math.ceil(estMin(x.id) * (1 - (kap(x.id).pct || 0))));
    const m = Math.min(read, need);
    items.push({ kind: kap(x.id).st === 0 ? "Chương mới" : "Đọc tiếp", m, id: x.id, label: x.t, sub: `Tag ${x.tag} · ${x.sub}${m < need ? ` · đọc ${m}′, còn ${need - m}′ để mai` : ""}` });
    read -= m;
  }
  rem += read;
  const tag = left[0]?.tag;
  if (rem >= 5) items.push({ kind: "Kreuzen", m: rem, label: `≈ ${Math.max(1, Math.round(rem / w.perQ))} câu${tag ? ` · chủ đề Tag ${tag}` : ""}`, sub: "Trong AMBOSS" });
  return { items, restDay, w };
}

/* ---------- làm sạch HTML dán vào → danh sách khối ---------- */
const KEEP = new Set("h1 h2 h3 h4 h5 h6 p ul ol li table thead tbody tfoot tr th td caption b strong i em u sub sup br img figure figcaption blockquote pre code".split(" "));
const DROP = new Set("script style noscript iframe object embed svg canvas video audio button input select textarea form nav header footer template link meta head title".split(" "));
const BLOCK = new Set("h1 h2 h3 h4 h5 h6 p ul ol table figure blockquote pre".split(" "));
function clean(node, out) {
  for (const n of [...node.childNodes]) {
    if (n.nodeType === 3) { out.appendChild(document.createTextNode(n.data)); continue; }
    if (n.nodeType !== 1) continue;
    const t = n.tagName.toLowerCase();
    if (DROP.has(t)) continue;
    if (!KEEP.has(t)) { clean(n, out); if (/^(div|section|article|main|aside|li|dd|dt)$/.test(t)) out.appendChild(document.createElement("br")); continue; }
    const e = document.createElement(t);
    if (t === "img") {
      const src = n.getAttribute("src") || "";
      if (/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(src)) { e.setAttribute("src", src); e.setAttribute("alt", n.getAttribute("alt") || ""); }
      else { const f = document.createElement("figure"); f.setAttribute("data-miss", "1"); f.textContent = "Hình chưa tải được: " + (n.getAttribute("alt") || "không tên") + ". Bấm để chọn ảnh."; out.appendChild(f); continue; }
    }
    if (t === "figure" && n.hasAttribute("data-miss")) e.setAttribute("data-miss", "1");
    if (t === "td" || t === "th") for (const a of ["colspan", "rowspan"]) { const v = +n.getAttribute(a); if (v > 1 && v < 50) e.setAttribute(a, v); }
    clean(n, e); out.appendChild(e);
  }
  return out;
}
function toBlocks(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const root = clean(doc.body, document.createElement("div"));
  const blocks = []; let para = null;
  const flush = () => { if (para && para.textContent.trim()) blocks.push(para.outerHTML); para = null; };
  const walk = (el) => {
    for (const n of [...el.childNodes]) {
      const t = n.nodeType === 1 ? n.tagName.toLowerCase() : "#";
      if (BLOCK.has(t)) { flush(); if (n.textContent.trim() || n.querySelector?.("img") || t === "figure") blocks.push(n.outerHTML); }
      else if (t === "img") { flush(); const f = document.createElement("figure"); f.appendChild(n); blocks.push(f.outerHTML); }
      else if (t === "br") { if (para && para.lastChild?.nodeName === "BR") flush(); else if (para) para.appendChild(n); }
      else if (t === "li" || t === "tr" || t === "td" || t === "th" || t === "thead" || t === "tbody") { flush(); walk(n); }
      else { (para ||= document.createElement("p")).appendChild(n); }
    }
  };
  walk(root); flush();
  return blocks.map((b) => b.replace(/(<br>\s*)+(<\/(p|li|td|th|h\d)>)/g, "$2").replace(/<p>(\s|<br>)+/g, "<p>"));
}
const textBlocks = (txt) => txt.replace(/\r/g, "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`);
const wordsOf = (blocks) => blocks.join(" ").replace(/<[^>]+>/g, " ").split(/\s+/).filter((w) => /\p{L}/u.test(w)).length;

/* ảnh → webp ≤ ~150KB (ảnh trong doc db, app iPhone/iPad không tải được /_blob) */
function dataBlob(u) { const [h, d] = u.split(","); const bin = atob(d); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: h.slice(5).split(";")[0] }); }
async function shrink(blob) {
  const bmp = await createImageBitmap(blob);
  for (const [w, q] of [[1400, .78], [1100, .7], [900, .6], [700, .5]]) {
    const s = Math.min(1, w / bmp.width); const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    let url = c.toDataURL("image/webp", q);
    if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", q);   // Safari cũ không mã hoá được webp
    if (url.length < 150e3) return url;
  }

}
async function shrinkImgs(blocks) {
  const out = [];
  for (const b of blocks) {
    if (!b.includes("data:image")) { out.push(b); continue; }
    const d = new DOMParser().parseFromString(b, "text/html");
    for (const im of d.querySelectorAll("img")) { if (im.src.length > 150e3) im.src = await shrink(dataBlob(im.src)); }
    out.push(d.body.innerHTML);
  }
  return out;
}

/* PDF → khối (pdf.js tải khi cần; chạy trên luồng chính vì artifact không cho worker từ CDN) */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";

async function pdfBlocks(file) {
  if (!window.pdfjsLib) { await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js"); }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const items = (await (await pdf.getPage(p)).getTextContent()).items.filter((i) => i.str.trim());
    let cur = null;
    for (const it of items) {
      const y = it.transform[5], size = Math.hypot(it.transform[2], it.transform[3]);
      if (cur && Math.abs(cur.y - y) < size * .5) { cur.s += (cur.s.endsWith(" ") || it.str.startsWith(" ") ? "" : " ") + it.str; cur.size = Math.max(cur.size, size); }
      else { if (cur) lines.push(cur); cur = { y, size, s: it.str, gap: cur ? cur.y - y : 99, p }; }
    }
    if (cur) lines.push({ ...cur, gap: 99 });
  }
  const sizes = lines.map((l) => l.size).sort((a, b) => a - b); const med = sizes[sizes.length >> 1] || 10;
  const out = []; let para = "";
  const flush = () => { if (para.trim()) out.push(`<p>${esc(para.trim())}</p>`); para = ""; };
  for (const l of lines) {
    const s = l.s.replace(/\s+/g, " ").trim();
    if (l.size > med * 1.18 && s.length < 140) { flush(); out.push(`<h3>${esc(s)}</h3>`); continue; }
    if (l.gap > l.size * 1.9) flush();
    para = para.endsWith("-") && /^\p{Ll}/u.test(s) ? para.slice(0, -1) + s : para + (para ? " " : "") + s;
  }
  flush();
  return out;
}

/* ---------- nội dung chương trong db ---------- */
async function loadText(id) {
  const snap = await DB.collection("txt").where("ch", "==", id).get();
  return snap.docs.map((d) => d.data()).sort((a, b) => a.k - b.k).flatMap((d) => d.blocks);
}
async function saveText(id, blocks) {
  const enc = new TextEncoder(); const chunks = [[]]; let size = 0;
  for (const b of blocks) {
    const n = enc.encode(b).length + 8;
    if (n > 240e3) throw new Error("Một khối quá lớn (>240KB), hãy dán nhỏ hơn");
    if (size + n > 200e3 && chunks.at(-1).length) { chunks.push([]); size = 0; }
    chunks.at(-1).push(b); size += n;
  }
  for (let k = 0; k < chunks.length; k++) await DB.doc(`txt/${id}-${k}`).set({ ch: id, k, blocks: chunks[k] });
  const old = kap(id).nchunk || 0;
  for (let k = chunks.length; k < old; k++) await DB.doc(`txt/${id}-${k}`).delete();
  return chunks.length;
}

function trackReading(id) {
  if (stopTrack) stopTrack();
  const pk = posKey();
  let pos = kap(id)[pk] || 0, pct = kap(id).pct || 0, ms = 0, last = Date.now(), tick = Date.now(), sel = null;
  const blks = [...document.querySelectorAll("#doc .blk")];
  const prog = () => { $("#rp").style.width = (pct * 100).toFixed(1) + "%"; };
  const onScroll = () => {
    last = Date.now();
    const top = 80; let i = blks.findIndex((b) => b.getBoundingClientRect().bottom > top); if (i < 0) i = blks.length - 1;
    const end = innerHeight + scrollY >= document.documentElement.scrollHeight - 40;
    const p = end ? 1 : Math.min(1, (i + 1) / blks.length);
    if (i !== pos || p > pct) { pos = i; pct = Math.max(pct, p); prog(); dirty(); }
  };
  let to = null; const dirty = () => { clearTimeout(to); to = setTimeout(flush, 1500); };
  const flush = () => {
    clearTimeout(to);
    const add = ms; ms = 0;
    const k = kap(id); putKap(id, { [pk]: pos, pct: k.st === 2 ? 1 : pct, ms: (k.ms || 0) + add });
    if (add) { const d = S.days[key(today0())] || {}; putDay({ min: Math.round(((d.min || 0) * MIN + add) / MIN * 10) / 10 }); }
  };
  // chỉ tính giờ khi trang đang hiện và có thao tác trong 2 phút gần nhất
  const timer = setInterval(() => { const now = Date.now(); if (document.visibilityState === "visible" && now - last < 2 * MIN) ms += now - tick; tick = now; if (ms > MIN) flush(); }, 10e3);
  const poke = () => { last = Date.now(); };
  const vis = () => { if (document.visibilityState === "hidden") flush(); };
  const onSel = () => { clearTimeout(sel); sel = setTimeout(selToolbar, 250); };
  addEventListener("scroll", onScroll, { passive: true }); addEventListener("pointerdown", poke); addEventListener("keydown", poke);
  document.addEventListener("visibilitychange", vis); document.addEventListener("selectionchange", onSel);
  prog();
  stopTrack = () => {
    clearInterval(timer); removeEventListener("scroll", onScroll); removeEventListener("pointerdown", poke); removeEventListener("keydown", poke);
    document.removeEventListener("visibilitychange", vis); document.removeEventListener("selectionchange", onSel);
    $("#seltb")?.remove(); const now = Date.now(); if (now - last < 2 * MIN) ms += now - tick; flush();
  };
}

function textOffset(blk, node, off) { const r = document.createRange(); r.selectNodeContents(blk); r.setEnd(node, off); return r.toString().length; }
function paintMark(m) {
  const blk = $(`#doc .blk[data-b="${m.b}"]`); if (!blk) return;
  const tw = document.createTreeWalker(blk, NodeFilter.SHOW_TEXT); const parts = []; let pos = 0, n;
  while ((n = tw.nextNode())) { const L = n.data.length, a = Math.max(m.s, pos), b = Math.min(m.e, pos + L); if (a < b) parts.push([n, a - pos, b - pos]); pos += L; if (pos >= m.e) break; }
  for (const [node, a, b] of parts) {
    let t = node; if (a > 0) t = t.splitText(a); if (b - a < t.data.length) t.splitText(b - a);
    const el = document.createElement("mark"); el.className = `hl c-${m.c}`; el.dataset.m = m.id; t.parentNode.replaceChild(el, t); el.appendChild(t);
  }
}
function unpaint(id) { for (const el of document.querySelectorAll(`mark[data-m="${id}"]`)) el.replaceWith(...el.childNodes); $("#doc")?.normalize(); }
function curSel() {
  const s = getSelection(); if (!s.rangeCount || s.isCollapsed) return null;
  const r = s.getRangeAt(0); const blk = (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement).closest("#doc .blk");
  if (!blk) return null;
  const s0 = textOffset(blk, r.startContainer, r.startOffset);
  const e0 = blk.contains(r.endContainer) ? textOffset(blk, r.endContainer, r.endOffset) : blk.textContent.length;   // chỉ trong một đoạn
  if (e0 - s0 < 1) return null;
  return { b: +blk.dataset.b, s: s0, e: e0, txt: blk.textContent.slice(s0, e0), rect: r.getBoundingClientRect() };
}

/* Markdown (con) → khối HTML. Chữ của Claude luôn được escape trước. */
function mdBlocks(src) {
  const inl = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  const L = src.replace(/\r/g, "").split("\n"), out = []; let i = 0;
  const LI = /^\s*([-*•]|\d+[.)])\s+/, ROW = /^\s*\|/;
  while (i < L.length) {
    const l = L[i]; let m;
    if (!l.trim() || /^\s*-{3,}\s*$/.test(l)) { i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = Math.min(4, m[1].length + 1); out.push(`<h${n}>${inl(m[2])}</h${n}>`); i++; continue; }
    if (ROW.test(l)) {
      const rows = []; while (i < L.length && ROW.test(L[i])) rows.push(L[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((x) => x.trim());
      const body = rows.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r));
      out.push(`<table>${body.map((r, j) => `<tr>${cells(r).map((x) => (j ? `<td>${inl(x)}</td>` : `<th>${inl(x)}</th>`)).join("")}</tr>`).join("")}</table>`); continue;
    }
    if (LI.test(l)) { const ord = /^\s*\d/.test(l), items = []; while (i < L.length && LI.test(L[i])) items.push(L[i++].replace(LI, "")); const t = ord ? "ol" : "ul"; out.push(`<${t}>${items.map((x) => `<li>${inl(x)}</li>`).join("")}</${t}>`); continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{1,4}\s)/.test(L[i]) && !ROW.test(L[i]) && !LI.test(L[i])) p.push(L[i++].replace(/^>\s?/, "")); out.push(`<p>${inl(p.join(" "))}</p>`);
  }
  return out;
}
let SAMPLE;
const getSample = () => (SAMPLE ||= window.claude?.use("sample").catch(() => null) ?? Promise.resolve(null));
function showEasy(c, replacing) {
  const has = R.blocks.length > 0;
  $("#rbody").innerHTML = `<div class="wrap">
    <div style="display:grid;gap:4px"><span class="eyebrow">Tag ${c.tag} · chương ${c.n}</span><h2 style="font-size:22px">${replacing ? "Soạn lại bài dễ hiểu" : "Bài giảng dễ hiểu"}</h2></div>
    <p class="small muted">Claude viết lại chương “${esc(c.t)}” bằng tiếng Việt thật dễ hiểu, giữ thuật ngữ thi tiếng Đức (kèm der/die/das).
      ${has ? "Dựa trên bài AMBOSS Vy đã dán." : "Chưa dán bài AMBOSS nên Claude dùng kiến thức chuẩn; dán bài AMBOSS trước (tab AMBOSS) thì bài sẽ sát nội dung thi hơn."} Mất khoảng 1–2 phút.</p>
    <div class="row"><button class="btn primary" id="egen">${replacing ? "Soạn lại" : "Soạn bài"}</button>${replacing ? `<button class="btn" id="ecancel">Huỷ</button>` : ""}<span class="small muted" id="estat"></span></div>
    <div class="preview" id="eprev" hidden><article class="doc easy" id="eprevdoc"></article></div>
  </div>`;
  if (replacing) $("#ecancel").onclick = () => showView(c, CH[c.i + 1]);
  $("#egen").onclick = async () => {
    const btn = $("#egen"); btn.disabled = true;
    const sample = await getSample();
    if (!sample) { $("#estat").textContent = "Trang chưa được phép hỏi Claude. Mở menu Permissions của trang để cho phép rồi thử lại."; btn.disabled = false; return; }
    const text = has ? R.blocks.join("\n").replace(/<figure[\s\S]*?<\/figure>/g, "").replace(/<\/(p|h\d|li|tr)>/g, "\n").replace(/<[^>]+>/g, " ").replace(/[ \t]+/g, " ").slice(0, 60000) : "";
    $("#estat").textContent = "Claude đang soạn…"; $("#eprev").hidden = false;
    let raf = 0;
    try {
      const r = await sample(EASY_PROMPT(c, text), { modelTier: "complex", onText: ({ text }) => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { $("#eprevdoc").innerHTML = mdBlocks(text).join(""); }); } });
      cancelAnimationFrame(raf);
      const blocks = mdBlocks(r.text);
      if (blocks.length < 3) throw new Error("Bài trả về quá ngắn, thử lại");
      const src = has ? "amboss" : "ai";
      await DB.doc("easy/" + c.id).set({ blocks, src, at: Date.now() });
      R.easy = blocks; R.easySrc = src; R.view = "e";
      if (replacing) putKap(c.id, { epos: 0 });
      showView(c, CH[c.i + 1]); toast(r.truncated ? "Đã lưu (bài bị cắt ngắn, có thể soạn lại)" : "Đã lưu bài dễ hiểu");
    } catch (e) {
      cancelAnimationFrame(raf);
      $("#estat").textContent = e.code === "rate_limited" ? "Claude đang bận, đợi một lúc rồi thử lại." : e.code === "not_granted" ? "Chưa được phép hỏi Claude." : "Chưa soạn được: " + (e.message || e.code);
      btn.disabled = false;
    }
  };
}

/* ---------- nhập nội dung chương ---------- */
function showImport(c, replacing) {
  if (!DB) return toast("Chưa kết nối được kho dữ liệu");
  let pending = [];
  $("#rbody").innerHTML = `<div class="wrap">
    <div style="display:grid;gap:4px"><span class="eyebrow">Tag ${c.tag} · chương ${c.n}</span><h2 style="font-size:22px">${replacing ? "Thay nội dung chương" : "Dán nội dung chương"}</h2></div>
    <p class="small muted">Mở chương “${esc(c.t)}” trong AMBOSS trên web, bôi đen cả bài, sao chép rồi dán vào ô dưới (giữ được tiêu đề, bảng). Có thể dán nhiều lần, dán cả ảnh chụp. Hoặc chọn file HTML, TXT, PDF.</p>
    <div id="paste" contenteditable="true" role="textbox" aria-label="Ô dán nội dung" tabindex="0">Chạm vào đây rồi dán (Ctrl/⌘ V)</div>
    <div class="row"><label class="btn" for="ifile" style="display:inline-grid;place-items:center">Chọn file…</label><input type="file" id="ifile" accept=".html,.htm,.txt,.pdf,image/*" multiple hidden>
      <span class="small muted" id="icount"></span></div>
    <div class="preview" id="iprev" hidden><article class="doc" id="iprevdoc"></article></div>
    <div class="row"><button class="btn primary" id="isave" disabled>Lưu chương</button><button class="btn" id="iclear" disabled>Xoá phần đã dán</button>${replacing ? `<button class="btn" id="icancel">Huỷ</button>` : ""}</div>
    ${replacing ? `<p class="small muted">Lưu sẽ thay toàn bộ nội dung cũ; vị trí đọc về đầu chương, đánh dấu cũ có thể lệch chỗ.</p>` : ""}
  </div>`;
  const upd = () => {
    $("#icount").textContent = pending.length ? `${pending.length} đoạn, ${wordsOf(pending)} từ` : "";
    $("#isave").disabled = $("#iclear").disabled = !pending.length; $("#iprev").hidden = !pending.length;
    $("#iprevdoc").innerHTML = pending.map((b) => /^<table/i.test(b) ? `<div class="tbl">${b}</div>` : b).join("");
  };
  const add = async (blocks) => { try { pending.push(...await shrinkImgs(blocks)); upd(); } catch (e) { toast(e.message); } };
  const box = $("#paste");
  box.onfocus = () => { if (!pending.length) box.textContent = ""; };
  box.onpaste = async (e) => {
    e.preventDefault(); const dt = e.clipboardData;
    const html = dt.getData("text/html"), txt = dt.getData("text/plain");
    const imgs = [...dt.files].filter((f) => f.type.startsWith("image/"));
    if (html) await add(toBlocks(html)); else if (txt) await add(textBlocks(txt));
    for (const f of imgs) await add([`<figure><img src="${await shrink(f)}" alt=""></figure>`]);
    box.textContent = "Dán tiếp nếu còn phần khác…"; box.blur();
  };
  box.oninput = () => { box.textContent = ""; };   // không cho gõ tay vào ô dán
  $("#ifile").onchange = async (e) => {
    for (const f of e.target.files) {
      try {
        if (f.type.startsWith("image/")) await add([`<figure><img src="${await shrink(f)}" alt=""></figure>`]);
        else if (/\.pdf$/i.test(f.name)) { toast("Đang đọc PDF…"); await add(await pdfBlocks(f)); }
        else if (/\.html?$/i.test(f.name)) await add(toBlocks(await f.text()));
        else await add(textBlocks(await f.text()));
      } catch (err) { toast(`${f.name}: ${err.message}`); }
    }
    e.target.value = "";
  };
  $("#iclear").onclick = () => { pending = []; upd(); };
  if (replacing) $("#icancel").onclick = () => showView(c, CH[c.i + 1]);
  $("#isave").onclick = async () => {
    $("#isave").disabled = true; $("#isave").textContent = "Đang lưu…";
    try {
      const n = await saveText(c.id, pending);
      putKap(c.id, { nb: pending.length, words: wordsOf(pending), nchunk: n, pos: 0, pct: replacing ? kap(c.id).pct : 0, st: Math.max(1, kap(c.id).st) });
      R.blocks = pending; R.view = "a"; showView(c, CH[c.i + 1]); toast("Đã lưu chương");
    } catch (e) { toast("Chưa lưu được: " + (e.message || e.code)); $("#isave").disabled = false; $("#isave").textContent = "Lưu chương"; }
  };
}
function replaceImg(b) {
  const pick = $("#imgpick");
  pick.onchange = async () => {
    const f = pick.files[0]; pick.value = ""; if (!f) return;
    try {
      R.blocks[b] = `<figure><img src="${await shrink(f)}" alt=""></figure>`;
      const id = R.id; await saveText(id, R.blocks);
      $(`#doc .blk[data-b="${b}"]`).innerHTML = R.blocks[b];
    } catch (e) { toast("Chưa thay được ảnh: " + (e.message || e.code)); }
  };
  pick.click();
}

let toastT = null;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3200); }

addEventListener("hashchange", route);
applyTheme();
route();

(async () => {
  const timeout = setTimeout(() => { if (!online) { S.off = true; rerender(); } }, 10e3);
  DB = await window.claude?.use("db").catch(() => null) ?? null;
  if (!DB) { clearTimeout(timeout); S.off = true; rerender(); return; }
  let first = true; const got = new Set();
  const ready = (what) => {
    if (!online) { online = true; S.off = false; clearTimeout(timeout); }
    got.add(what);
    // ghi mốc "sáng nay còn bao nhiêu" một lần mỗi ngày, khi đã có đủ dữ liệu
    const tk = key(today0());
    if (got.size === 3 && S.days[tk]?.r0 == null && S.r0For !== tk) { S.r0For = tk; putDay({ r0: Math.round(workload().total) }); }
    rerender();
  };
  const fail = (e) => { clearTimeout(timeout); toast("Kho dữ liệu lỗi: " + (e.message || e.code)); };
  DB.collection("kap").limit(1000).onSnapshot((snap) => {
    for (const d of snap.docs) if (d.id !== R.id) S.kap[d.id] = d.data();   // chương đang mở: bản trong trang là mới nhất
    if (!snap.metadata.fromCache || first) { first = false; ready("kap"); }
  }, fail);
  DB.doc("cfg/plan").onSnapshot((d) => { S.cfg = d.exists ? d.data() : null; ready("cfg"); }, fail);
  DB.collection("days").limit(1000).onSnapshot((snap) => { for (const d of snap.docs) S.days[d.id] = d.data(); ready("days"); }, fail);
})();
</script>
