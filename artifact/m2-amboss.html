<title>M2 Lernplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Bố cục: một cột đọc ~68 ký tự như trang sách, thanh tab dưới đáy trên điện thoại, trên cùng ở màn rộng.
   Chữ bài đọc là serif Literata (làm cho đọc màn hình lâu), giao diện là Lexend (dễ đọc cho người đọc chậm). */
:root {
  --bg: #f4f5f1;        /* giấy hơi xanh xám, đỡ chói hơn trắng */
  --panel: #ffffff;
  --line: #dfe2da;
  --fg: #1d2320;
  --muted: #5f6a64;
  --accent: #3550c8;    /* mực xanh bút bi */
  --accent-soft: #e3e8fb;
  --ok: #2f7d4f;
  --hard: rgba(235, 87, 110, .28);    /* đánh dấu "khó" */
  --again: rgba(240, 180, 40, .36);   /* đánh dấu "đọc lại" */
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs: 19px;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141716; --panel: #1c201e; --line: #2c322f; --fg: #e2e6e1; --muted: #9aa59f;
  --accent: #93a6ff; --accent-soft: #252c48; --ok: #6cc893;
  --hard: rgba(255, 110, 130, .30); --again: rgba(255, 200, 70, .28); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141716; --panel: #1c201e; --line: #2c322f; --fg: #e2e6e1; --muted: #9aa59f;
  --accent: #93a6ff; --accent-soft: #252c48; --ok: #6cc893;
  --hard: rgba(255, 110, 130, .30); --again: rgba(255, 200, 70, .28); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font: 15px/1.5 var(--font-ui); padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; font-weight: 600; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px; display: grid; gap: 18px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.btn { text-decoration: none; text-align: center; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; min-height: 40px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
.btn[aria-pressed=true] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.bar.ok i { background: var(--ok); }
input[type=number], input[type=date], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }

/* thanh tab */
nav.tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px;
  background: var(--panel); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
nav.tabs a { flex: 1; max-width: 160px; text-align: center; padding: 8px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; }
nav.tabs a[aria-current=page] { color: var(--accent); background: var(--accent-soft); }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); }
}
body.reading nav.tabs { display: none; }
body.reading { padding-bottom: 0; }

/* Hôm nay */
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mins { display: flex; gap: 6px; flex-wrap: wrap; }
.mins button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; min-height: 40px; font-variant-numeric: tabular-nums; }
.mins button[aria-pressed=true] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.mins input { width: 90px; }
ol.agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ol.agenda li { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 10px; background: var(--bg); }
ol.agenda li.done { opacity: .6; }
ol.agenda li.done b { text-decoration: line-through; }
label.tick { display: grid; place-items: center; width: 44px; height: 44px; cursor: pointer; }
label.tick input { width: 22px; height: 22px; accent-color: var(--ok); cursor: pointer; }
ol.agenda .t { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); text-align: right; }
ol.agenda .what { min-width: 0; }
ol.agenda .what b { font-weight: 500; display: block; }
ol.agenda a { color: inherit; text-decoration: none; }
.kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 2px; }
.stats b { font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
.note { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; }

/* Lộ trình */
details.fach { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
details.fach > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
details.fach > summary::-webkit-details-marker { display: none; }
details.fach > summary .bar { grid-column: 1 / -1; }
.tag { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 6px; }
.tag h3 { font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tag h3 .muted { font-weight: 400; }
.tag.cur { background: var(--accent-soft); }
ul.chs { list-style: none; margin: 0; padding: 0; display: grid; }
ul.chs a { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; color: inherit; text-decoration: none; min-height: 40px; }
ul.chs a:hover .tt { color: var(--accent); }
.tt { min-width: 0; overflow-wrap: anywhere; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--muted); justify-self: center; }
.dot.s1 { border-color: var(--accent); background: conic-gradient(var(--accent) var(--p, 30%), transparent 0); }
.dot.s2 { border-color: var(--ok); background: var(--ok); }
.pct { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.aud { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
#q { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; }

/* Trình đọc */
.rhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.rhead .in { max-width: 860px; margin: 0 auto; display: flex; gap: 6px; align-items: center; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); }
.rhead .ttl { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.rhead .ttl span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rhead .ttl b { display: block; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib { border: 0; background: transparent; min-width: 40px; height: 40px; border-radius: 8px; padding: 0 8px; color: var(--fg); }
.ib:hover { background: var(--line); }
.seg { max-width: 860px; margin: 0 auto; display: flex; gap: 4px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); }
.seg button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; min-height: 36px; font-size: 13px; color: var(--muted); }
.seg button[aria-selected=true] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
article.doc.easy b { color: var(--accent); font-weight: 600; }
.ai-note { font-family: var(--font-ui); border-left: 3px solid var(--line); padding-left: 10px; }
.rprog { height: 3px; background: var(--line); }
.rprog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
article.doc { max-width: 68ch; margin: 0 auto; font: var(--fs)/1.68 var(--font-read); padding: 24px max(18px, env(safe-area-inset-right, 0px)) 40px max(18px, env(safe-area-inset-left, 0px)); overflow-wrap: break-word; -webkit-text-size-adjust: 100%; }
article.doc .blk { scroll-margin-top: 72px; }
article.doc .blk > :first-child { margin-top: 0; }
article.doc p { margin: 0 0 .9em; }
article.doc h1, article.doc h2, article.doc h3, article.doc h4 { font-family: var(--font-read); font-weight: 700; margin: 1.5em 0 .5em; }
article.doc h1 { font-size: 1.5em; } article.doc h2 { font-size: 1.3em; } article.doc h3 { font-size: 1.12em; } article.doc h4, article.doc h5, article.doc h6 { font-size: 1em; }
article.doc ul, article.doc ol { padding-left: 1.3em; margin: 0 0 .9em; }
article.doc li { margin: .2em 0; }
article.doc .tbl { overflow-x: auto; margin: 0 0 1em; border: 1px solid var(--line); border-radius: 8px; }
article.doc table { border-collapse: collapse; font-size: .86em; line-height: 1.45; min-width: 100%; }
article.doc th, article.doc td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; min-width: 9em; }
article.doc td + td, article.doc th + th { border-left: 1px solid var(--line); }
article.doc th { background: var(--accent-soft); font-weight: 600; }
article.doc img { display: block; margin: 0 auto; border-radius: 6px; }
article.doc figure { margin: 0 0 1em; }
article.doc figcaption { font-size: .8em; color: var(--muted); text-align: center; margin-top: 4px; }
article.doc figure[data-miss] { border: 1px dashed var(--muted); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; font-family: var(--font-ui); font-size: 14px; color: var(--muted); }
article.doc blockquote { margin: 0 0 1em; padding-left: 1em; border-left: 3px solid var(--line); color: var(--muted); }
mark.hl { color: inherit; border-radius: 3px; cursor: pointer; }
mark.c-hard { background: var(--hard); }
mark.c-again { background: var(--again); }
.done-box { max-width: 68ch; margin: 0 auto 60px; padding: 0 18px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.done-box .btn { padding: 12px 24px; }
body.focus .rhead { display: none; }
#unfocus { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 25; opacity: .35; }
#unfocus:hover { opacity: 1; }

/* Thanh công cụ khi bôi đen, tấm trượt */
#seltb { position: fixed; z-index: 40; display: flex; gap: 4px; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#seltb button { border: 0; background: transparent; color: inherit; padding: 8px 12px; border-radius: 7px; min-height: 40px; font-size: 14px; }
#seltb button:hover { background: rgba(127,127,127,.25); }
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--panel); width: 100%; max-width: 640px; max-height: 85vh; overflow: auto; border-radius: 16px 16px 0 0; display: grid; gap: 12px;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 16px; } }
.sheet blockquote { margin: 0; font-family: var(--font-read); padding: 8px 12px; border-radius: 8px; }
.sheet textarea { width: 100%; min-height: 90px; }
.mlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.mlist button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px; display: grid; gap: 4px; }
.mlist q { font-family: var(--font-read); }

/* Nhập nội dung */
#paste { min-height: 160px; border: 2px dashed var(--line); border-radius: var(--r); padding: 16px; background: var(--panel); outline: none; color: var(--muted); }
#paste:focus { border-color: var(--accent); }
.preview { max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.preview article.doc { padding-top: 12px; font-size: 16px; }

/* Ôn thẻ */
.chip { justify-self: start; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.cardface { touch-action: manipulation; font: 20px/1.6 var(--font-read); padding: 12px 4px; min-height: 120px; overflow-wrap: break-word; }
.cardface .cz { color: var(--accent); font-weight: 700; }
.cardface .cx { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 16px; color: var(--muted); }
.rate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rate .btn { display: grid; gap: 0; border-radius: 10px; padding: 6px 4px; }
.rate .btn:first-child b { color: #c0392b; }
.draft { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.draft textarea { width: 100%; font-family: var(--font-read); font-size: 15px; }
.warn { color: #b26a00; }
.art-der { color: #2f6fd0; } .art-die { color: #c0392b; } .art-das { color: #2f7d4f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .art-der { color: #7fb0ff; } :root:not([data-theme="light"]) .art-die { color: #ff8a80; } :root:not([data-theme="light"]) .art-das { color: #6cc893; } :root:not([data-theme="light"]) .warn { color: #ffb74d; } }
:root[data-theme="dark"] .art-der { color: #7fb0ff; } :root[data-theme="dark"] .art-die { color: #ff8a80; } :root[data-theme="dark"] .art-das { color: #6cc893; } :root[data-theme="dark"] .warn { color: #ffb74d; }
article.doc { touch-action: manipulation; }
.blk.flash { animation: flash 2.4s ease-out; border-radius: 6px; }
@keyframes flash { 0%, 40% { background: var(--again); } 100% { background: transparent; } }

/* Chat bên cạnh bài đọc: cột phải trên màn rộng, tấm trượt dưới đáy trên điện thoại */
#chat { position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; height: 72vh; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18);
  display: flex; flex-direction: column; padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
#chat[hidden] { display: none; }
@media (min-width: 1000px) {
  #chat { left: auto; top: 0; height: auto; width: 380px; border-radius: 0; border-top: 0; border-left: 1px solid var(--line); box-shadow: none; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  body.chat-open #rbody, body.chat-open .rhead { margin-right: 380px; }
}
.chead { display: flex; gap: 8px; align-items: center; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
#clog { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 10px; padding: 10px 0; }
.msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; font-size: 15px; }
.msg.u { justify-self: end; background: var(--accent); color: var(--bg); white-space: pre-wrap; }
.msg.a { justify-self: start; background: var(--bg); display: grid; gap: 6px; }
.msg.a .doc { font: 15px/1.55 var(--font-ui); }
.msg.a .doc p, .msg.a .doc ul, .msg.a .doc ol { margin: 0 0 .5em; } .msg.a .doc h3, .msg.a .doc h4 { font-size: 15px; margin: .6em 0 .3em; }
.msg.a .doc b { color: var(--accent); }
.msg .btn.small { justify-self: start; min-height: 32px; padding: 4px 10px; font-size: 12px; }
#cctx { display: grid; gap: 2px; padding: 6px 8px; background: var(--accent-soft); border-radius: 8px; margin-bottom: 6px; }
#cctx:empty { display: none; }
#cctx q { font-family: var(--font-read); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cform { display: flex; gap: 6px; align-items: end; }
#cform textarea { flex: 1; min-width: 0; resize: none; }

/* Tiến độ */
.stats4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (min-width: 640px) { .stats4 { grid-template-columns: repeat(4, 1fr); } }
.stats4 div { display: grid; gap: 2px; align-content: start; }
.stats4 b { font-size: 24px; font-variant-numeric: tabular-nums; font-weight: 600; }
figure.chart { margin: 0; display: grid; gap: 6px; }
figure.chart figcaption { font-size: 13px; color: var(--muted); }
figure.chart figcaption b { color: var(--fg); font-weight: 600; }
figure.chart svg { width: 100%; height: auto; overflow: visible; }
figure.chart .ax { stroke: var(--line); stroke-width: 1; }
figure.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
figure.chart .lbl { fill: var(--muted); font-size: 9px; font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
figure.chart .fill { fill: var(--accent); }
figure.chart .hit { fill: transparent; }
figure.chart .bar:hover .fill { opacity: .75; }
figure.chart .bar:hover .hit { fill: var(--accent-soft); opacity: .5; }
ul.fachs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.fachs li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
ul.fachs .bar { grid-column: 1 / -1; }
@media (max-width: 480px) { nav.tabs a { font-size: 12px; padding: 8px 2px; } }
#toast.cheer { background: var(--ok); }

#toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100% - 32px); font-size: 14px; }
.burst { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: var(--bg); }
.burst svg { width: 28px; height: 28px; }
.burst path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s .1s ease-out forwards; }
.pop { animation: pop .45s ease-out; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .burst path { animation: none; stroke-dashoffset: 0; } .pop { animation: none; } .bar i, .rprog i { transition: none; } }
</style>

<script id="m2-plan" type="application/json">null</script>

<script>
"use strict";
/* ------------------------------------------------------------------ */
/* Dữ liệu: lộ trình nhúng sẵn (chỉ đọc); trạng thái nằm trong kho db   */
/*   cfg/plan          {start, rest, perDay, target?, kqTotal}          */
/*   kap/<id>          {st 0|1|2, pct, pos, ms, words, nb, doneAt}       */
/*   txt/<id>-<k>      {ch, k, blocks:[html]}  nội dung chương, cắt ≤200KB */
/*   mk/<id>           {list:[{id,b,s,e,c,note,txt}]}  đánh dấu          */
/*   easy/<id>         {blocks, src:"amboss"|"ai", at}  bài dễ hiểu Claude soạn */
/*   days/<YYYYMMDD>   {min, ch:[id], kq, kmin, r0, rv, rvms, nv, nw}  r0 = khối lượng còn lúc mở app sáng nay (phút) */
/*   cards/<ch>        {ch, due, list:[thẻ]}  thẻ Anki theo chương (xem phần SRS)  */
/*   dict/<từ>         nghĩa từ đã tra;  chat/<id> {msgs}  lịch sử chat theo chương */
/* Kho này tách hẳn khỏi Phòng Trực (Artifact khác, kho khác).          */
/* ------------------------------------------------------------------ */
const PLAN = JSON.parse(document.getElementById("m2-plan").textContent) || [];
const CH = PLAN.flatMap((d) => d.ch.map((c) => ({ ...c, tag: d.tag, fach: d.fach, sub: d.sub })));
const BY = Object.fromEntries(CH.map((c, i) => [c.id, { ...c, i }]));
const DAY = 864e5, MIN = 6e4;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let DB = null, online = false;
const S = { kap: {}, days: {}, cfg: null, off: false, cards: {}, dueChs: new Set(), dict: {} };

/* ---------- ngày ---------- */
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const key = (d) => iso(d).replaceAll("-", "");
const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const WD = ["Chủ nhật", "Thứ hai", "Thứ ba", "Thứ tư", "Thứ năm", "Thứ sáu", "Thứ bảy"];
const fmtD = (d) => `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
function cfg() {
  const c = S.cfg || {};
  return {
    start: c.start ? parseISO(c.start) : today0(),
    rest: Number.isInteger(c.rest) ? c.rest : 0,
    perDay: c.perDay || 60,                       // phút học mỗi ngày: con số duy nhất quyết định nhịp
    target: c.target ? parseISO(c.target) : null, // hạn muốn xong (tuỳ chọn), chỉ để so sánh
    kqTotal: c.kqTotal ?? 50 * PLAN.length,       // giả định ~50 câu/Lerntage AMBOSS, sửa trong Cài đặt
    cpc: c.cpc ?? 20,
    extra: !!c.extra,                             // ôn cả thẻ Anki ngoài lộ trình 100 ngày                             // thẻ Anki mỗi chương (10–20 kiến thức + vài thẻ từ vựng)
    set: !!S.cfg,
  };
}
function studyDays(from, to, rest) { let n = 0; for (let d = new Date(from); d <= to; d = addDays(d, 1)) if (d.getDay() !== rest) n++; return n; }
/* ngày học thứ n (1 = ngày học đầu tiên từ `from`, tính cả `from`), bỏ ngày nghỉ */
function nthStudyDay(from, n, rest) { let d = new Date(from); for (;;) { if (d.getDay() !== rest && --n <= 0) return d; d = addDays(d, 1); } }

/* ---------- ghi db: mỗi doc một lượt ghi, gộp các lần đổi liên tiếp ---------- */
const W = {};
function save(path, data) {
  if (!DB) return;
  const w = W[path] || (W[path] = { busy: false, next: null });
  w.next = data; if (!w.busy) pump(path);
}
async function pump(path) {
  const w = W[path]; w.busy = true;
  while (w.next) { const d = w.next; w.next = null; try { await DB.doc(path).set(d); } catch (e) { toast("Chưa lưu được: " + (e.message || e.code || e)); } }
  w.busy = false;
}
const kap = (id) => S.kap[id] || { st: 0, pct: 0, pos: 0, ms: 0, words: 0, nb: 0 };
function putKap(id, patch) { S.kap[id] = { ...kap(id), ...patch }; save("kap/" + id, S.kap[id]); }
function putDay(patch, d = today0()) {
  const k = key(d), was = active(S.days[k] || {});
  S.days[k] = { min: 0, ch: [], ...S.days[k], ...patch }; save("days/" + k, S.days[k]);
  if (!was && active(S.days[k]) && k === key(today0())) { const n = streak(); if (n > 1) setTimeout(() => toast(`Giữ được chuỗi ${n} ngày học`, true), 600); }
}

/* ---------- ước lượng thời gian đọc ---------- */
/* shortcut: mặc định 110 từ/phút (đọc tiếng Đức chậm); sau ≥2 chương đọc thật thì dùng tốc độ của Vy */
function rate() {
  let ms = 0, w = 0, n = 0;
  for (const k of Object.values(S.kap)) if (k.st === 2 && k.words > 300 && k.ms > 5 * MIN) { ms += k.ms; w += k.words; n++; }
  return n >= 2 ? ms / MIN / w : 1 / 110;     // phút / từ
}
function avgChapterMin() {
  const done = Object.values(S.kap).filter((k) => k.st === 2 && k.ms > 5 * MIN);
  return done.length >= 2 ? done.reduce((a, k) => a + k.ms, 0) / done.length / MIN : 30;
}
const estMin = (id) => { const k = kap(id); const m = k.words ? k.words * rate() : avgChapterMin(); return Math.min(120, Math.max(10, m)); };

/* ---------- cán cân: còn bao nhiêu việc, học M phút/ngày thì bao giờ xong ---------- */
function workload() {
  const c = cfg(), t0 = today0(), today = S.days[key(t0)] || {};
  const left = CH.filter((x) => kap(x.id).st !== 2);
  const readMin = left.reduce((a, x) => a + estMin(x.id) * (1 - (kap(x.id).pct || 0)), 0);
  const D = Object.values(S.days);
  const kqDone = D.reduce((a, d) => a + (d.kq || 0), 0), kMin = D.reduce((a, d) => a + (d.kmin || 0), 0);
  const perQ = kqDone >= 50 && kMin > 0 ? kMin / kqDone : 2;      // shortcut: 2 phút/câu cho tới khi có ≥50 câu đã ghi giờ
  const kqLeft = Math.max(0, c.kqTotal - kqDone), kzMin = kqLeft * perQ;
  // shortcut: mỗi thẻ cần ~6 lượt ôn cả đời thẻ; thẻ đang có coi như đã đi nửa đường. Giây/lượt đo từ lượt ôn thật (mặc định 10 giây)
  const perCard = secPerReview() * 6 / 60, haveCards = Object.values(S.kap).reduce((a, k) => a + (k.nc || 0), 0);
  // phút ôn Anki Vy tick (ôn ngoài app) được trừ thẳng vào phần Anki còn lại
  const ankiCards = left.length * c.cpc + haveCards, ankiMin = Math.max(0, (left.length * c.cpc + haveCards * 0.5) * perCard - D.reduce((a, d) => a + (d.amin || 0), 0));
  const total = readMin + kzMin + ankiMin;
  // chia phút mỗi ngày theo tỉ lệ việc còn lại → đọc, kreuzen, Anki xong cùng lúc
  const share = total ? readMin / total : 1, shareA = total ? ankiMin / total : 0;
  // từ hôm nay; phần hôm nay đã làm không tính lại
  const doneToday = dayMin(today);
  const finishAt = (rem) => nthStudyDay(t0, Math.max(1, Math.ceil((rem + doneToday) / c.perDay)), c.rest);
  const finish = finishAt(total), finish0 = today.r0 != null ? finishAt(today.r0 - doneToday) : null;
  const needForTarget = c.target && c.target >= t0 ? (total + doneToday) / Math.max(1, studyDays(t0, c.target, c.rest)) : null;
  return { c, left: left.length, readMin, kqLeft, kzMin, ankiCards, ankiMin, shareA, perCard, perQ, total, share, finish, finish0, needForTarget, today,
    chPerDay: c.perDay * share / (readMin / Math.max(1, left.length) || 30), qPerDay: Math.round(c.perDay * (1 - share - shareA)) / perQ };
}
const hm = (m) => { m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)} giờ${m % 60 ? " " + (m % 60) + "′" : ""}` : `${m}′`; };
const monthsTxt = (a, b) => { const d = Math.round((b - a) / DAY); return d < 60 ? `${d} ngày` : `${d} ngày (~${(d / 30.4).toFixed(1)} tháng)`; };

/* ---------- kế hoạch hôm nay ---------- */
function todayPlan(due = 0) {
  const w = workload(), c = w.c, t0 = today0(), td = w.today;
  const restDay = t0.getDay() === c.rest;
  let rem = Math.max(0, Math.round(c.perDay - dayMin(td))); const items = [];
  if (due && rem > 0) { const m = Math.min(rem, Math.max(1, Math.ceil(due * secPerReview() * 1.5 / 60))); items.push({ kind: "Ôn thẻ", m, label: `${due} thẻ đến hạn`, href: "#on", tk: "anki" }); rem -= m; }
  if (restDay) {
    if (rem > 0) items.push({ kind: "Kreuzen", m: rem, label: "Làm lại câu sai", sub: "AMBOSS: Session mit falsch beantworteten Fragen", tk: "kz", q: Math.max(1, Math.round(rem / w.perQ)) });
    return { items, restDay, w, due };
  }
  // chưa có thẻ (trước GĐ2) thì phần giờ ôn thẻ dồn sang đọc
  let read = Math.min(rem, Math.max(0, Math.round(c.perDay * (w.share + (due ? 0 : w.shareA)) - (td.min || 0))));
  rem -= read;
  const left = CH.filter((x) => kap(x.id).st !== 2);
  for (const x of [...left.filter((y) => kap(y.id).st === 1), ...left.filter((y) => kap(y.id).st === 0)]) {
    if (read < 5) break;
    const need = Math.max(5, Math.ceil(estMin(x.id) * (1 - (kap(x.id).pct || 0))));
    const m = Math.min(read, need);
    items.push({ tk: "ch:" + x.id, need, kind: kap(x.id).st === 0 ? "Chương mới" : "Đọc tiếp", m, id: x.id, label: x.t, sub: `Tag ${x.tag} · ${x.sub}${m < need ? ` · đọc ${m}′, còn ${need - m}′ để mai` : ""}` });
    read -= m;
  }
  rem += read;
  const tag = left[0]?.tag;
  if (rem >= 5) items.push({ kind: "Kreuzen", m: rem, tk: "kz", q: Math.max(1, Math.round(rem / w.perQ)), label: `≈ ${Math.max(1, Math.round(rem / w.perQ))} câu${tag ? ` · chủ đề Tag ${tag}` : ""}`, sub: "Trong AMBOSS" });
  return { items, restDay, w, due };
}

/* ---------- tick ngay trên danh sách Hôm nay: ghi thời gian tương đương, cán cân tự tính lại ---------- */
const dayMin = (d) => (d.min || 0) + (d.kmin || 0) + (d.amin || 0);
function tick(it) {
  const td = S.days[key(today0())] || {}, rec = { k: it.tk, m: it.m, kind: it.kind, label: it.label };
  if (it.tk.startsWith("ch:")) {
    const k = kap(it.id), full = it.m >= it.need;
    rec.prev = { st: k.st, pct: k.pct || 0, ms: k.ms || 0 }; rec.id = it.id; rec.full = full;
    putKap(it.id, full ? { st: 2, pct: 1, ms: (k.ms || 0) + it.m * MIN, doneAt: Date.now() }
      : { st: 1, pct: Math.min(0.95, (k.pct || 0) + it.m / estMin(it.id)), ms: (k.ms || 0) + it.m * MIN });
    putDay({ min: (td.min || 0) + it.m, ...(full ? { ch: [...(td.ch || []), it.id] } : {}), tk: [...(td.tk || []), rec] });
  } else if (it.tk === "kz") { rec.q = it.q; putDay({ kq: (td.kq || 0) + it.q, kmin: (td.kmin || 0) + it.m, tk: [...(td.tk || []), rec] }); }
  else putDay({ amin: (td.amin || 0) + it.m, tk: [...(td.tk || []), rec] });
}
function untick(i) {
  const td = S.days[key(today0())] || {}, rec = td.tk[i], tk = td.tk.filter((_, j) => j !== i);
  if (rec.k.startsWith("ch:")) { putKap(rec.id, { ...rec.prev, doneAt: null }); putDay({ min: Math.max(0, (td.min || 0) - rec.m), ch: (td.ch || []).filter((x) => !(rec.full && x === rec.id)), tk }); }
  else if (rec.k === "kz") putDay({ kq: Math.max(0, (td.kq || 0) - rec.q), kmin: Math.max(0, (td.kmin || 0) - rec.m), tk });
  else putDay({ amin: Math.max(0, (td.amin || 0) - rec.m), tk });
}

/* ---------- định tuyến theo hash ---------- */
let stopTrack = null;
function route() {
  const h = location.hash.slice(1) || "today";
  if (stopTrack) { stopTrack(); stopTrack = null; }
  if (revKeys) { removeEventListener("keydown", revKeys); revKeys = null; }
  R.id = null; chatClose();
  if (!CH.length) { $("#app").innerHTML = `<p class="wrap">Trang chưa có lộ trình: build bằng artifact/m2/tools/lernplan.py.</p>`; return; }
  document.body.classList.toggle("reading", h.startsWith("read-"));
  document.body.classList.remove("focus");
  for (const a of document.querySelectorAll("#tabs a")) if (a.dataset.v === h || (a.dataset.v === "on" && h.startsWith("duyet-"))) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  if (h.startsWith("read-")) return openReader(h.slice(5).replace("-", "_"));
  if (h === "plan") return viewPlan();
  if (h === "on") return viewReview();
  if (h === "tien-do") return viewStats();
  if (h.startsWith("duyet-")) return viewDrafts(unhash(h.slice(6)));
  if (h === "cai-dat") return viewSettings();
  return viewToday();
}
// dữ liệu mới về thì vẽ lại, trừ khi đang đọc hoặc đang gõ vào một ô
const rerender = () => {
  if (document.body.classList.contains("reading") || document.activeElement?.closest?.("#app input, #app select, #app textarea")) return;
  if (location.hash.startsWith("#duyet-") || (location.hash === "#on" && !$("#show"))) return;   // đang lật thẻ / duyệt thẻ thì không vẽ lại
  route();
};
const readHref = (id) => "#read-" + id.replace("_", "-");

/* ---------- Hôm nay ---------- */
function viewToday() {
  const p = todayPlan(dueCount()), w = p.w, c = w.c, td = w.today, st = streak();
  const done = CH.length - w.left;
  const opts = [30, 60, 90, 120, 180];
  const shift = w.finish0 ? Math.round((w.finish - w.finish0) / DAY) : 0;
  $("#app").innerHTML = `<div class="wrap">
    <header style="display:grid;gap:4px">
      <span class="eyebrow">${WD[new Date().getDay()]}, ${fmtD(new Date())}${p.restDay ? " · ngày ôn" : ""}</span>
      <h1 style="font-size:26px">${p.restDay ? "Hôm nay chỉ ôn" : "Hôm nay học gì"}</h1>
      ${st ? `<span class="chip">Chuỗi ${st} ngày học</span>` : ""}
    </header>
    ${S.off ? `<p class="note small">Chưa kết nối được kho dữ liệu, tiến độ chưa được lưu.</p>` : ""}
    <section class="card">
      <span class="eyebrow">Mỗi ngày học</span>
      <div class="mins">${opts.map((m) => `<button data-m="${m}" aria-pressed="${c.perDay === m}">${m} phút</button>`).join("")}
        <input id="mcustom" type="number" min="15" max="900" step="5" inputmode="numeric" aria-label="Số phút khác" placeholder="khác" value="${opts.includes(c.perDay) ? "" : c.perDay}"></div>
      <p class="small">Với ${hm(c.perDay)}/ngày, nghỉ ${WD[c.rest]}: mỗi ngày <b>≈ ${w.chPerDay.toFixed(1)} chương</b> (${hm(c.perDay * w.share)}) + <b>≈ ${Math.round(w.qPerDay)} câu kreuzen</b> (${hm(c.perDay * (1 - w.share - w.shareA))}) + <b>ôn Anki ${hm(c.perDay * w.shareA)}</b> → <b>xong ${fmtD(w.finish)}</b>, còn ${monthsTxt(today0(), w.finish)}.</p>
      ${p.due ? "" : `<p class="small muted">Hôm nay chưa có thẻ đến hạn nên giờ ôn thẻ dồn sang đọc.</p>`}
      <ol class="agenda">${(td.tk || []).map((r, i) => `<li class="done">
        <span class="t">${r.m}′</span><span class="what"><span class="kind">${esc(r.kind)} · đã xong</span><b>${esc(r.label)}</b></span>
        <label class="tick" title="Bỏ tick"><input type="checkbox" checked data-un="${i}" aria-label="Bỏ tick ${esc(r.label)}"></label></li>`).join("")}${p.items.map((i, n) => `<li>
        <span class="t">${i.m}′</span>
        <span class="what">${i.id || i.href ? `<a href="${i.href || readHref(i.id)}">` : ""}<span class="kind">${esc(i.kind)}</span><b>${esc(i.label)}</b>${i.sub ? `<span class="small muted">${esc(i.sub)}</span>` : ""}${i.id || i.href ? "</a>" : ""}</span>
        ${i.tk ? `<label class="tick" title="Tick khi đã làm xong"><input type="checkbox" data-tk="${n}" aria-label="Đã xong ${esc(i.label)}"></label>` : "<span></span>"}
      </li>`).join("") || `<li><span></span><span class="muted">Đủ ${hm(c.perDay)} hôm nay rồi. Học thêm thì ngày xong sẽ sớm hơn.</span><span></span></li>`}</ol>
      <p class="small muted">Tick một mục khi đã làm xong ngoài app (đọc trên AMBOSS, kreuzen, ôn Anki): app ghi thời gian tương đương, cán cân bên dưới tự tính lại.</p>
    </section>
    <section class="card">
      <span class="eyebrow">Hôm nay đã làm</span>
      <div class="stats">
        <div><span class="kind">Chương xong</span><b>${(td.ch || []).length}</b></div>
        <div><span class="kind">Phút đọc</span><b>${Math.round(td.min || 0)}</b></div>
        <div><span class="kind">Câu kreuzen</span><b>${td.kq || 0}</b></div>
        <div><span class="kind">Thẻ đã ôn</span><b>${td.rv || 0}</b></div>
      </div>
    </section>
    <section class="card">
      <span class="eyebrow">Cán cân: còn lại bao nhiêu</span>
      <div class="stats">
        <div><span class="kind">Chương</span><b>${w.left}</b><span class="small muted">≈ ${hm(w.readMin)} đọc</span></div>
        <div><span class="kind">Câu kreuzen</span><b>${w.kqLeft}</b><span class="small muted">≈ ${hm(w.kzMin)}</span></div>
        <div><span class="kind">Thẻ Anki</span><b>≈ ${w.ankiCards}</b><span class="small muted">≈ ${hm(w.ankiMin)} ôn còn lại</span></div>
      </div>
      <div class="bar ok"><i style="width:${(done / CH.length * 100).toFixed(1)}%"></i></div>
      <ul class="small" style="margin:0;padding-left:1.1em;display:grid;gap:4px">
        <li>Tổng còn <b>${hm(w.total)}</b>${td.r0 != null ? `; hôm nay đã bớt <b>${hm(Math.max(0, td.r0 - w.total))}</b>` : ""}.</li>
        ${w.finish0 ? `<li>Ngày xong: <b>${fmtD(w.finish)}</b>${shift ? ` (sáng nay ${fmtD(w.finish0)}, ${shift < 0 ? `sớm hơn ${-shift}` : `trễ hơn ${shift}`} ngày)` : " (như sáng nay)"}.</li>` : ""}
        ${w.needForTarget != null ? `<li>Muốn xong trước <b>${fmtD(c.target)}</b> cần <b>${hm(w.needForTarget)}/ngày</b> (${w.needForTarget > c.perDay ? `tăng ${hm(w.needForTarget - c.perDay)}` : `dư ${hm(c.perDay - w.needForTarget)}`}).</li>` : `<li class="muted">Đặt hạn thi trong <a href="#cai-dat">Cài đặt</a> để biết cần bao nhiêu phút/ngày cho kịp.</li>`}
      </ul>
      <p class="small muted">Ước ${Math.round(w.readMin / Math.max(1, w.left))}′ đọc/chương, ${w.perQ.toFixed(1)}′/câu kreuzen, mục tiêu ${c.kqTotal} câu, ${c.cpc} thẻ/chương × ~${w.perCard.toFixed(1)}′ ôn/thẻ; tự chỉnh theo số Vy ghi thật.</p>
    </section>
  </div>`;
  for (const b of document.querySelectorAll("[data-tk]")) b.onchange = () => { tick(p.items[+b.dataset.tk]); viewToday(); };
  for (const b of document.querySelectorAll("[data-un]")) b.onchange = () => { untick(+b.dataset.un); viewToday(); };
  for (const b of document.querySelectorAll(".mins button")) b.onclick = () => setMin(+b.dataset.m);
  $("#mcustom").onchange = (e) => { const v = Math.round(+e.target.value); if (v >= 15 && v <= 900) setMin(v); };
}
function putCfg(patch) { const c = cfg(); S.cfg = { start: iso(c.start), rest: c.rest, perDay: c.perDay, kqTotal: c.kqTotal, cpc: c.cpc, extra: c.extra, ...(c.target ? { target: iso(c.target) } : {}), ...patch }; save("cfg/plan", S.cfg); }
function setMin(m) { putCfg({ perDay: m }); document.activeElement?.blur(); viewToday(); }

/* ---------- Lộ trình ---------- */
function viewPlan() {
  const cur = CH.find((c) => kap(c.id).st !== 2)?.tag;
  // ngày dự kiến xong từng Tag, theo số phút/ngày hiện tại

/* ---------- làm sạch HTML dán vào → danh sách khối ---------- */
const KEEP = new Set("h1 h2 h3 h4 h5 h6 p ul ol li table thead tbody tfoot tr th td caption b strong i em u sub sup br img figure figcaption blockquote pre code".split(" "));
const DROP = new Set("script style noscript iframe object embed svg canvas video audio button input select textarea form nav header footer template link meta head title".split(" "));
const BLOCK = new Set("h1 h2 h3 h4 h5 h6 p ul ol table figure blockquote pre".split(" "));
function clean(node, out) {
  for (const n of [...node.childNodes]) {
    if (n.nodeType === 3) { out.appendChild(document.createTextNode(n.data)); continue; }
    if (n.nodeType !== 1) continue;
    const t = n.tagName.toLowerCase();
    if (DROP.has(t)) continue;
    if (!KEEP.has(t)) { clean(n, out); if (/^(div|section|article|main|aside|li|dd|dt)$/.test(t)) out.appendChild(document.createElement("br")); continue; }
    const e = document.createElement(t);
    if (t === "img") {
      const src = n.getAttribute("src") || "";
      if (/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(src)) { e.setAttribute("src", src); e.setAttribute("alt", n.getAttribute("alt") || ""); }
      else { const f = document.createElement("figure"); f.setAttribute("data-miss", "1"); f.textContent = "Hình chưa tải được: " + (n.getAttribute("alt") || "không tên") + ". Bấm để chọn ảnh."; out.appendChild(f); continue; }
    }
    if (t === "figure" && n.hasAttribute("data-miss")) e.setAttribute("data-miss", "1");
    if (t === "td" || t === "th") for (const a of ["colspan", "rowspan"]) { const v = +n.getAttribute(a); if (v > 1 && v < 50) e.setAttribute(a, v); }
    clean(n, e); out.appendChild(e);
  }
  return out;
}
function toBlocks(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const root = clean(doc.body, document.createElement("div"));
  const blocks = []; let para = null;
  const flush = () => { if (para && para.textContent.trim()) blocks.push(para.outerHTML); para = null; };
  const walk = (el) => {
    for (const n of [...el.childNodes]) {
      const t = n.nodeType === 1 ? n.tagName.toLowerCase() : "#";
      if (BLOCK.has(t)) { flush(); if (n.textContent.trim() || n.querySelector?.("img") || t === "figure") blocks.push(n.outerHTML); }
      else if (t === "img") { flush(); const f = document.createElement("figure"); f.appendChild(n); blocks.push(f.outerHTML); }
      else if (t === "br") { if (para && para.lastChild?.nodeName === "BR") flush(); else if (para) para.appendChild(n); }
      else if (t === "li" || t === "tr" || t === "td" || t === "th" || t === "thead" || t === "tbody") { flush(); walk(n); }
      else { (para ||= document.createElement("p")).appendChild(n); }
    }
  };
  walk(root); flush();
  return blocks.map((b) => b.replace(/(<br>\s*)+(<\/(p|li|td|th|h\d)>)/g, "$2").replace(/<p>(\s|<br>)+/g, "<p>"));
}
const textBlocks = (txt) => txt.replace(/\r/g, "").split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`);
const wordsOf = (blocks) => blocks.join(" ").replace(/<[^>]+>/g, " ").split(/\s+/).filter((w) => /\p{L}/u.test(w)).length;

/* ảnh → webp ≤ ~150KB (ảnh trong doc db, app iPhone/iPad không tải được /_blob) */
function dataBlob(u) { const [h, d] = u.split(","); const bin = atob(d); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: h.slice(5).split(";")[0] }); }
async function shrink(blob) {
  const bmp = await createImageBitmap(blob);
  for (const [w, q] of [[1400, .78], [1100, .7], [900, .6], [700, .5]]) {
    const s = Math.min(1, w / bmp.width); const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    let url = c.toDataURL("image/webp", q);
    if (!url.startsWith("data:image/webp")) url = c.toDataURL("image/jpeg", q);   // Safari cũ không mã hoá được webp
    if (url.length < 150e3) return url;

}
async function shrinkImgs(blocks) {
  const out = [];
  for (const b of blocks) {
    if (!b.includes("data:image")) { out.push(b); continue; }
    const d = new DOMParser().parseFromString(b, "text/html");
    for (const im of d.querySelectorAll("img")) { if (im.src.length > 150e3) im.src = await shrink(dataBlob(im.src)); }
    out.push(d.body.innerHTML);
  }
  return out;
}

/* PDF → khối (pdf.js tải khi cần; chạy trên luồng chính vì artifact không cho worker từ CDN) */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const loadScript = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("Không tải được thư viện (kiểm tra mạng)")); document.head.appendChild(s); });
async function pdfBlocks(file) {
  if (!window.pdfjsLib) { await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js"); }
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer(), isEvalSupported: false }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const items = (await (await pdf.getPage(p)).getTextContent()).items.filter((i) => i.str.trim());
    let cur = null;
    for (const it of items) {
      const y = it.transform[5], size = Math.hypot(it.transform[2], it.transform[3]);
      if (cur && Math.abs(cur.y - y) < size * .5) { cur.s += (cur.s.endsWith(" ") || it.str.startsWith(" ") ? "" : " ") + it.str; cur.size = Math.max(cur.size, size); }
      else { if (cur) lines.push(cur); cur = { y, size, s: it.str, gap: cur ? cur.y - y : 99, p }; }
    }
    if (cur) lines.push({ ...cur, gap: 99 });
  }
  const sizes = lines.map((l) => l.size).sort((a, b) => a - b); const med = sizes[sizes.length >> 1] || 10;
  const out = []; let para = "";
  const flush = () => { if (para.trim()) out.push(`<p>${esc(para.trim())}</p>`); para = ""; };
  for (const l of lines) {
    const s = l.s.replace(/\s+/g, " ").trim();
    if (l.size > med * 1.18 && s.length < 140) { flush(); out.push(`<h3>${esc(s)}</h3>`); continue; }
    if (l.gap > l.size * 1.9) flush();
    para = para.endsWith("-") && /^\p{Ll}/u.test(s) ? para.slice(0, -1) + s : para + (para ? " " : "") + s;
  }
  flush();
  return out;
}

async function loadText(id) {

}
async function saveText(id, blocks) {
  const enc = new TextEncoder(); const chunks = [[]]; let size = 0;
  for (const b of blocks) {
    const n = enc.encode(b).length + 8;
    if (n > 240e3) throw new Error("Một khối quá lớn (>240KB), hãy dán nhỏ hơn");
    if (size + n > 200e3 && chunks.at(-1).length) { chunks.push([]); size = 0; }
    chunks.at(-1).push(b); size += n;
  }
  for (let k = 0; k < chunks.length; k++) await DB.doc(`txt/${id}-${k}`).set({ ch: id, k, blocks: chunks[k] });
  const old = kap(id).nchunk || 0;
  for (let k = chunks.length; k < old; k++) await DB.doc(`txt/${id}-${k}`).delete();
  return chunks.length;
}

  let to = null; const dirty = () => { clearTimeout(to); to = setTimeout(flush, 1500); };
  const flush = () => {
    clearTimeout(to);
    const add = ms; ms = 0;
    const k = kap(id); putKap(id, { [pk]: pos, pct: k.st === 2 ? 1 : pct, ms: (k.ms || 0) + add });
    if (add) { const d = S.days[key(today0())] || {}; putDay({ min: Math.round(((d.min || 0) * MIN + add) / MIN * 10) / 10 }); }
  };
  // chỉ tính giờ khi trang đang hiện và có thao tác trong 2 phút gần nhất
  const timer = setInterval(() => { const now = Date.now(); if (document.visibilityState === "visible" && now - last < 2 * MIN) ms += now - tick; tick = now; if (ms > MIN) flush(); }, 10e3);
  const poke = () => { last = Date.now(); };
  const vis = () => { if (document.visibilityState === "hidden") flush(); };
  const onSel = () => { clearTimeout(sel); sel = setTimeout(selToolbar, 250); };
  addEventListener("scroll", onScroll, { passive: true }); addEventListener("pointerdown", poke); addEventListener("keydown", poke);
  document.addEventListener("visibilitychange", vis); document.addEventListener("selectionchange", onSel);
  prog();
  stopTrack = () => {
    clearInterval(timer); removeEventListener("scroll", onScroll); removeEventListener("pointerdown", poke); removeEventListener("keydown", poke);
    document.removeEventListener("visibilitychange", vis); document.removeEventListener("selectionchange", onSel);
    $("#seltb")?.remove(); const now = Date.now(); if (now - last < 2 * MIN) ms += now - tick; flush();
  };
}

function textOffset(blk, node, off) { const r = document.createRange(); r.selectNodeContents(blk); r.setEnd(node, off); return r.toString().length; }
function paintMark(m) {
  const blk = $(`#doc .blk[data-b="${m.b}"]`); if (!blk) return;
  const tw = document.createTreeWalker(blk, NodeFilter.SHOW_TEXT); const parts = []; let pos = 0, n;
  while ((n = tw.nextNode())) { const L = n.data.length, a = Math.max(m.s, pos), b = Math.min(m.e, pos + L); if (a < b) parts.push([n, a - pos, b - pos]); pos += L; if (pos >= m.e) break; }
  for (const [node, a, b] of parts) {
    let t = node; if (a > 0) t = t.splitText(a); if (b - a < t.data.length) t.splitText(b - a);
    const el = document.createElement("mark"); el.className = `hl c-${m.c}`; el.dataset.m = m.id; t.parentNode.replaceChild(el, t); el.appendChild(t);
  }
}

function curSel() {
  const s = getSelection(); if (!s.rangeCount || s.isCollapsed) return null;
  const r = s.getRangeAt(0); const blk = (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement).closest("#doc .blk");
  if (!blk) return null;
  const s0 = textOffset(blk, r.startContainer, r.startOffset);
  const e0 = blk.contains(r.endContainer) ? textOffset(blk, r.endContainer, r.endOffset) : blk.textContent.length;   // chỉ trong một đoạn
  if (e0 - s0 < 1) return null;

}

/* Markdown (con) → khối HTML. Chữ của Claude luôn được escape trước. */
function mdBlocks(src) {
  const inl = (x) => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  const L = src.replace(/\r/g, "").split("\n"), out = []; let i = 0;
  const LI = /^\s*([-*•]|\d+[.)])\s+/, ROW = /^\s*\|/;
  while (i < L.length) {
    const l = L[i]; let m;
    if (!l.trim() || /^\s*-{3,}\s*$/.test(l)) { i++; continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = Math.min(4, m[1].length + 1); out.push(`<h${n}>${inl(m[2])}</h${n}>`); i++; continue; }
    if (ROW.test(l)) {
      const rows = []; while (i < L.length && ROW.test(L[i])) rows.push(L[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((x) => x.trim());
      const body = rows.filter((r) => !/^\s*\|?\s*:?-{2,}/.test(r));
      out.push(`<table>${body.map((r, j) => `<tr>${cells(r).map((x) => (j ? `<td>${inl(x)}</td>` : `<th>${inl(x)}</th>`)).join("")}</tr>`).join("")}</table>`); continue;
    }
    if (LI.test(l)) { const ord = /^\s*\d/.test(l), items = []; while (i < L.length && LI.test(L[i])) items.push(L[i++].replace(LI, "")); const t = ord ? "ol" : "ul"; out.push(`<${t}>${items.map((x) => `<li>${inl(x)}</li>`).join("")}</${t}>`); continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{1,4}\s)/.test(L[i]) && !ROW.test(L[i]) && !LI.test(L[i])) p.push(L[i++].replace(/^>\s?/, "")); out.push(`<p>${inl(p.join(" "))}</p>`);
  }
  return out;
}

/* SRS: SM-2 kiểu Anki, chép từ Phòng Trực (chép chứ không dùng chung để không đụng Phòng Trực) */
/* ------------------------------------------------------------------ */
const SRS = { learn: [1, 10], relearn: [10], grad: 1, easyIvl: 4, ease: 2.5, minEase: 1.3, easyBonus: 1.3, hard: 1.2, lapse: 0.2, maxIvl: 365 };
const newCard = (now = Date.now()) => ({ state: "new", due: now, ivl: 0, ease: SRS.ease, reps: 0, lapses: 0, step: 0, last: null });
function schedule(prev, rating, now = Date.now()) {
  const c = { ...prev, reps: prev.reps + 1, last: now };
  const learning = prev.state === "new" || prev.state === "learning" || prev.state === "relearning";
  if (learning) {
    const steps = prev.state === "relearning" ? SRS.relearn : SRS.learn;
    if (rating === "again") { c.state = prev.state === "relearning" ? "relearning" : "learning"; c.step = 0; c.due = now + steps[0] * MIN; return c; }
    if (rating === "easy") { c.state = "review"; c.step = 0; c.ivl = prev.state === "relearning" ? Math.max(1, prev.ivl) : SRS.easyIvl; c.due = now + c.ivl * DAY; return c; }
    const nx = prev.step + (rating === "good" ? 1 : 0);
    if (nx < steps.length) { c.state = prev.state === "new" ? "learning" : prev.state; c.step = nx; c.due = now + steps[nx] * MIN; return c; }
    c.state = "review"; c.step = 0; c.ivl = prev.state === "relearning" ? Math.max(1, prev.ivl) : SRS.grad; c.due = now + c.ivl * DAY; return c;
  }
  if (rating === "again") { c.state = "relearning"; c.lapses = prev.lapses + 1; c.ease = Math.max(SRS.minEase, prev.ease - 0.2); c.ivl = Math.max(1, prev.ivl * SRS.lapse); c.step = 0; c.due = now + SRS.relearn[0] * MIN; return c; }
  const over = Math.max(0, (now - prev.due) / DAY);
  let ivl;
  if (rating === "hard") { c.ease = Math.max(SRS.minEase, prev.ease - 0.15); ivl = prev.ivl * SRS.hard; }
  else if (rating === "good") ivl = (prev.ivl + over / 2) * prev.ease;
  else { c.ease = prev.ease + 0.15; ivl = (prev.ivl + over) * prev.ease * SRS.easyBonus; }
  c.ivl = Math.min(SRS.maxIvl, Math.max(prev.ivl + 1, Math.round(ivl)));
  c.due = now + c.ivl * DAY;
  return c;
}
const fmtIvl = (ms) => ms < 60 * MIN ? `${Math.max(1, Math.round(ms / MIN))}′` : ms < DAY ? `${Math.round(ms / 36e5)} giờ` : `${Math.round(ms / DAY)} ngày`;

/* Thẻ: mỗi chương một doc cards/<ch> {ch, due, list}; due = hạn sớm nhất để chỉ tải chương có thẻ đến hạn. */
/* Thẻ: {id, t:"vocab"|"wissen"|"fall"|"apkg", f, x, h?(f/x là HTML), b?, v?, tags, st:"draft"|"on", c?, at} */
/* Thẻ kiến thức/apkg chỉ vào hàng ôn khi chương đã "Đọc xong"; từ vựng và tình huống thì ôn ngay.   */
/* ------------------------------------------------------------------ */
const NEW_PER_DAY = { vocab: 10, other: 30 };
const FAR = 9e15;
const cid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const base = (ch) => ch.split("~")[0];   // "t1_3~2" = doc phụ của chương t1_3 khi chương có quá nhiều thẻ
const isCh = (ch) => !!BY[base(ch)];
function unlocked(card, ch) {
  if (card.t === "vocab" || card.t === "fall") return true;
  const b = base(ch);
  if (BY[b]) return kap(b).st === 2;                                                     // thẻ của chương: sau khi đọc xong chương
  if (/^_d\d+$/.test(b)) return PLAN[+b.slice(2) - 1]?.ch.every((c) => kap(c.id).st === 2);   // thẻ chung của Tag: khi xong cả Tag
  if (b.startsWith("_apkg")) return !!cfg().extra;                                       // ngoài lộ trình: chỉ khi Vy bật
  return true;
}
function putCards(ch, list) {
  S.cards[ch] = list;
  const on = list.filter((x) => x.st === "on");
  save("cards/" + ch, { ch, due: on.length ? Math.min(...on.map((x) => x.c.due)) : FAR, list });
  const nc = on.length, nd = list.length - nc, k = S.kap[ch] || {};
  if (k.nc !== nc || k.nd !== nd) putKap(ch, { nc, nd });
  S.dueChs.add(ch);
}
async function getCards(ch) {
  if (S.cards[ch]) return S.cards[ch];
  const d = await DB.doc("cards/" + ch).get();
  return (S.cards[ch] = d.exists ? [...(d.data().list || [])] : []);
}
const norm = (s) => String(s).toLowerCase().replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g, "$1").replace(/<[^>]+>/g, " ").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function similar(a, b) {   // trùng ý: Jaccard từ ≥ 0.7
  const A = new Set(norm(a).split(" ").filter((w) => w.length > 2)), B = new Set(norm(b).split(" ").filter((w) => w.length > 2));
  if (!A.size || !B.size) return false; let n = 0; for (const w of A) if (B.has(w)) n++;
  return n / (A.size + B.size - n) >= 0.7;
}
const clozeAns = (f) => [...f.matchAll(/\{\{c\d+::(.*?)(::.*?)?\}\}/g)].map((m) => m[1]);
function cardWarn(f) {
  const w = [], ans = clozeAns(f), nums = new Set([...f.matchAll(/\{\{c(\d+)::/g)].map((m) => m[1]));
  if (!ans.length) w.push("chưa có {{c1::…}}");
  if (nums.size > 2) w.push("quá nhiều cloze");
  if (ans.some((a) => a.split(/\s+/).length > 5)) w.push("đáp án dài hơn 5 từ");
  if (/^\s*(ist|sind|hat|kann|gibt)\b.*\?\s*$/i.test(f.replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g, "$1"))) w.push("câu có/không");
  return w;
}
/* hiển thị mặt thẻ; thẻ tự soạn là chữ thuần (escape), thẻ apkg là HTML đã làm sạch */
function cardHTML(card, back) {
  const body = card.h ? card.f : esc(card.f);
  let out = body.replace(/\{\{c\d+::(.*?)(?:::(.*?))?\}\}/g, (_, a, hint) => back ? `<b class="cz">${a}</b>` : `<span class="cz">[${hint || "…"}]</span>`);
  if (back && card.x) out += `<div class="cx">${card.h ? card.x : esc(card.x).replace(/\n/g, "<br>")}</div>`;
  return out;
}

/* hàng ôn hôm nay: thẻ ôn/đang học đến hạn trong ngày + thẻ mới trong giới hạn ngày */
function queue() {
  const td = S.days[key(today0())] || {}, eod = addDays(today0(), 1).getTime();
  let nv = NEW_PER_DAY.vocab - (td.nv || 0), nw = NEW_PER_DAY.other - (td.nw || 0);
  const rev = [], fresh = [];
  for (const ch of S.dueChs) for (const c of S.cards[ch] || []) {
    if (c.st !== "on" || !unlocked(c, ch)) continue;
    if (c.c.state === "new") fresh.push([ch, c]); else if (c.c.due <= eod) rev.push([ch, c]);
  }
  rev.sort((a, b) => a[1].c.due - b[1].c.due);
  fresh.sort((a, b) => a[1].at - b[1].at);
  return { rev, fresh: fresh.filter(([, c]) => (c.t === "vocab" ? nv-- > 0 : nw-- > 0)) };
}
const dueCount = () => { const q = queue(); return q.rev.length + q.fresh.length; };
function nextCard() {
  const now = Date.now(), q = queue();
  return q.rev.find(([, c]) => c.c.due <= now) || q.fresh[0] || q.rev.find(([, c]) => c.c.due <= now + 20 * MIN) || null;
}
const secPerReview = () => { const D = Object.values(S.days), n = D.reduce((a, d) => a + (d.rv || 0), 0); return n >= 100 ? D.reduce((a, d) => a + (d.rvms || 0), 0) / n / 1000 : 10; };

/* ---------- Claude soạn thẻ theo quy tắc ở prompts/the-kien-thuc.md ---------- */
const RULES = JSON.parse(document.getElementById("m2-rules").textContent || '""');
async function fit(text, sample, reserve = 6000) {   // cắt nguồn cho vừa giới hạn đầu vào của Claude
  const lim = ((await sample.limits?.().catch(() => null))?.maxPromptBytes || 120e3) - reserve;
  const enc = new TextEncoder(); let t = text;
  while (enc.encode(t).length > lim) t = t.slice(0, Math.floor(t.length * 0.9));
  return t;
}
const plain = (html) => html.replace(/<figure[\s\S]*?<\/figure>/g, "").replace(/<\/(p|h\d|li|tr|div)>/g, "\n").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/[ \t]+/g, " ").trim();
const numbered = (blocks) => blocks.map((h, i) => `[§${i}] ${plain(h)}`).join("\n");
async function genCards(ch, { task, src, n, t = "wissen", v = "a", b = null }) {
  const sample = await getSample(); if (!sample) throw { code: "not_granted" };
  const c = BY[ch], have = (await getCards(ch)).map((x) => x.f);
  const prompt = `${RULES}\n\nYÊU CẦU\n${task}\nSố thẻ: ${n}.${c ? `\nKapitel: ${c.t} (${c.fach} › ${c.sub}, Tag ${c.tag})` : ""}${have.length ? `\n\nThẻ đã có (không soạn trùng ý):\n- ${have.slice(-80).join("\n- ")}` : ""}\n\nNỘI DUNG\n`;
  const arr = await sample.json(prompt + await fit(src, sample, new TextEncoder().encode(prompt).length + 4000), { modelTier: "complex" });
  if (!Array.isArray(arr)) throw new Error("Claude trả về sai định dạng, thử lại");
  const out = [];
  for (const x of arr) {
    if (!x || typeof x.front !== "string" || !/\{\{c\d+::/.test(x.front)) continue;
    const f = x.front.trim();
    if ([...have, ...out.map((o) => o.f)].some((h) => similar(h, f))) continue;
    out.push({ id: cid(), t, f, x: [x.vn && `VN: ${x.vn}`, x.why].filter(Boolean).join("\n"), b: b ?? (Number.isInteger(x.abschnitt) ? x.abschnitt : null), v,
      tags: [c?.fach, c && `Tag ${c.tag}`, x.typ].filter(Boolean).map(String), st: "draft", at: Date.now() });
  }
  if (out.length) putCards(ch, [...S.cards[ch], ...out]);

const LIBS = { sql: "https://cdn.jsdelivr.net/npm/sql.js@1.12.0/dist/sql-asm.js", fflate: "https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js", fzstd: "https://cdn.jsdelivr.net/npm/fzstd@0.1.1/umd/index.js" };

    else for (const d of Object.values(JSON.parse(db.exec("select decks from col")[0].values[0][0]))) decks[d.id] = d.name;
    const rows = db.exec("select n.id, n.flds, n.tags, min(c.did) from notes n join cards c on c.nid = n.id group by n.id")[0]?.values || [];
    return rows.map(([nid, flds, tags, did]) => { const fl = String(flds).split("\x1f"); return { nid: String(nid), f: cleanHtml(fl[0] || ""), x: cleanHtml(fl.slice(1).filter(Boolean).join("<br>")), tags: String(tags).trim().split(/\s+/).filter(Boolean), deck: decks[did] || "" }; }).filter((n) => n.f);

let TITLES = null;
/* Ankiphil gắn tag "$Lernpläne::100-Tage::074" = Lerntag 74 của đúng lộ trình này → chọn chương trong Tag đó.
   Không khớp chương nào thì vào "_d74" (thẻ chung của Tag 74, mở khi đọc xong cả Tag).
   Thẻ Ankiphil không thuộc lộ trình 100 ngày → null (ngăn "ngoài lộ trình"). Bộ thẻ khác: đoán theo tên chương. */
const STOP = new Set("und der die das des den dem bei mit von zur zum ein eine einer im in am auf fur oder sowie".split(" "));
function bestInDay(day, n) {
  const meta = " " + norm(n.tags.map((t) => t.split("::").slice(1).join(" ").replace(/_/g, " ")).join(" ")) + " ", body = " " + norm(n.f + " " + n.x) + " ";
  const leaves = " " + n.tags.map((t) => norm(t.split("::").pop().replace(/_/g, " "))).join("  ") + " ";
  let best = null, bs = 0;
  const fachW = new Set(norm(PLAN[day - 1].sub + " " + PLAN[day - 1].fach).split(" "));   // tên Fach của ngày: chương nào cũng có, không phân biệt được
  for (const c of PLAN[day - 1].ch) {
    const t = norm(c.t).split(" ").filter((w) => w.length >= 3 && !STOP.has(w) && !fachW.has(w)); if (!t.length) continue;
    let sc = 0; for (const w of t) sc += meta.includes(" " + w) ? 2 : body.includes(" " + w) ? 1 : 0;
    sc /= t.length;
    // tên chương có nguyên văn trong tag: ưu tiên; khớp đoạn cuối của tag (cụ thể nhất) thắng khớp đoạn giữa (Vorhofflimmern > Herzrhythmusstörungen),

}

  const tg = n.tags.join(" ");

  if (days.length) { const day = Math.min(...days); return bestInDay(day, n) || "_d" + day; }
  if (/Lernpläne|Ankiphil/i.test(tg)) return null;
  TITLES ||= CH.map((c) => ({ id: c.id, n: " " + norm(c.t) + " " })).filter((x) => x.n.trim().length >= 4).sort((a, b) => b.n.length - a.n.length);
  const meta = " " + norm(n.tags.join(" ").replace(/::|_/g, " ") + " " + n.deck.replace(/::/g, " ")) + " ";
  for (const t of TITLES) if (meta.includes(t.n)) return t.id;

      // chương + các doc phụ ch~2, ch~3… đã có từ lần nhập trước
      const docs = [ch, ...Object.keys(S.kap).filter((k) => k.startsWith(ch + "~")).sort((a, b) => +a.split("~")[1] - +b.split("~")[1])];
      const lists = []; for (const d of docs) lists.push([...await getCards(d)]);
      const ids = new Set(lists.flat().map((x) => x.id)), mine = lists.flat().filter((x) => x.t !== "apkg");
      let di = docs.length - 1, list = lists[di], size = sz(list); const dirty = new Set();
      for (const n of ns) {
        if (ids.has("a" + n.nid) || seen.has("a" + n.nid) || mine.some((x) => similar(x.f, n.f))) { dupes++; continue; }   // chỉ bỏ thẻ trùng ý với thẻ Claude/Vy soạn
        const card = toCard(n), cs = sz(card) + 1;
        if (size + cs > LIM) { di++; docs[di] ||= `${ch}~${di + 1}`; lists[di] ||= []; list = lists[di]; size = sz(list); }   // doc đầy: sang doc phụ của cùng chương
        list.push(card); dirty.add(di); ids.add(card.id); size += cs; added++; mapped++;
      }
      for (const d of dirty) await write(docs[d], lists[d]);
      apkgSay(st, `Đang ghi… ${++done} chương`);
    }
    let k = buckets.length ? +buckets.at(-1).slice(6) : 0, cur = k ? [...S.cards["_apkg-" + k]] : [], size = sz(cur);
    for (const n of groups._apkg || []) {
      if (seen.has("a" + n.nid)) { dupes++; continue; }
      const card = toCard(n), cs = sz(card) + 1;
      if (!k || size + cs > LIM) { if (k && cur.length) { await write("_apkg-" + k, cur); apkgSay(st, `Đang ghi… ngăn ${k}`); } k++; cur = []; size = 2; }
      cur.push(card); seen.add(card.id); size += cs; added++;
    }
    if (cur.length) await write("_apkg-" + k, cur);
    if (location.hash === "#on") viewReview();
    apkgSay(st, `Đã nhập ${added} thẻ: ${mapped} theo lộ trình (mở khi Vy đọc xong chương/Tag đó), ${added - mapped} ngoài lộ trình (bật ô bên dưới nếu muốn ôn); bỏ ${dupes} thẻ trùng. Hình trong thẻ được thay bằng [hình].`);
  } catch (e) { apkgSay(st, "Chưa nhập được: " + (e.message || e)); }
}
async function sha1int(s) { const h = new Uint8Array(await crypto.subtle.digest("SHA-1", new TextEncoder().encode(s))); return ((h[0] << 24) | (h[1] << 16) | (h[2] << 8) | h[3]) >>> 0; }
async function buildApkg(cards) {
  await libs("sql", "fflate");
  const SQL = await initSqlJs(), db = new SQL.Database(), now = Date.now(), crt = Math.floor(today0().getTime() / 1000);
  db.run(`CREATE TABLE col (id integer primary key, crt integer not null, mod integer not null, scm integer not null, ver integer not null, dty integer not null, usn integer not null, ls integer not null, conf text not null, models text not null, decks text not null, dconf text not null, tags text not null);
    CREATE TABLE notes (id integer primary key, guid text not null, mid integer not null, mod integer not null, usn integer not null, tags text not null, flds text not null, sfld integer not null, csum integer not null, flags integer not null, data text not null);
    CREATE TABLE cards (id integer primary key, nid integer not null, did integer not null, ord integer not null, mod integer not null, usn integer not null, type integer not null, queue integer not null, due integer not null, ivl integer not null, factor integer not null, reps integer not null, lapses integer not null, left integer not null, odue integer not null, odid integer not null, flags integer not null, data text not null);
    CREATE TABLE revlog (id integer primary key, cid integer not null, usn integer not null, ease integer not null, ivl integer not null, lastIvl integer not null, factor real not null, time integer not null, type integer not null);
    CREATE TABLE graves (usn integer not null, oid integer not null, type integer not null);`);
  const fld = (name, ord) => ({ name, ord, sticky: false, rtl: false, font: "Arial", size: 20, media: [] });
  const css = ".card{font-family:Arial;font-size:20px;text-align:center}.cloze{font-weight:bold;color:#3550c8}";
  const mbase = { mod: Math.floor(now / 1000), usn: -1, sortf: 0, did: 1, tags: [], vers: [], latexPre: "\\documentclass[12pt]{article}\n\\special{papersize=3in,5in}\n\\usepackage[utf8]{inputenc}\n\\usepackage{amssymb,amsmath}\n\\pagestyle{empty}\n\\setlength{\\parindent}{0in}\n\\begin{document}\n", latexPost: "\\end{document}", css };
  const MC = 1700000000001, MB = 1700000000002;
  const models = {
    [MC]: { ...mbase, id: MC, name: "M2 Cloze", type: 1, flds: [fld("Text", 0), fld("Extra", 1)], req: [[0, "any", [0]]], tmpls: [{ name: "Cloze", ord: 0, qfmt: "{{cloze:Text}}", afmt: "{{cloze:Text}}<br>{{Extra}}", did: null, bqfmt: "", bafmt: "" }] },
    [MB]: { ...mbase, id: MB, name: "M2 Basic", type: 0, flds: [fld("Front", 0), fld("Back", 1)], req: [[0, "all", [0]]], tmpls: [{ name: "Card 1", ord: 0, qfmt: "{{Front}}", afmt: "{{FrontSide}}<hr id=answer>{{Back}}", did: null, bqfmt: "", bafmt: "" }] },
  };
  const deck = (id, name) => ({ id, name, mod: Math.floor(now / 1000), usn: -1, lrnToday: [0, 0], revToday: [0, 0], newToday: [0, 0], timeToday: [0, 0], collapsed: false, desc: "", dyn: 0, conf: 1, extendNew: 10, extendRev: 50 });
  const decks = { 1: deck(1, "Default") }, did = {};
  const deckOf = (ch) => { const c = BY[base(ch)]; const parts = ["M2 AMBOSS", c ? c.fach : "Khác", c ? `Tag ${pad(c.tag)}` : null].filter(Boolean);
    let name = ""; for (const p of parts) { name = name ? name + "::" + p : p; if (!did[name]) { did[name] = 1700000001000 + Object.keys(did).length; decks[did[name]] = deck(did[name], name); } } return did[name]; };
  const dconf = { 1: { id: 1, name: "Default", mod: 0, usn: 0, maxTaken: 60, autoplay: true, timer: 0, replayq: true, dyn: false, new: { delays: [1, 10], ints: [1, 4, 7], initialFactor: 2500, order: 1, perDay: 20, bury: false }, lapse: { delays: [10], mult: 0, minInt: 1, leechFails: 8, leechAction: 0 }, rev: { perDay: 200, ease4: 1.3, ivlFct: 1, maxIvl: 36500, bury: false, hardFactor: 1.2 } } };
  const conf = { nextPos: cards.length + 1, estTimes: true, activeDecks: [1], sortType: "noteFld", timeLim: 0, sortBackwards: false, addToCur: true, curDeck: 1, newBury: true, newSpread: 0, dueCounts: true, curModel: MC, collapseTime: 1200 };
  const html = (card, k) => (card.h ? card[k] || "" : esc(card[k] || "").replace(/\n/g, "<br>"));
  let i = 0;
  for (const card of cards) {
    i++;
    const nid = now + i, cloze = /\{\{c\d+::/.test(card.f), f = html(card, "f"), x = html(card, "x"), sf = plain(f.replace(/\{\{c\d+::(.*?)(::.*?)?\}\}/g, "$1"));
    db.run("insert into notes values (?,?,?,?,?,?,?,?,?,?,?)", [nid, card.id, cloze ? MC : MB, Math.floor(now / 1000), -1, " " + (card.tags || []).map((t) => t.replace(/\s+/g, "_")).join(" ") + " ", f + "\x1f" + x, sf, await sha1int(sf), 0, ""]);
    const ords = cloze ? [...new Set([...card.f.matchAll(/\{\{c(\d+)::/g)].map((m) => +m[1] - 1))] : [0];
    const r = card.c?.state === "review" ? card.c : null;   // giữ tiến độ thẻ đang ôn; thẻ mới/đang học xuất là mới
    for (const ord of ords) db.run("insert into cards values (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)",
      [nid * 10 + ord, nid, deckOf(card.ch), ord, Math.floor(now / 1000), -1, r ? 2 : 0, r ? 2 : 0, r ? Math.round((r.due - crt * 1000) / DAY) : i, r ? r.ivl : 0, r ? Math.round(r.ease * 1000) : 0, r ? r.reps : 0, r ? r.lapses : 0, 0, 0, 0, 0, ""]);
  }
  db.run("insert into col values (1,?,?,?,11,0,0,0,?,?,?,?,?)", [crt, now, now, JSON.stringify(conf), JSON.stringify(models), JSON.stringify(decks), JSON.stringify(dconf), "{}"]);
  const bytes = db.export(); db.close();
  return fflate.zipSync({ "collection.anki2": bytes, media: fflate.strToU8("{}") });
}
async function exportApkg() {
  const st = $("#apkgst"); if (!DB) return toast("Chưa kết nối được kho dữ liệu");
  try {
    apkgSay(st, "Đang gom thẻ…");
    // shortcut: đọc tối đa 1000 doc thẻ (≈ 1000 chương/ngăn); vượt mức đó thì phân trang
    const snap = await DB.collection("cards").limit(1000).get();
    const cards = snap.docs.flatMap((d) => (d.data().list || []).filter((x) => x.st === "on").map((x) => ({ ...x, ch: d.id })));
    if (!cards.length) { apkgSay(st, "Chưa có thẻ nào để xuất."); return; }
    const zip = await buildApkg(cards);
    const dl = await window.claude?.use("downloads").catch(() => null);
    if (!dl) { apkgSay(st, "Trình xem này không cho tải file xuống."); return; }
    await dl.save({ filename: "M2-AMBOSS.apkg.zip", data: zip });
    apkgSay(st, `Đã xuất ${cards.length} thẻ. Đổi tên file thành "M2-AMBOSS.apkg" (bỏ đuôi .zip) rồi mở bằng Anki.`);
  } catch (e) { apkgSay(st, e?.code === "declined" ? "Đã huỷ tải xuống." : "Chưa xuất được: " + (e.message || e.code || e)); }
}

/* ---------- Tiến độ (dashboard) ---------- */
const active = (d) => dayMin(d) >= 5 || (d.rv || 0) >= 10;
function streak() {
  const c = cfg(); let n = 0, d = today0();
  if (!active(S.days[key(d)] || {})) d = addDays(d, -1);
  for (let i = 0; i < 3000; i++, d = addDays(d, -1)) {
    if (active(S.days[key(d)] || {})) n++;
    else if (d.getDay() !== c.rest || d < c.start) break;   // ngày nghỉ không làm đứt chuỗi
  }
  return n;
}
function barChart(label, vals, fmt, floor) {
  const W = 320, H = 120, P = 18, max = Math.max(floor, ...vals.map((v) => v.y)), bw = (W - P) / vals.length;
  return `<figure class="chart"><figcaption><b>${esc(label)}</b> · 30 ngày gần nhất</figcaption>
    <svg viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="${esc(label)}">
      <line x1="${P}" x2="${W}" y1="${H}" y2="${H}" class="ax"/><line x1="${P}" x2="${W}" y1="${H / 2}" y2="${H / 2}" class="grid"/>
      <text x="0" y="10" class="lbl">${fmt(max)}</text><text x="0" y="${H / 2 + 4}" class="lbl">${fmt(max / 2)}</text>
      ${vals.map((v, i) => { const h = v.y / max * (H - 8); return `<g class="bar"><rect x="${P + i * bw}" y="0" width="${bw}" height="${H}" class="hit"><title>${v.d}: ${fmt(v.y)}</title></rect>${v.y ? `<rect x="${P + i * bw + 1}" y="${H - h}" width="${bw - 2}" height="${h}" rx="2" class="fill"/>` : ""}</g>`; }).join("")}
      <text x="${P}" y="${H + 14}" class="lbl">${vals[0].d}</text><text x="${W}" y="${H + 14}" class="lbl" text-anchor="end">hôm nay</text>
    </svg></figure>`;
}

    <section class="card">${barChart("Thẻ ôn mỗi ngày", days.map((v) => ({ d: v.d, y: v.x.rv || 0 })), (y) => `${Math.round(y)}`, 20)}</section>
    <section class="card"><span class="eyebrow">Theo Fach</span>

    </section>

(async () => {
  const timeout = setTimeout(() => { if (!online) { S.off = true; rerender(); } }, 10e3);
  DB = await window.claude?.use("db").catch(() => null) ?? null;
  if (!DB) { clearTimeout(timeout); S.off = true; rerender(); return; }
  let first = true; const got = new Set();
  const ready = (what) => {
    // trang đọc mở trước khi kho sẵn sàng thì mở lại khi kho đã kết nối

    got.add(what);
    // ghi mốc "sáng nay còn bao nhiêu" một lần mỗi ngày, khi đã có đủ dữ liệu
    const tk = key(today0());

    rerender();
  };
  const fail = (e) => { clearTimeout(timeout); toast("Kho dữ liệu lỗi: " + (e.message || e.code)); };

  }, fail);
