<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const {
  Laugh, Sprout, Check, Gift, Sparkles, Play, Pause, RotateCcw, Timer,
  Trash2, Wand2, CalendarClock, BookOpen, Dumbbell, Utensils, Moon, Coffee, Circle, Loader2, Lock
} = LucideReact;

/* ---------- câu thoại của Nhơn ---------- */
const LINES = {
  open: "Mèn đét ơi, nay chị Vy mò lên đây luôn. Tính cày cuốc TestDaF đồ dữ dằn hen?",
  focus: "Ngồi thẳng cái lưng lên! Lo tập trung đi, chiều còn ra sân tung mấy cú đá chân sau nữa kìa!",
  taskDone: "Trời đựu, xuất sắc! Được của ló chị tui!",
  allDone: "Quá dữ! Nay giỏi, Nhơn thưởng cho ly trà sữa nha!",
  messy: "Viết chữ gì nùi nùi muốn lòi con mắt. Đưa mớ bòng bong đây Nhơn dọn cho...",
  // vài câu phụ cùng giọng cho những lúc chưa có câu sẵn
  paused: "Nghỉ xíu thôi nha, đừng có cầm điện thoại lướt luôn à!",
  timeUp: "Hết 25 phút rồi! Đứng dậy vươn vai, uống miếng nước đi chị.",
  sorting: "Từ từ, Nhơn đang lựa từng cọng nè…",
  sorted: "Xong rồi nè chị, lịch thẳng băng luôn. Làm theo đi nha!",
  empty: "Chị chưa vứt gì vô hết trơn, Nhơn xếp bằng niềm tin hả?",
};

/* ---------- lưu tạm trên máy (chỉ cho tiện) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("tram:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tram:" + k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- 1. Nhơn ---------- */
function NhonDialog({ line }) {
  const [shown, setShown] = useState("");
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { setShown(line.text); return; }
    setShown("");
    let i = 0;
    const id = setInterval(() => { i += 1; setShown(line.text.slice(0, i)); if (i >= line.text.length) clearInterval(id); }, 22);
    return () => clearInterval(id);
  }, [line.key]);
  const typing = shown.length < line.text.length;
  return (
    <div className="fixed inset-x-0 bottom-0 z-20"
      style={{ paddingLeft: "max(16px, env(safe-area-inset-left, 0px))", paddingRight: "max(16px, env(safe-area-inset-right, 0px))", paddingBottom: "calc(12px + env(safe-area-inset-bottom, 0px))" }}>
      <div className="mx-auto max-w-5xl rounded-2xl border border-line bg-surface/95 backdrop-blur px-4 py-3 flex gap-3 items-start"
        role="status" aria-live="polite" onClick={() => setShown(line.text)}>
        <div className="relative shrink-0 bob" aria-hidden="true">
          <div className="h-14 w-14 rounded-2xl bg-accent text-[#0E1A17] grid place-items-center">
            <Laugh size={32} strokeWidth={2.2} />
          </div>
          <div className="absolute -top-2 -right-1 h-6 w-6 rounded-full bg-raise border border-line grid place-items-center text-accent">
            <Sprout size={14} />
          </div>
        </div>
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-2">
            <span className="font-display text-lg leading-none text-accent">Nhơn</span>
            <span className="text-[11px] uppercase tracking-wider text-muted">em trai trực trạm</span>
          </div>
          <p className="mt-1 text-[15px] leading-relaxed min-h-[3em]">
            {shown}{typing && <span className="caret" />}
          </p>
        </div>
      </div>
    </div>
  );
}

/* ---------- 2. Daily Commissions ---------- */
function Commissions({ tasks, setTasks, locked, onTick, onLockedTry }) {
  const done = tasks.filter(t => t.done).length;
  const all = done === tasks.length;
  return (
    <section className={"rounded-2xl border bg-surface p-4 sm:p-5 flex flex-col gap-4 transition-all duration-500 " +
      (all ? "border-gold shadow-[0_0_0_1px_rgba(246,200,95,.5),0_0_32px_rgba(246,200,95,.28)]" : "border-line")}>
      <header className="flex items-center justify-between gap-3">
        <div>
          <p className="text-[11px] uppercase tracking-wider text-muted">Daily Commissions</p>
          <h2 className="font-display text-2xl leading-tight">Nhiệm vụ hôm nay</h2>
        </div>
        <div className={"flex items-center gap-1.5 rounded-full px-3 py-1 text-sm font-semibold tnum " + (all ? "bg-gold text-[#2A1F05]" : "bg-raise text-muted")}>
          {all ? <Gift size={16} /> : null}{done}/{tasks.length}
        </div>
      </header>
      <ul className="flex flex-col gap-2">
        {tasks.map((t, i) => (
          <li key={i} className={"flex items-center gap-3 rounded-xl border px-2 py-2 " + (t.done ? "border-transparent bg-raise" : "border-line")}>
            <button type="button"
              onClick={() => locked ? onLockedTry() : onTick(i)}
              aria-pressed={t.done} aria-label={(t.done ? "Bỏ tick: " : "Tick xong: ") + t.title}
              className={"h-11 w-11 shrink-0 rounded-xl border-2 grid place-items-center transition-colors " +
                (t.done ? (all ? "bg-gold border-gold text-[#2A1F05]" : "bg-accent border-accent text-[#0E1A17]") : "border-line text-muted hover:border-accent") +
                (locked && !t.done ? " opacity-60" : "")}>
              {t.done ? <Check size={22} strokeWidth={3} /> : locked ? <Lock size={16} /> : null}
            </button>
            <input id={"task-" + i} value={t.title}
              onChange={e => setTasks(ts => ts.map((x, j) => j === i ? { ...x, title: e.target.value } : x))}
              aria-label={"Tên nhiệm vụ " + (i + 1)}
              className={"min-w-0 flex-1 bg-transparent text-[15px] py-2 px-1 rounded-md outline-none focus:bg-raise " + (t.done ? "line-through text-muted" : "")} />
          </li>
        ))}
      </ul>
      <p className="text-xs text-muted flex items-center gap-1.5">
        {all ? <><Sparkles size={14} className="text-gold" /> Nhận thưởng rồi! Mai quay lại làm tiếp nha.</>
          : locked ? <><Lock size={14} /> Đang Pomodoro, khoá tick để tập trung.</>
          : "Chạm vào tên để sửa nhiệm vụ."}
      </p>
    </section>
  );
}

/* ---------- 3. Pomodoro ---------- */
const POMO = 25 * 60;
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function Pomodoro({ running, remaining, onStart, onPause, onReset }) {
  const R = 54, C = 2 * Math.PI * R, pct = 1 - remaining / POMO;
  const btn = "flex-1 min-h-[48px] rounded-xl font-semibold flex items-center justify-center gap-2 transition-colors disabled:opacity-40 disabled:cursor-not-allowed";
  return (
    <section className="rounded-2xl border border-line bg-surface p-4 sm:p-5 flex flex-col gap-4">
      <header className="flex items-center justify-between">
        <div>
          <p className="text-[11px] uppercase tracking-wider text-muted">Pomodoro</p>
          <h2 className="font-display text-2xl leading-tight">Ngồi yên 25 phút</h2>
        </div>
        <span className={"flex items-center gap-1.5 text-xs font-semibold rounded-full px-3 py-1 " + (running ? "bg-accent text-[#0E1A17]" : "bg-raise text-muted")}>
          <Timer size={14} />{running ? "Đang chạy" : remaining === 0 ? "Hết giờ" : remaining < POMO ? "Tạm dừng" : "Sẵn sàng"}
        </span>
      </header>
      <div className="relative mx-auto w-full max-w-[240px] aspect-square">
        <svg viewBox="0 0 120 120" className="w-full h-full -rotate-90" aria-hidden="true">
          <circle cx="60" cy="60" r={R} fill="none" stroke="#2A2F3A" strokeWidth="6" />
          <circle cx="60" cy="60" r={R} fill="none" stroke="#7FD1BE" strokeWidth="6" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C * (1 - pct)} style={{ transition: "stroke-dashoffset .3s linear" }} />
        </svg>
        <div className="absolute inset-0 grid place-items-center">
          <span className="font-display tnum text-6xl sm:text-7xl leading-none" aria-live="off">{mmss(remaining)}</span>
        </div>
      </div>
      <div className="flex gap-2">
        <button type="button" onClick={onStart} disabled={running || remaining === 0} className={btn + " bg-accent text-[#0E1A17] hover:brightness-110"}><Play size={18} />Bắt đầu</button>
        <button type="button" onClick={onPause} disabled={!running} className={btn + " bg-raise hover:bg-line"}><Pause size={18} />Tạm dừng</button>
        <button type="button" onClick={onReset} disabled={!running && remaining === POMO} className={btn + " bg-raise hover:bg-line"}><RotateCcw size={18} />Reset</button>
      </div>
    </section>
  );
}

/* ---------- 4. Auto-scheduler (mock) ---------- */
const CATS = [
  { re: /testdaf|đức|deutsch|hören|lesen|schreiben|sprechen|từ vựng|ngữ pháp|học/i, icon: BookOpen, label: "Học" },
  { re: /đá|tập|gym|võ|poomsae|taekwondo|đối kháng|chạy|plank|chamber/i, icon: Dumbbell, label: "Tập" },
  { re: /ăn|cơm|nấu|trà sữa|bữa/i, icon: Utensils, label: "Ăn" },
  { re: /ngủ|nghỉ trưa|đi ngủ/i, icon: Moon, label: "Nghỉ" },
  { re: /nghỉ|cà phê|cafe|giải lao/i, icon: Coffee, label: "Nghỉ" },
];
const hm = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
function mockSchedule(raw) {
  const items = raw.split(/\n|;|,(?=\s*\D)/).map(s => s.replace(/^\s*([-*•+>]|\d+[.)])\s*/, "").trim()).filter(s => s.length > 1);
  const parsed = items.map((line, idx) => {
    let rest = line, start = null, dur = null;
    const tm = rest.match(/(?:lúc\s*)?\b(\d{1,2})\s*(?:h|giờ|:)\s*(\d{2})?\b(?!\s*(?:tiếng|phút|p\b))/i);
    if (tm && +tm[1] < 24) { start = +tm[1] * 60 + (tm[2] ? +tm[2] : 0); rest = rest.replace(tm[0], " "); }
    const dm = rest.match(/(\d+(?:[.,]\d+)?)\s*(tiếng|giờ|phút|ph|p)\b/i);
    if (dm) { const n = parseFloat(dm[1].replace(",", ".")); dur = /tiếng|giờ/i.test(dm[2]) ? Math.round(n * 60) : Math.round(n); rest = rest.replace(dm[0], " "); }
    const cat = CATS.find(c => c.re.test(line)) || { icon: Circle, label: "Việc" };
    if (!dur) dur = cat.label === "Học" ? 50 : cat.label === "Tập" ? 60 : cat.label === "Ăn" ? 30 : 30;
    let title = rest.replace(/\s{2,}/g, " ").replace(/^[\s,.:-]+|[\s,.:-]+$/g, "");
    title = title ? title[0].toUpperCase() + title.slice(1) : line;
    return { idx, title, start, dur, cat };
  });
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  let cursor = Math.max(8 * 60, Math.ceil(nowMin / 15) * 15);
  const fixed = parsed.filter(p => p.start != null), free = parsed.filter(p => p.start == null);
  const out = fixed.map(p => ({ ...p, fixed: true }));
  const clash = (s, e) => out.some(o => s < o.start + o.dur && e > o.start);
  for (const p of free) {
    if (/ngủ/i.test(p.title) && !/trưa/i.test(p.title)) { out.push({ ...p, start: 22 * 60 + 30, fixed: false }); continue; }
    let s = cursor;
    while (clash(s, s + p.dur)) s += 15;
    out.push({ ...p, start: s, fixed: false });
    cursor = s + p.dur + 10;
  }
  return out.sort((a, b) => a.start - b.start);
}
function Scheduler({ text, setText, onMessy, onSort, onSorted, onEmpty }) {
  const [phase, setPhase] = useState("idle"); // idle | sorting | done
  const [blocks, setBlocks] = useState(() => store.get("blocks", []).map(b => ({ ...b, cat: CATS.find(c => c.label === b.catLabel) || { icon: Circle, label: b.catLabel || "Việc" } })));
  const messyT = useRef(null), warned = useRef(false);
  useEffect(() => { store.set("blocks", blocks.map(({ cat, ...b }) => ({ ...b, catLabel: cat.label }))); }, [blocks]);
  const onChange = e => {
    const v = e.target.value; setText(v);
    clearTimeout(messyT.current);
    messyT.current = setTimeout(() => {
      const lines = v.split("\n").filter(l => l.trim()).length;
      if (!warned.current && (lines >= 2 || v.trim().length > 35)) { warned.current = true; onMessy(); }
    }, 700);
  };
  const run = () => {
    if (!text.trim()) { onEmpty(); return; }
    setPhase("sorting"); onSort();
    setTimeout(() => { setBlocks(mockSchedule(text)); setPhase("done"); warned.current = false; onSorted(); }, 2000);
  };
  return (
    <section className="rounded-2xl border border-line bg-surface p-4 sm:p-5 flex flex-col gap-4">
      <header>
        <p className="text-[11px] uppercase tracking-wider text-muted">Auto-scheduler</p>
        <h2 className="font-display text-2xl leading-tight">Chỗ đổ rác kế hoạch</h2>
      </header>
      <div className="grid gap-4 lg:grid-cols-2">
        <div className="flex flex-col gap-3 min-w-0">
          <label htmlFor="dump" className="sr-only">Kế hoạch lộn xộn</label>
          <textarea id="dump" value={text} onChange={onChange} placeholder="Vứt kế hoạch lộn xộn vào đây..."
            className="w-full min-h-[260px] lg:min-h-[340px] resize-y rounded-xl border border-line bg-bg p-4 text-[15px] leading-relaxed outline-none focus:border-accent" />
          <div className="flex gap-2">
            <button type="button" onClick={run} disabled={phase === "sorting"}
              className="flex-1 min-h-[52px] rounded-xl bg-accent text-[#0E1A17] font-semibold flex items-center justify-center gap-2 hover:brightness-110 disabled:opacity-60">
              {phase === "sorting" ? <Loader2 size={18} className="animate-spin" /> : <Wand2 size={18} />}Nhơn xếp lịch đi
            </button>
            <button type="button" onClick={() => { setText(""); setBlocks([]); setPhase("idle"); warned.current = false; }}
              aria-label="Xoá hết" className="min-h-[52px] w-[52px] rounded-xl bg-raise hover:bg-line grid place-items-center text-muted">
              <Trash2 size={18} />
            </button>
          </div>
          <p className="text-xs text-muted">Mẹo: mỗi dòng một việc. Ghi “14h”, “lúc 9:30” để giữ giờ; “45p”, “1 tiếng” để đặt thời lượng.</p>
        </div>
        <div className="min-w-0 rounded-xl bg-bg border border-line p-4 min-h-[260px]">
          <div className="flex items-center gap-2 text-sm text-muted mb-3"><CalendarClock size={16} />Timeline</div>
          {phase === "sorting" ? (
            <div className="h-[220px] grid place-items-center text-muted">
              <div className="flex items-center gap-2"><Loader2 size={18} className="animate-spin text-accent" />Đang cặm cụi xếp...</div>
            </div>
          ) : blocks.length === 0 ? (
            <div className="h-[220px] grid place-items-center text-center text-muted text-sm px-4">
              Chưa có lịch. Đổ kế hoạch bên trái rồi bấm “Nhơn xếp lịch đi”.
            </div>
          ) : (
            <ol className="relative flex flex-col gap-2 pl-5 before:absolute before:left-[7px] before:top-2 before:bottom-2 before:w-px before:bg-line">
              {blocks.map((b, i) => {
                const Icon = b.cat.icon;
                return (
                  <li key={i} className="relative pop" style={{ animationDelay: i * 40 + "ms" }}>
                    <span className="absolute -left-5 top-4 h-[15px] w-[15px] rounded-full border-2 border-accent bg-bg" aria-hidden="true" />
                    <div className="rounded-xl bg-surface border border-line px-3 py-2.5 flex items-center gap-3">
                      <div className="h-9 w-9 shrink-0 rounded-lg bg-raise grid place-items-center text-accent"><Icon size={18} /></div>
                      <div className="min-w-0 flex-1">
                        <div className="tnum text-xs text-muted">{hm(b.start)} – {hm(b.start + b.dur)} · {b.dur} phút{b.fixed ? " · giờ cố định" : ""}</div>
                        <div className="text-[15px] font-medium break-words">{b.title}</div>
                      </div>
                    </div>
                  </li>
                );
              })}
            </ol>
          )}
        </div>
      </div>
    </section>
  );
}

/* ---------- App ---------- */
const DEFAULT_TASKS = [
  { title: "Học 30 từ vựng TestDaF", done: false },
  { title: "Luyện 1 bài Hören", done: false },
  { title: "Viết 1 đoạn Schreiben", done: false },
  { title: "Chamber hold 10 phút", done: false },
];
function App() {
  const [line, setLine] = useState({ text: LINES.open, key: 0 });
  const say = useCallback(k => setLine(l => ({ text: LINES[k], key: l.key + 1 })), []);
  const [tasks, setTasks] = useState(() => {
    const saved = store.get("tasks", null);
    const today = new Date().toDateString();
    if (saved && saved.day === today && Array.isArray(saved.list) && saved.list.length === 4) return saved.list;
    return (saved && Array.isArray(saved.list) && saved.list.length === 4 ? saved.list : DEFAULT_TASKS).map(t => ({ title: t.title, done: false }));
  });
  useEffect(() => { store.set("tasks", { day: new Date().toDateString(), list: tasks }); }, [tasks]);
  const [text, setText] = useState(() => store.get("dump", ""));
  useEffect(() => { store.set("dump", text); }, [text]);

  // Pomodoro: chạy theo mốc kết thúc để chuyển tab vẫn đúng giờ
  const [running, setRunning] = useState(false);
  const [remaining, setRemaining] = useState(POMO);
  const endAt = useRef(0);
  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      const left = Math.max(0, Math.round((endAt.current - Date.now()) / 1000));
      setRemaining(left);
      if (left === 0) { setRunning(false); say("timeUp"); }
    }, 250);
    return () => clearInterval(id);
  }, [running, say]);
  const start = () => { endAt.current = Date.now() + remaining * 1000; setRunning(true); say("focus"); };
  const pause = () => { setRemaining(Math.max(0, Math.round((endAt.current - Date.now()) / 1000))); setRunning(false); say("paused"); };
  const reset = () => { setRunning(false); setRemaining(POMO); };

  const tick = i => {
    const next = tasks.map((t, j) => j === i ? { ...t, done: !t.done } : t);
    setTasks(next);
    if (!tasks[i].done) say(next.every(t => t.done) ? "allDone" : "taskDone");
  };

  return (
    <div className="mx-auto max-w-5xl flex flex-col gap-4 pt-6">
      <header className="flex items-end justify-between gap-3 flex-wrap">
        <div>
          <p className="text-[11px] uppercase tracking-wider text-muted">trạm mở cửa · {new Date().toLocaleDateString("vi-VN", { weekday: "long", day: "numeric", month: "numeric" })}</p>
          <h1 className="font-display text-3xl sm:text-4xl leading-tight" style={{ textWrap: "balance" }}>Trạm Xả Rác Của Chị Vy</h1>
        </div>
      </header>
      <div className="grid gap-4 md:grid-cols-2">
        <Commissions tasks={tasks} setTasks={setTasks} locked={running} onTick={tick} onLockedTry={() => say("focus")} />
        <Pomodoro running={running} remaining={remaining} onStart={start} onPause={pause} onReset={reset} />
      </div>
      <Scheduler text={text} setText={setText}
        onMessy={() => say("messy")} onSort={() => say("sorting")} onSorted={() => say("sorted")} onEmpty={() => say("empty")} />
      <NhonDialog line={line} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
